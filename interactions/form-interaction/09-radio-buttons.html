<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Animated Radio Buttons</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial,sans-serif;}.container{background:#16213e;padding:50px;border-radius:20px;width:450px;}h1{text-align:center;margin-bottom:40px;color:#00ffff;}h2{color:#fff;font-size:18px;margin-bottom:20px;}.radio-group{display:flex;flex-direction:column;gap:15px;margin-bottom:40px;}.radio-item{position:relative;}.radio-item input{display:none;}.radio-item label{display:flex;align-items:center;padding:15px 20px;background:#0f3460;border-radius:10px;cursor:pointer;transition:all 0.3s;border:2px solid transparent;}.radio-item label:hover{background:#1e4d7a;transform:translateX(5px);}.radio-item input:checked+label{background:linear-gradient(135deg,#00ffff,#ff00ff);border-color:#00ffff;}.radio-circle{width:24px;height:24px;border:2px solid #fff;border-radius:50%;margin-right:15px;position:relative;transition:all 0.3s;}.radio-item input:checked+label .radio-circle{transform:scale(1.1);}.radio-circle::after{content:'';position:absolute;top:50%;left:50%;width:12px;height:12px;background:#fff;border-radius:50%;transform:translate(-50%,-50%) scale(0);transition:all 0.3s;}.radio-item input:checked+label .radio-circle::after{transform:translate(-50%,-50%) scale(1);}span{color:#fff;font-size:16px;}</style></head><body><div class="container"><h1>Select Your Plan</h1><h2>Choose a subscription:</h2><div class="radio-group"><div class="radio-item"><input type="radio" name="plan" id="free" checked><label for="free"><div class="radio-circle"></div><span>Free - $0/month</span></label></div><div class="radio-item"><input type="radio" name="plan" id="basic"><label for="basic"><div class="radio-circle"></div><span>Basic - $9/month</span></label></div><div class="radio-item"><input type="radio" name="plan" id="pro"><label for="pro"><div class="radio-circle"></div><span>Pro - $19/month</span></label></div><div class="radio-item"><input type="radio" name="plan" id="premium"><label for="premium"><div class="radio-circle"></div><span>Premium - $29/month</span></label></div></div></div></body></html>
