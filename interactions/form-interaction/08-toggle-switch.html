<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Toggle Switches</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial,sans-serif;}.container{background:#fff;padding:50px;border-radius:20px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.3);}h1{text-align:center;margin-bottom:40px;color:#667eea;}.toggle-item{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid #eee;}.toggle-info h3{font-size:16px;color:#333;margin-bottom:5px;}.toggle-info p{font-size:12px;color:#999;}.toggle-switch{position:relative;width:60px;height:30px;}.toggle-switch input{display:none;}.slider{position:absolute;top:0;left:0;right:0;bottom:0;background:#ddd;border-radius:30px;cursor:pointer;transition:all 0.3s;}.slider::before{content:'';position:absolute;width:24px;height:24px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:all 0.3s;}input:checked+.slider{background:linear-gradient(135deg,#667eea,#764ba2);}input:checked+.slider::before{transform:translateX(30px);}.toggle-item:last-child{border-bottom:none;}</style></head><body><div class="container"><h1>Toggle Switches</h1><div class="toggle-item"><div class="toggle-info"><h3>Dark Mode</h3><p>Enable dark theme</p></div><label class="toggle-switch"><input type="checkbox"><span class="slider"></span></label></div><div class="toggle-item"><div class="toggle-info"><h3>Notifications</h3><p>Receive push notifications</p></div><label class="toggle-switch"><input type="checkbox" checked><span class="slider"></span></label></div><div class="toggle-item"><div class="toggle-info"><h3>Auto-Save</h3><p>Automatically save changes</p></div><label class="toggle-switch"><input type="checkbox"><span class="slider"></span></label></div><div class="toggle-item"><div class="toggle-info"><h3>Sound Effects</h3><p>Play sound on actions</p></div><label class="toggle-switch"><input type="checkbox" checked><span class="slider"></span></label></div></div></body></html>
