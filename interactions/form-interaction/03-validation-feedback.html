<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Validation Feedback</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#a8edea,#fed6e3);font-family:Arial,sans-serif;}.container{background:#fff;padding:50px;border-radius:20px;width:400px;box-shadow:0 10px 40px rgba(0,0,0,0.1);}h1{text-align:center;margin-bottom:30px;color:#333;}.form-group{margin-bottom:25px;position:relative;}input{width:100%;padding:12px;font-size:14px;border:2px solid #ddd;border-radius:8px;outline:none;transition:all 0.3s;}input.valid{border-color:#4caf50;}input.invalid{border-color:#f44336;}.icon{position:absolute;right:15px;top:12px;font-size:20px;opacity:0;transition:opacity 0.3s;}input.valid~.icon.check{opacity:1;color:#4caf50;}input.invalid~.icon.cross{opacity:1;color:#f44336;}.message{font-size:12px;margin-top:5px;opacity:0;transition:opacity 0.3s;}input.invalid~.message{opacity:1;color:#f44336;}button{width:100%;padding:15px;background:#667eea;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:16px;transition:all 0.3s;}button:hover{background:#5568d3;}</style></head><body><div class="container"><h1>Form Validation</h1><form id="form"><div class="form-group"><input type="email" id="email" placeholder="Email Address"><span class="icon check">✓</span><span class="icon cross">✗</span><div class="message">Please enter a valid email</div></div><div class="form-group"><input type="password" id="password" placeholder="Password (min 8 chars)"><span class="icon check">✓</span><span class="icon cross">✗</span><div class="message">Password must be at least 8 characters</div></div><button type="submit">Submit</button></form></div><script>const email=document.getElementById('email'),password=document.getElementById('password');email.addEventListener('input',()=>{const valid=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value);email.className=valid?'valid':'invalid';});password.addEventListener('input',()=>{password.className=password.value.length>=8?'valid':'invalid';});document.getElementById('form').addEventListener('submit',e=>e.preventDefault());</script></body></html>
