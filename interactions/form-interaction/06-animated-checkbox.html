<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Animated Checkbox</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial,sans-serif;}.container{background:#fff;padding:50px;border-radius:20px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.3);}h1{text-align:center;margin-bottom:40px;color:#667eea;}.checkbox-group{margin-bottom:20px;}.checkbox-wrapper{display:flex;align-items:center;padding:15px;border-radius:10px;transition:all 0.3s;cursor:pointer;}.checkbox-wrapper:hover{background:#f5f5f5;}input[type="checkbox"]{display:none;}input[type="checkbox"]+.custom-checkbox{width:24px;height:24px;border:2px solid #667eea;border-radius:6px;margin-right:15px;position:relative;transition:all 0.3s;}input[type="checkbox"]:checked+.custom-checkbox{background:#667eea;transform:rotate(360deg);}input[type="checkbox"]:checked+.custom-checkbox::after{content:'✓';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:16px;animation:check 0.3s;}@keyframes check{0%{transform:translate(-50%,-50%) scale(0);}50%{transform:translate(-50%,-50%) scale(1.2);}100%{transform:translate(-50%,-50%) scale(1);}}label{flex:1;cursor:pointer;font-size:16px;color:#333;}</style></head><body><div class="container"><h1>Animated Checkboxes</h1><div class="checkbox-group"><div class="checkbox-wrapper"><input type="checkbox" id="cb1"><div class="custom-checkbox"></div><label for="cb1">Enable Notifications</label></div><div class="checkbox-wrapper"><input type="checkbox" id="cb2"><div class="custom-checkbox"></div><label for="cb2">Newsletter Subscription</label></div><div class="checkbox-wrapper"><input type="checkbox" id="cb3"><div class="custom-checkbox"></div><label for="cb3">Accept Terms & Conditions</label></div><div class="checkbox-wrapper"><input type="checkbox" id="cb4"><div class="custom-checkbox"></div><label for="cb4">Remember Me</label></div></div></div></body></html>
