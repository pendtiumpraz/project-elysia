<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Search Autocomplete</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial,sans-serif;}.container{width:500px;}.search-box{position:relative;}.search-input{width:100%;padding:20px 60px 20px 20px;font-size:18px;border:none;border-radius:50px;outline:none;box-shadow:0 10px 40px rgba(0,0,0,0.3);transition:all 0.3s;}.search-input:focus{box-shadow:0 10px 60px rgba(0,255,255,0.3);}.search-btn{position:absolute;right:10px;top:10px;width:50px;height:50px;background:linear-gradient(135deg,#00ffff,#ff00ff);border:none;border-radius:50%;color:#fff;font-size:20px;cursor:pointer;transition:all 0.3s;}.search-btn:hover{transform:scale(1.1);}.autocomplete{background:#16213e;margin-top:10px;border-radius:15px;overflow:hidden;max-height:0;transition:max-height 0.3s;box-shadow:0 10px 40px rgba(0,0,0,0.3);}.autocomplete.show{max-height:400px;}.item{padding:15px 20px;color:#fff;cursor:pointer;transition:all 0.3s;border-left:3px solid transparent;}.item:hover{background:#0f3460;border-left-color:#00ffff;}.item .highlight{color:#00ffff;font-weight:bold;}.no-results{padding:20px;text-align:center;color:#aaa;}</style></head><body><div class="container"><div class="search-box"><input type="text" class="search-input" placeholder="Search countries..." id="searchInput"><button class="search-btn">🔍</button></div><div class="autocomplete" id="autocomplete"></div></div><script>const countries=['Afghanistan','Albania','Algeria','Argentina','Australia','Austria','Bangladesh','Belgium','Brazil','Canada','China','Colombia','Denmark','Egypt','Finland','France','Germany','Greece','India','Indonesia','Iran','Iraq','Ireland','Israel','Italy','Japan','Kenya','Malaysia','Mexico','Netherlands','Nigeria','Norway','Pakistan','Philippines','Poland','Portugal','Romania','Russia','Saudi Arabia','Singapore','South Africa','South Korea','Spain','Sweden','Switzerland','Thailand','Turkey','Ukraine','United Kingdom','United States','Vietnam'];const input=document.getElementById('searchInput'),autocomplete=document.getElementById('autocomplete');input.addEventListener('input',function(){const val=this.value.toLowerCase();autocomplete.innerHTML='';if(!val){autocomplete.classList.remove('show');return;}const filtered=countries.filter(c=>c.toLowerCase().includes(val));if(filtered.length){autocomplete.classList.add('show');filtered.slice(0,8).forEach(c=>{const div=document.createElement('div');div.className='item';const regex=new RegExp(`(${val})`,'gi');div.innerHTML=c.replace(regex,'<span class="highlight">$1</span>');div.onclick=()=>{input.value=c;autocomplete.classList.remove('show');};autocomplete.appendChild(div);});}else{autocomplete.classList.add('show');autocomplete.innerHTML='<div class="no-results">No results found</div>';}});document.addEventListener('click',e=>{if(!e.target.closest('.container'))autocomplete.classList.remove('show');});</script></body></html>
