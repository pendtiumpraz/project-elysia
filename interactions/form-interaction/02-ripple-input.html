<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Ripple Input Effect</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial,sans-serif;}.container{background:#16213e;padding:50px;border-radius:20px;width:400px;}.form-group{position:relative;margin-bottom:30px;}input{width:100%;padding:15px;font-size:16px;background:transparent;border:none;border-bottom:2px solid #0f3460;color:#fff;outline:none;}.line{position:absolute;bottom:0;left:0;width:0;height:2px;background:linear-gradient(90deg,#00ffff,#ff00ff);transition:width 0.4s;}input:focus~.line{width:100%;}label{position:absolute;left:0;top:15px;color:#aaa;pointer-events:none;transition:all 0.3s;}input:focus~label,input:not(:placeholder-shown)~label{top:-20px;font-size:12px;color:#00ffff;}button{width:100%;padding:15px;background:linear-gradient(90deg,#00ffff,#ff00ff);color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;position:relative;overflow:hidden;}button::before{content:'';position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;background:rgba(255,255,255,0.5);transform:translate(-50%,-50%);transition:width 0.6s,height 0.6s;}button:active::before{width:300px;height:300px;}</style></head><body><div class="container"><form><div class="form-group"><input type="text" placeholder=" " required><label>Username</label><span class="line"></span></div><div class="form-group"><input type="email" placeholder=" " required><label>Email</label><span class="line"></span></div><div class="form-group"><input type="password" placeholder=" " required><label>Password</label><span class="line"></span></div><button type="submit">Sign Up</button></form></div></body></html>
