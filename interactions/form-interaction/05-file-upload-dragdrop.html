<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>File Upload Drag & Drop</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial,sans-serif;}.container{background:#16213e;padding:40px;border-radius:20px;width:500px;}.upload-area{border:3px dashed #0f3460;border-radius:15px;padding:60px;text-align:center;transition:all 0.3s;cursor:pointer;}.upload-area:hover,.upload-area.dragover{border-color:#00ffff;background:rgba(0,255,255,0.1);}.upload-icon{font-size:64px;margin-bottom:20px;}h3{color:#fff;margin-bottom:10px;}p{color:#aaa;font-size:14px;}input[type="file"]{display:none;}.preview-area{margin-top:30px;display:none;}.preview-item{background:#0f3460;padding:15px;border-radius:10px;margin-bottom:10px;display:flex;align-items:center;gap:15px;}img{width:60px;height:60px;object-fit:cover;border-radius:8px;}.file-info{flex:1;color:#fff;}.file-name{font-weight:bold;margin-bottom:5px;}.file-size{font-size:12px;color:#aaa;}.remove-btn{background:#f44336;color:#fff;border:none;padding:8px 15px;border-radius:5px;cursor:pointer;transition:all 0.3s;}.remove-btn:hover{background:#d32f2f;}</style></head><body><div class="container"><div class="upload-area" id="uploadArea"><div class="upload-icon">📁</div><h3>Drag & Drop Files Here</h3><p>or click to browse</p><input type="file" id="fileInput" multiple accept="image/*"></div><div class="preview-area" id="previewArea"></div></div><script>const uploadArea=document.getElementById('uploadArea'),fileInput=document.getElementById('fileInput'),previewArea=document.getElementById('previewArea');uploadArea.addEventListener('click',()=>fileInput.click());['dragenter','dragover','dragleave','drop'].forEach(e=>uploadArea.addEventListener(e,ev=>ev.preventDefault()));['dragenter','dragover'].forEach(e=>uploadArea.addEventListener(e,()=>uploadArea.classList.add('dragover')));['dragleave','drop'].forEach(e=>uploadArea.addEventListener(e,()=>uploadArea.classList.remove('dragover')));uploadArea.addEventListener('drop',e=>{const files=e.dataTransfer.files;handleFiles(files);});fileInput.addEventListener('change',e=>handleFiles(e.target.files));function handleFiles(files){if(files.length>0)previewArea.style.display='block';Array.from(files).forEach(file=>{const reader=new FileReader();reader.onload=e=>{const div=document.createElement('div');div.className='preview-item';div.innerHTML=`<img src="${e.target.result}"><div class="file-info"><div class="file-name">${file.name}</div><div class="file-size">${(file.size/1024).toFixed(2)} KB</div></div><button class="remove-btn" onclick="this.parentElement.remove()">Remove</button>`;previewArea.appendChild(div);};reader.readAsDataURL(file);});}</script></body></html>
