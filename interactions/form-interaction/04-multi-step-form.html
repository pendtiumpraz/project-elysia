<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Multi-Step Form</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial,sans-serif;}.container{background:#fff;padding:40px;border-radius:20px;width:500px;box-shadow:0 20px 60px rgba(0,0,0,0.3);}.progress-bar{display:flex;justify-content:space-between;margin-bottom:40px;}.step{width:30%;height:5px;background:#ddd;border-radius:10px;transition:all 0.3s;}.step.active{background:#667eea;}.form-step{display:none;}.form-step.active{display:block;}h2{margin-bottom:20px;color:#333;}.form-group{margin-bottom:20px;}label{display:block;margin-bottom:5px;color:#666;font-size:14px;}input,select{width:100%;padding:12px;border:2px solid#ddd;border-radius:8px;font-size:14px;outline:none;}input:focus,select:focus{border-color:#667eea;}.buttons{display:flex;gap:10px;margin-top:30px;}button{flex:1;padding:12px;border:none;border-radius:8px;cursor:pointer;font-size:16px;transition:all 0.3s;}.btn-next{background:#667eea;color:#fff;}.btn-next:hover{background:#5568d3;}.btn-prev{background:#ddd;color:#333;}.btn-prev:hover{background:#ccc;}</style></head><body><div class="container"><div class="progress-bar"><div class="step active"></div><div class="step"></div><div class="step"></div></div><form><div class="form-step active"><h2>Step 1: Personal Info</h2><div class="form-group"><label>Full Name</label><input type="text" required></div><div class="form-group"><label>Email</label><input type="email" required></div><div class="buttons"><button type="button" class="btn-next" onclick="nextStep()">Next</button></div></div><div class="form-step"><h2>Step 2: Address</h2><div class="form-group"><label>Street</label><input type="text" required></div><div class="form-group"><label>City</label><input type="text" required></div><div class="buttons"><button type="button" class="btn-prev" onclick="prevStep()">Back</button><button type="button" class="btn-next" onclick="nextStep()">Next</button></div></div><div class="form-step"><h2>Step 3: Confirmation</h2><p style="margin-bottom:20px;color:#666;">Review your information and submit.</p><div class="buttons"><button type="button" class="btn-prev" onclick="prevStep()">Back</button><button type="submit" class="btn-next">Submit</button></div></div></form></div><script>let currentStep=0;const steps=document.querySelectorAll('.form-step'),progressSteps=document.querySelectorAll('.progress-bar .step');function showStep(n){steps.forEach((s,i)=>s.classList.toggle('active',i===n));progressSteps.forEach((s,i)=>s.classList.toggle('active',i<=n));}function nextStep(){if(currentStep<steps.length-1){currentStep++;showStep(currentStep);}}function prevStep(){if(currentStep>0){currentStep--;showStep(currentStep);}}</script></body></html>
