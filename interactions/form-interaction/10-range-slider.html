<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Range Slider</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial,sans-serif;}.container{background:#fff;padding:50px;border-radius:20px;width:500px;box-shadow:0 20px 60px rgba(0,0,0,0.3);}h1{text-align:center;margin-bottom:50px;color:#667eea;}.slider-group{margin-bottom:40px;}.slider-label{display:flex;justify-content:space-between;margin-bottom:15px;}h3{color:#333;font-size:16px;}.value{color:#667eea;font-size:20px;font-weight:bold;}.slider{width:100%;height:8px;background:#e0e0e0;border-radius:10px;outline:none;-webkit-appearance:none;position:relative;}.slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:50%;cursor:pointer;box-shadow:0 4px 12px rgba(102,126,234,0.4);transition:all 0.3s;}.slider::-webkit-slider-thumb:hover{transform:scale(1.2);box-shadow:0 6px 20px rgba(102,126,234,0.6);}.slider::-moz-range-thumb{width:24px;height:24px;background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:50%;cursor:pointer;box-shadow:0 4px 12px rgba(102,126,234,0.4);}.track{height:8px;background:linear-gradient(to right,#667eea 0%,#667eea 50%,#e0e0e0 50%,#e0e0e0 100%);border-radius:10px;position:absolute;top:0;left:0;width:100%;pointer-events:none;}.result{background:#f5f5f5;padding:30px;border-radius:15px;text-align:center;}.result h2{color:#333;margin-bottom:15px;}.result p{color:#666;font-size:18px;}</style></head><body><div class="container"><h1>Range Sliders</h1><div class="slider-group"><div class="slider-label"><h3>Volume</h3><span class="value" id="volumeValue">50%</span></div><input type="range" class="slider" min="0" max="100" value="50" id="volume"></div><div class="slider-group"><div class="slider-label"><h3>Brightness</h3><span class="value" id="brightnessValue">75%</span></div><input type="range" class="slider" min="0" max="100" value="75" id="brightness"></div><div class="slider-group"><div class="slider-label"><h3>Price Range</h3><span class="value" id="priceValue">$500</span></div><input type="range" class="slider" min="0" max="1000" value="500" id="price"></div><div class="result"><h2>Selected Values</h2><p id="result">Volume: 50% | Brightness: 75% | Price: $500</p></div></div><script>const volume=document.getElementById('volume'),brightness=document.getElementById('brightness'),price=document.getElementById('price');function updateValues(){document.getElementById('volumeValue').textContent=volume.value+'%';document.getElementById('brightnessValue').textContent=brightness.value+'%';document.getElementById('priceValue').textContent='$'+price.value;document.getElementById('result').textContent=`Volume: ${volume.value}% | Brightness: ${brightness.value}% | Price: $${price.value}`;volume.style.background=`linear-gradient(to right,#667eea 0%,#667eea ${volume.value}%,#e0e0e0 ${volume.value}%,#e0e0e0 100%)`;brightness.style.background=`linear-gradient(to right,#667eea 0%,#667eea ${brightness.value}%,#e0e0e0 ${brightness.value}%,#e0e0e0 100%)`;price.style.background=`linear-gradient(to right,#667eea 0%,#667eea ${price.value/10}%,#e0e0e0 ${price.value/10}%,#e0e0e0 100%)`;}volume.addEventListener('input',updateValues);brightness.addEventListener('input',updateValues);price.addEventListener('input',updateValues);updateValues();</script></body></html>
