<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Floating Labels</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial,sans-serif;}.container{background:#fff;padding:50px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);width:400px;}h1{text-align:center;margin-bottom:40px;color:#667eea;}.form-group{position:relative;margin-bottom:30px;}input{width:100%;padding:15px;font-size:16px;border:2px solid #ddd;border-radius:8px;outline:none;transition:all 0.3s;}input:focus{border-color:#667eea;}label{position:absolute;left:15px;top:15px;color:#999;pointer-events:none;transition:all 0.3s;font-size:16px;}input:focus+label,input:not(:placeholder-shown)+label{top:-10px;left:10px;font-size:12px;color:#667eea;background:#fff;padding:0 5px;}button{width:100%;padding:15px;background:#667eea;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;transition:all 0.3s;}button:hover{background:#5568d3;transform:translateY(-2px);box-shadow:0 5px 15px rgba(102,126,234,0.4);}</style></head><body><div class="container"><h1>Floating Labels</h1><form><div class="form-group"><input type="text" placeholder=" " required><label>Full Name</label></div><div class="form-group"><input type="email" placeholder=" " required><label>Email Address</label></div><div class="form-group"><input type="password" placeholder=" " required><label>Password</label></div><button type="submit">Submit</button></form></div></body></html>
