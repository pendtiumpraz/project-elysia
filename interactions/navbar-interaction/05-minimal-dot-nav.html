<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Dot Navigation</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        
        body {
            font-family: 'Arial', sans-serif;
            scroll-behavior: smooth;
        }
        
        .section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            color: white;
            font-weight: bold;
        }
        
        .section-1 {background: linear-gradient(135deg, #667eea, #764ba2);}
        .section-2 {background: linear-gradient(135deg, #f093fb, #f5576c);}
        .section-3 {background: linear-gradient(135deg, #4facfe, #00f2fe);}
        .section-4 {background: linear-gradient(135deg, #43e97b, #38f9d7);}
        .section-5 {background: linear-gradient(135deg, #fa709a, #fee140);}
        
        .dot-nav {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1000;
        }
        
        .dot {
            width: 15px;
            height: 15px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            margin: 20px 0;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        
        .dot::before {
            content: attr(data-tooltip);
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 14px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        .dot:hover::before {
            opacity: 1;
        }
        
        .dot:hover {
            background: white;
            transform: scale(1.3);
        }
        
        .dot.active {
            background: white;
            width: 30px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="dot-nav" id="dotNav">
        <div class="dot active" data-tooltip="Home" data-target="0"></div>
        <div class="dot" data-tooltip="About" data-target="1"></div>
        <div class="dot" data-tooltip="Services" data-target="2"></div>
        <div class="dot" data-tooltip="Portfolio" data-target="3"></div>
        <div class="dot" data-tooltip="Contact" data-target="4"></div>
    </div>
    
    <div class="section section-1">🏠 HOME</div>
    <div class="section section-2">ℹ️ ABOUT</div>
    <div class="section section-3">⚙️ SERVICES</div>
    <div class="section section-4">📁 PORTFOLIO</div>
    <div class="section section-5">📞 CONTACT</div>
    
    <script>
        const dots = document.querySelectorAll('.dot');
        const sections = document.querySelectorAll('.section');
        
        dots.forEach(dot => {
            dot.addEventListener('click', () => {
                const target = parseInt(dot.dataset.target);
                sections[target].scrollIntoView({behavior: 'smooth'});
            });
        });
        
        window.addEventListener('scroll', () => {
            let current = '';
            sections.forEach((section, index) => {
                const sectionTop = section.offsetTop;
                if (window.scrollY >= sectionTop - 200) {
                    current = index;
                }
            });
            
            dots.forEach((dot, index) => {
                dot.classList.remove('active');
                if (index === current) {
                    dot.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
