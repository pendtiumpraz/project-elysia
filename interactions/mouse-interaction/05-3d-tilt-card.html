<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tilt Card - Mouse Interaction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            perspective: 1000px;
        }
        
        h1 {
            color: white;
            margin-bottom: 50px;
            font-size: 48px;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .card-container {
            width: 400px;
            height: 500px;
            position: relative;
        }
        
        .card {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            transition: transform 0.1s;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 255, 255, 0.3), transparent 50%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .card:hover::before {
            opacity: 1;
        }
        
        .card-content {
            color: white;
            transform: translateZ(50px);
        }
        
        .card h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }
        
        .card p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .card-icon {
            font-size: 80px;
            margin-bottom: 20px;
            transform: translateZ(80px);
        }
        
        .info {
            position: absolute;
            bottom: 50px;
            color: white;
            font-size: 18px;
            text-align: center;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h1>🎴 3D Tilt Card</h1>
    
    <div class="card-container">
        <div class="card" id="tiltCard">
            <div class="card-content">
                <div class="card-icon">✨</div>
                <h2>Magic Card</h2>
                <p>Move your mouse over this card to see the 3D tilt effect in action!</p>
                <p>The card follows your cursor movement with smooth parallax animation.</p>
                <p>This creates an immersive depth perception that makes the UI feel alive.</p>
            </div>
        </div>
    </div>
    
    <div class="info">
        💡 Hover over the card and move your mouse around!
    </div>
    
    <script>
        const card = document.getElementById('tiltCard');
        const cardContainer = card.parentElement;
        
        cardContainer.addEventListener('mousemove', (e) => {
            const rect = cardContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = (y - centerY) / 10;
            const rotateY = (centerX - x) / 10;
            
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
            
            // Update light effect position
            const mouseXPercent = (x / rect.width) * 100;
            const mouseYPercent = (y / rect.height) * 100;
            card.style.setProperty('--mouse-x', mouseXPercent + '%');
            card.style.setProperty('--mouse-y', mouseYPercent + '%');
        });
        
        cardContainer.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0) rotateY(0) scale(1)';
        });
    </script>
</body>
</html>
