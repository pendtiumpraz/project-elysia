<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Bookmark Button</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;gap:50px;}.bookmark-btn{width:60px;height:80px;background:#16213e;border:none;position:relative;cursor:pointer;transition:all 0.3s;clip-path:polygon(0 0,100% 0,100% 80%,50% 100%,0 80%);}.bookmark-btn:hover{transform:translateY(-5px);}.bookmark-btn.active{background:linear-gradient(135deg,#00ffff,#ff00ff);animation:save 0.5s;}@keyframes save{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}.icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:32px;}</style></head><body><button class="bookmark-btn" onclick="this.classList.toggle('active')"><span class="icon">📑</span></button><button class="bookmark-btn" onclick="this.classList.toggle('active')"><span class="icon">🔖</span></button><button class="bookmark-btn" onclick="this.classList.toggle('active')"><span class="icon">⭐</span></button></body></html>
