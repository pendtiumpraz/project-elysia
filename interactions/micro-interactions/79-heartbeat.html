<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Heartbeat</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}.heart{font-size:128px;animation:heartbeat 1.5s infinite;}@keyframes heartbeat{0%,100%{transform:scale(1);}10%{transform:scale(1.3);}20%{transform:scale(1);}30%{transform:scale(1.3);}40%{transform:scale(1);}}</style></head><body><div class="heart">❤️</div></body></html>
