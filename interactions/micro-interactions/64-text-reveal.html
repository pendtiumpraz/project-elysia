<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Text Reveal</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial;}.text{font-size:72px;font-weight:bold;color:#00ffff;position:relative;overflow:hidden;}.text::before{content:attr(data-text);position:absolute;top:0;left:0;width:0;color:#fff;overflow:hidden;white-space:nowrap;animation:reveal 3s ease-in-out forwards;}@keyframes reveal{to{width:100%;}}</style></head><body><div class="text" data-text="REVEALED TEXT">REVEALED TEXT</div></body></html>
