<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Confetti Burst</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;}button{padding:20px 40px;background:linear-gradient(135deg,#f093fb,#f5576c);border:none;border-radius:50px;color:#fff;font-size:24px;font-weight:bold;cursor:pointer;transition:transform 0.3s;}button:hover{transform:scale(1.1);}.confetti{position:fixed;width:10px;height:10px;animation:fall 3s linear forwards;pointer-events:none;}@keyframes fall{to{transform:translateY(100vh) rotate(720deg);opacity:0;}}</style></head><body><button onclick="burst()">🎉 Celebrate!</button><script>function burst(){for(let i=0;i<50;i++){const confetti=document.createElement('div');confetti.className='confetti';confetti.style.left=window.innerWidth/2+'px';confetti.style.top=window.innerHeight/2+'px';confetti.style.background=['#ff0000','#00ff00','#0000ff','#ffff00','#ff00ff','#00ffff'][Math.floor(Math.random()*6)];confetti.style.transform=`translate(${Math.random()*400-200}px,-50px) rotate(${Math.random()*360}deg)`;document.body.appendChild(confetti);setTimeout(()=>confetti.remove(),3000);}}</script></body></html>
