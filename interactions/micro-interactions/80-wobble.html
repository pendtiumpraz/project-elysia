<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Wobble</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);}.wobble{width:200px;height:200px;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:64px;animation:wobble 1s infinite;box-shadow:0 20px 60px rgba(0,0,0,0.3);}@keyframes wobble{0%,100%{transform:translateX(0);}15%{transform:translateX(-25px) rotate(-5deg);}30%{transform:translateX(20px) rotate(3deg);}45%{transform:translateX(-15px) rotate(-3deg);}60%{transform:translateX(10px) rotate(2deg);}75%{transform:translateX(-5px) rotate(-1deg);}}</style></head><body><div class="wobble">🎮</div></body></html>
