<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Flash Animation</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;}.flash{width:200px;height:200px;background:linear-gradient(135deg,#00ffff,#ff00ff);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:64px;animation:flash 2s infinite;}@keyframes flash{0%,50%,100%{opacity:1;}25%,75%{opacity:0;}}</style></head><body><div class="flash">⚡</div></body></html>
