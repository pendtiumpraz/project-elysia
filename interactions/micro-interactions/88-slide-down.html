<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Slide Down</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;flex-direction:column;gap:20px;}.box{background:linear-gradient(135deg,#00ffff,#ff00ff);padding:30px 50px;border-radius:15px;color:#fff;font-size:24px;font-weight:bold;animation:slideDown 0.6s backwards;}.box:nth-child(1){animation-delay:0s;}.box:nth-child(2){animation-delay:0.2s;}.box:nth-child(3){animation-delay:0.4s;}@keyframes slideDown{from{opacity:0;transform:translateY(-100px);}to{opacity:1;transform:translateY(0);}}</style></head><body><div class="box">Item 1</div><div class="box">Item 2</div><div class="box">Item 3</div></body></html>
