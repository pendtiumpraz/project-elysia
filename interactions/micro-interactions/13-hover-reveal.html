<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Hover Reveal</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;gap:30px;}.box{width:150px;height:150px;background:#16213e;border-radius:15px;position:relative;overflow:hidden;cursor:pointer;}.content{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;transition:transform 0.3s;}.reveal{position:absolute;inset:0;background:linear-gradient(135deg,#00ffff,#ff00ff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;transform:translateY(100%);transition:transform 0.3s;}.box:hover .content{transform:translateY(-100%);}.box:hover .reveal{transform:translateY(0);}</style></head><body><div class="box"><div class="content">😊</div><div class="reveal">Happy</div></div><div class="box"><div class="content">⚡</div><div class="reveal">Energy</div></div><div class="box"><div class="content">🎨</div><div class="reveal">Creative</div></div><div class="box"><div class="content">🚀</div><div class="reveal">Launch</div></div></body></html>
