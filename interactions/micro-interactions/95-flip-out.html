<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Flip Out</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);}.flip{width:200px;height:200px;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:64px;animation:flipOut 0.75s;}@keyframes flipOut{from{transform:perspective(400px);}30%{transform:perspective(400px) rotateY(-15deg);opacity:1;}to{transform:perspective(400px) rotateY(90deg);opacity:0;}}</style></head><body><div class="flip">🃏</div></body></html>
