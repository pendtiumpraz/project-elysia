<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Pulse Button</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;gap:50px;}.pulse-btn{padding:25px 50px;background:#f44336;color:#fff;border:none;border-radius:50px;font-size:20px;font-weight:bold;cursor:pointer;position:relative;animation:pulse 2s infinite;}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(244,67,54,0.7);}70%{box-shadow:0 0 0 30px rgba(244,67,54,0);}100%{box-shadow:0 0 0 0 rgba(244,67,54,0);}}</style></head><body><button class="pulse-btn">Click Me</button><button class="pulse-btn" style="background:#4caf50;animation:pulse2 2s infinite;">Try This</button><style>@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(76,175,80,0.7);}70%{box-shadow:0 0 0 30px rgba(76,175,80,0);}100%{box-shadow:0 0 0 0 rgba(76,175,80,0);}}</style></body></html>
