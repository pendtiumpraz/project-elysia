<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Rotate In</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;}.rotate{width:200px;height:200px;background:linear-gradient(135deg,#00ffff,#ff00ff);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:64px;animation:rotateIn 1s;}@keyframes rotateIn{from{transform:rotate(-200deg) scale(0);opacity:0;}to{transform:rotate(0) scale(1);opacity:1;}}</style></head><body><div class="rotate">🌀</div></body></html>
