<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Ripple Effect</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;gap:30px;}.ripple-btn{padding:20px 40px;background:#667eea;color:#fff;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;position:relative;overflow:hidden;}.ripple-circle{position:absolute;background:rgba(255,255,255,0.6);border-radius:50%;transform:scale(0);animation:ripple 0.6s ease-out;}@keyframes ripple{to{transform:scale(4);opacity:0;}}</style></head><body><button class="ripple-btn" onclick="ripple(event,this)">Click Me</button><button class="ripple-btn" onclick="ripple(event,this)">Try This</button><script>function ripple(e,btn){const circle=document.createElement('div');circle.className='ripple-circle';const rect=btn.getBoundingClientRect();circle.style.left=(e.clientX-rect.left)+'px';circle.style.top=(e.clientY-rect.top)+'px';circle.style.width=circle.style.height='100px';btn.appendChild(circle);setTimeout(()=>circle.remove(),600);}</script></body></html>
