<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Like Button</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:50px;}.like-btn{width:80px;height:80px;background:#fff;border:none;border-radius:50%;font-size:40px;cursor:pointer;transition:all 0.3s;box-shadow:0 10px 30px rgba(0,0,0,0.2);}.like-btn:hover{transform:scale(1.1);}.like-btn.liked{animation:like 0.5s;}@keyframes like{0%,100%{transform:scale(1);}50%{transform:scale(1.3);}}.like-btn.liked::before{content:'';position:absolute;width:100%;height:100%;border-radius:50%;background:rgba(255,0,0,0.5);animation:burst 0.5s;}@keyframes burst{from{transform:scale(0);opacity:1;}to{transform:scale(2);opacity:0;}}</style></head><body><button class="like-btn" onclick="this.classList.toggle('liked');this.textContent=this.classList.contains('liked')?'❤️':'🤍'">🤍</button><button class="like-btn" onclick="this.classList.toggle('liked');this.textContent=this.classList.contains('liked')?'⭐':'☆'">☆</button><button class="like-btn" onclick="this.classList.toggle('liked');this.textContent=this.classList.contains('liked')?'👍':'👎'">👍</button></body></html>
