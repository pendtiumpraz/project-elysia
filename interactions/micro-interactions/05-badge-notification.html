<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Badge Notifications</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:50px;font-family:Arial;}.icon-btn{position:relative;width:80px;height:80px;background:#fff;border:none;border-radius:50%;font-size:36px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,0.2);transition:transform 0.3s;}.icon-btn:hover{transform:scale(1.1);}.badge{position:absolute;top:-5px;right:-5px;width:30px;height:30px;background:#f44336;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;animation:bounce 0.5s;}@keyframes bounce{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}.pulse-badge{animation:pulse 2s infinite;}@keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.3);opacity:0.7;}}</style></head><body><button class="icon-btn">📧<span class="badge">5</span></button><button class="icon-btn">🔔<span class="badge pulse-badge">3</span></button><button class="icon-btn">💬<span class="badge">12</span></button></body></html>
