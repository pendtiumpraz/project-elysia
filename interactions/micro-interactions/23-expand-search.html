<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Expand Search</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);}.search-container{position:relative;}.search-box{width:50px;height:50px;background:#fff;border:none;border-radius:50px;outline:none;padding:0 20px;font-size:16px;transition:all 0.5s;cursor:pointer;}.search-box.expanded{width:400px;padding:0 50px 0 20px;cursor:text;}.search-btn{position:absolute;right:0;top:0;width:50px;height:50px;background:transparent;border:none;font-size:20px;cursor:pointer;color:#667eea;}</style></head><body><div class="search-container"><input type="text" class="search-box" id="search" placeholder="Search..." onfocus="this.classList.add('expanded')" onblur="if(!this.value)this.classList.remove('expanded')"><button class="search-btn">🔍</button></div></body></html>
