<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Swipe Card</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;}.card{width:300px;height:400px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;font-weight:bold;cursor:grab;transition:transform 0.3s;box-shadow:0 20px 60px rgba(0,0,0,0.5);user-select:none;}.card:active{cursor:grabbing;}</style></head><body><div class="card" id="card">Swipe Me!</div><script>const card=document.getElementById('card');let startX,currentX,isDragging=false;card.addEventListener('mousedown',e=>{isDragging=true;startX=e.clientX;card.style.transition='none';});document.addEventListener('mousemove',e=>{if(!isDragging)return;currentX=e.clientX-startX;card.style.transform=`translateX(${currentX}px) rotate(${currentX*0.1}deg)`;});document.addEventListener('mouseup',()=>{if(!isDragging)return;isDragging=false;card.style.transition='transform 0.3s';if(Math.abs(currentX)>100){card.style.transform=`translateX(${currentX>0?1000:-1000}px) rotate(${currentX*0.5}deg)`;setTimeout(()=>{card.style.transition='none';card.style.transform='translateX(0) rotate(0)';setTimeout(()=>card.style.transition='transform 0.3s',10);},300);}else{card.style.transform='translateX(0) rotate(0)';}});</script></body></html>
