<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Number Increment</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:50px;}.counter-control{text-align:center;background:#fff;padding:30px;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,0.2);}.number{font-size:96px;font-weight:bold;color:#667eea;margin:20px 0;}.buttons{display:flex;gap:15px;justify-content:center;}button{width:60px;height:60px;border:none;border-radius:50%;font-size:32px;cursor:pointer;background:#667eea;color:#fff;transition:all 0.3s;}button:hover{transform:scale(1.1);box-shadow:0 5px 15px rgba(102,126,234,0.5);}button:active{transform:scale(0.95);}</style></head><body><div class="counter-control"><h2>Counter</h2><div class="number" id="num">0</div><div class="buttons"><button onclick="decrement()">−</button><button onclick="reset()">↻</button><button onclick="increment()">+</button></div></div><script>let count=0;function increment(){count++;updateDisplay();}function decrement(){count--;updateDisplay();}function reset(){count=0;updateDisplay();}function updateDisplay(){document.getElementById('num').textContent=count;}</script></body></html>
