<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Bounce Out</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;}.bounce{width:150px;height:150px;background:linear-gradient(135deg,#00ffff,#ff00ff);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:48px;animation:bounceOut 1s;}@keyframes bounceOut{20%{transform:scale(0.9);}50%,55%{transform:scale(1.1);opacity:1;}100%{transform:scale(0.3);opacity:0;}}</style></head><body><div class="bounce">💥</div></body></html>
