<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Tab Bar</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;}.tab-bar{display:flex;background:#16213e;padding:10px;border-radius:50px;gap:10px;}.tab{width:70px;height:70px;border:none;background:transparent;color:#aaa;border-radius:50%;font-size:32px;cursor:pointer;transition:all 0.3s;position:relative;}.tab.active{background:#0f3460;color:#00ffff;transform:translateY(-10px);box-shadow:0 10px 20px rgba(0,255,255,0.3);}</style></head><body><div class="tab-bar"><button class="tab active" onclick="setActive(this)">🏠</button><button class="tab" onclick="setActive(this)">🔍</button><button class="tab" onclick="setActive(this)">💬</button><button class="tab" onclick="setActive(this)">👤</button></div><script>function setActive(el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');}</script></body></html>
