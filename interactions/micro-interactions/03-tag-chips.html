<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Tag Chips</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial;}.container{background:#fff;padding:40px;border-radius:20px;width:500px;}.tags{display:flex;flex-wrap:wrap;gap:10px;}.tag{padding:10px 20px;background:#e0e0e0;border-radius:20px;display:flex;align-items:center;gap:10px;animation:pop 0.3s;cursor:pointer;transition:all 0.3s;}.tag:hover{background:#667eea;color:#fff;transform:translateY(-3px);}@keyframes pop{from{transform:scale(0);}to{transform:scale(1);}}.remove{cursor:pointer;font-weight:bold;}.input-group{display:flex;gap:10px;margin-top:20px;}input{flex:1;padding:10px;border:2px solid #ddd;border-radius:10px;outline:none;}button{padding:10px 20px;background:#667eea;color:#fff;border:none;border-radius:10px;cursor:pointer;}</style></head><body><div class="container"><div class="tags" id="tags"><div class="tag">JavaScript <span class="remove" onclick="this.parentElement.remove()">✕</span></div><div class="tag">React <span class="remove" onclick="this.parentElement.remove()">✕</span></div><div class="tag">CSS <span class="remove" onclick="this.parentElement.remove()">✕</span></div></div><div class="input-group"><input type="text" id="tagInput" placeholder="Add tag..."><button onclick="addTag()">Add</button></div></div><script>function addTag(){const input=document.getElementById('tagInput'),value=input.value.trim();if(value){const tag=document.createElement('div');tag.className='tag';tag.innerHTML=`${value} <span class="remove" onclick="this.parentElement.remove()">✕</span>`;document.getElementById('tags').appendChild(tag);input.value='';}}</script></body></html>
