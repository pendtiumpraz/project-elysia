<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Hinge Animation</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);}.hinge{width:150px;height:150px;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:48px;animation:hinge 2s;transform-origin:top left;}@keyframes hinge{0%{transform:rotate(0);opacity:1;}20%,60%{transform:rotate(80deg);}40%,80%{transform:rotate(60deg);}100%{transform:translateY(700px) rotate(60deg);opacity:0;}}</style></head><body><div class="hinge">📌</div></body></html>
