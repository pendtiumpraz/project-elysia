<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Accordion</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial;}.accordion{width:600px;}.item{background:#16213e;margin-bottom:10px;border-radius:10px;overflow:hidden;}.header{padding:20px;color:#fff;cursor:pointer;display:flex;justify-content:space-between;transition:background 0.3s;}.header:hover{background:#1e4d7a;}.icon{transition:transform 0.3s;}.item.active .icon{transform:rotate(180deg);}.content{max-height:0;overflow:hidden;transition:max-height 0.3s;}.item.active .content{max-height:200px;}.inner{padding:20px;color:#aaa;}</style></head><body><div class="accordion"><div class="item"><div class="header" onclick="toggleAccordion(this)"><span>Question 1?</span><span class="icon">▼</span></div><div class="content"><div class="inner">Answer to question 1 goes here.</div></div></div><div class="item"><div class="header" onclick="toggleAccordion(this)"><span>Question 2?</span><span class="icon">▼</span></div><div class="content"><div class="inner">Answer to question 2 goes here.</div></div></div><div class="item"><div class="header" onclick="toggleAccordion(this)"><span>Question 3?</span><span class="icon">▼</span></div><div class="content"><div class="inner">Answer to question 3 goes here.</div></div></div></div><script>function toggleAccordion(el){el.parentElement.classList.toggle('active');}</script></body></html>
