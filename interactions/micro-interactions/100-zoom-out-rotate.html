<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Zoom Out Rotate</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;}.zoom{width:200px;height:200px;background:linear-gradient(135deg,#00ffff,#ff00ff);border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:72px;font-weight:bold;animation:zoomOutRotate 2s;}@keyframes zoomOutRotate{from{transform:scale(1) rotate(0);opacity:1;}to{transform:scale(0) rotate(360deg);opacity:0;}}</style></head><body><div class="zoom">💯</div></body></html>
