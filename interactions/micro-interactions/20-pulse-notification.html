<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Pulse Notification</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;gap:50px;}.pulse-btn{width:80px;height:80px;background:#667eea;border:none;border-radius:50%;font-size:36px;cursor:pointer;position:relative;}.pulse-btn::before,.pulse-btn::after{content:'';position:absolute;inset:-10px;border:3px solid #667eea;border-radius:50%;opacity:0;animation:pulse 2s ease-out infinite;}.pulse-btn::after{animation-delay:1s;}@keyframes pulse{0%{transform:scale(1);opacity:1;}100%{transform:scale(1.5);opacity:0;}}.pulse-btn.active::before{animation:none;background:#f44336;border-color:#f44336;inset:0;opacity:1;border-radius:50%;}</style></head><body><button class="pulse-btn">🔔</button><button class="pulse-btn">📧</button><button class="pulse-btn">💬</button></body></html>
