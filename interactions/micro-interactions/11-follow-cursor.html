<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Follow Cursor</title><style>*{margin:0;padding:0;}body{min-height:100vh;background:#000;overflow:hidden;cursor:none;}.follower{position:fixed;width:20px;height:20px;background:#00ffff;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);transition:all 0.1s;box-shadow:0 0 20px #00ffff;z-index:1000;}.trail{position:fixed;width:10px;height:10px;background:#ff00ff;border-radius:50%;pointer-events:none;animation:fade 0.5s forwards;}@keyframes fade{to{opacity:0;transform:scale(2);}}.content{position:relative;display:flex;align-items:center;justify-content:center;min-height:100vh;color:#fff;font-size:48px;}</style></head><body><div class="follower" id="follower"></div><div class="content">Move Your Cursor</div><script>const follower=document.getElementById('follower');let mouseX=0,mouseY=0,followerX=0,followerY=0;document.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY;if(Math.random()>0.8){const trail=document.createElement('div');trail.className='trail';trail.style.left=e.clientX+'px';trail.style.top=e.clientY+'px';document.body.appendChild(trail);setTimeout(()=>trail.remove(),500);}});function animate(){followerX+=(mouseX-followerX)*0.1;followerY+=(mouseY-followerY)*0.1;follower.style.left=followerX+'px';follower.style.top=followerY+'px';requestAnimationFrame(animate);}animate();</script></body></html>
