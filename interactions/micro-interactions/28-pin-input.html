<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>PIN Input</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial;}.pin-container{background:#fff;padding:50px;border-radius:20px;text-align:center;}.pin-inputs{display:flex;gap:15px;justify-content:center;margin-top:30px;}input{width:60px;height:70px;text-align:center;font-size:32px;font-weight:bold;border:3px solid #ddd;border-radius:10px;outline:none;transition:all 0.3s;}input:focus{border-color:#667eea;transform:scale(1.1);box-shadow:0 0 20px rgba(102,126,234,0.3);}</style></head><body><div class="pin-container"><h2>Enter PIN</h2><div class="pin-inputs"><input type="text" maxlength="1" oninput="moveFocus(this,0)"><input type="text" maxlength="1" oninput="moveFocus(this,1)"><input type="text" maxlength="1" oninput="moveFocus(this,2)"><input type="text" maxlength="1" oninput="moveFocus(this,3)"></div></div><script>const inputs=document.querySelectorAll('input');inputs[0].focus();function moveFocus(el,index){if(el.value&&index<inputs.length-1)inputs[index+1].focus();}</script></body></html>
