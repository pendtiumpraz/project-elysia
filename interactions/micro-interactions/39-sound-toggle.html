<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Sound Toggle</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}.sound-btn{width:100px;height:100px;background:#16213e;border:none;border-radius:50%;font-size:48px;cursor:pointer;position:relative;transition:all 0.3s;}.sound-btn:hover{transform:scale(1.1);}.sound-btn::before{content:'';position:absolute;inset:-10px;border:3px solid rgba(0,255,255,0.3);border-radius:50%;animation:soundWave 1.5s ease-out infinite;}.sound-btn.muted::before{animation:none;}@keyframes soundWave{0%{transform:scale(1);opacity:1;}100%{transform:scale(1.5);opacity:0;}}</style></head><body><button class="sound-btn" onclick="this.classList.toggle('muted');this.textContent=this.classList.contains('muted')?'🔇':'🔊'">🔊</button></body></html>
