<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Slide In</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;flex-direction:column;gap:20px;}.slide{background:#16213e;padding:30px;border-radius:15px;color:#fff;font-size:24px;animation:slideIn 0.5s backwards;width:400px;text-align:center;}.slide:nth-child(1){animation-delay:0s;}.slide:nth-child(2){animation-delay:0.2s;}.slide:nth-child(3){animation-delay:0.4s;}@keyframes slideIn{from{opacity:0;transform:translateX(-100px);}to{opacity:1;transform:translateX(0);}}</style></head><body><div class="slide">Item 1</div><div class="slide">Item 2</div><div class="slide">Item 3</div></body></html>
