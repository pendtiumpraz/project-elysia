<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Floating Action Button</title><style>*{margin:0;padding:0;}body{min-height:100vh;background:linear-gradient(135deg,#667eea,#764ba2);}.fab{position:fixed;bottom:30px;right:30px;width:70px;height:70px;background:linear-gradient(135deg,#f093fb,#f5576c);border:none;border-radius:50%;color:#fff;font-size:32px;cursor:pointer;box-shadow:0 10px 30px rgba(245,87,108,0.5);transition:all 0.3s;}.fab:hover{transform:scale(1.1) rotate(90deg);box-shadow:0 15px 40px rgba(245,87,108,0.7);}.fab-menu{position:fixed;bottom:120px;right:30px;display:flex;flex-direction:column;gap:15px;opacity:0;pointer-events:none;transition:all 0.3s;}.fab.active~.fab-menu{opacity:1;pointer-events:all;bottom:120px;}.fab-item{width:60px;height:60px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;box-shadow:0 5px 20px rgba(0,0,0,0.2);transform:scale(0);transition:all 0.3s;}.fab.active~.fab-menu .fab-item{transform:scale(1);}.fab-item:nth-child(1){transition-delay:0.1s;}.fab-item:nth-child(2){transition-delay:0.2s;}.fab-item:nth-child(3){transition-delay:0.3s;}</style></head><body><button class="fab" onclick="this.classList.toggle('active')">+</button><div class="fab-menu"><div class="fab-item">📷</div><div class="fab-item">📁</div><div class="fab-item">✏️</div></div></body></html>
