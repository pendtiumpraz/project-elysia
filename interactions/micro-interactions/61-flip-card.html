<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Flip Card</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;gap:30px;}.flip-card{width:250px;height:300px;perspective:1000px;cursor:pointer;}.inner{position:relative;width:100%;height:100%;transition:transform 0.6s;transform-style:preserve-3d;}.flip-card:hover .inner{transform:rotateY(180deg);}.front,.back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;font-weight:bold;}.front{background:linear-gradient(135deg,#667eea,#764ba2);}.back{background:linear-gradient(135deg,#f093fb,#f5576c);transform:rotateY(180deg);}</style></head><body><div class="flip-card"><div class="inner"><div class="front">Front</div><div class="back">Back</div></div></div></body></html>
