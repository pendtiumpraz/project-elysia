<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Notification Dot</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:50px;}.icon-wrapper{position:relative;}.icon{width:80px;height:80px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 10px 30px rgba(0,0,0,0.2);cursor:pointer;}.dot{position:absolute;top:5px;right:5px;width:18px;height:18px;background:#f44336;border-radius:50%;border:3px solid #fff;animation:pulse 1.5s infinite;}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(244,67,54,0.7);}70%{box-shadow:0 0 0 10px rgba(244,67,54,0);}100%{box-shadow:0 0 0 0 rgba(244,67,54,0);}}</style></head><body><div class="icon-wrapper"><div class="icon">📧</div><div class="dot"></div></div><div class="icon-wrapper"><div class="icon">🔔</div><div class="dot"></div></div><div class="icon-wrapper"><div class="icon">💬</div><div class="dot"></div></div></body></html>
