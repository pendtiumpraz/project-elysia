<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>QR Display</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}.qr{width:300px;height:300px;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 20px 60px rgba(255,255,255,0.2);animation:scan 2s linear infinite;}@keyframes scan{0%,100%{box-shadow:0 20px 60px rgba(255,255,255,0.2);}50%{box-shadow:0 20px 60px rgba(0,255,255,0.8);}}</style></head><body><div class="qr">QR CODE</div></body></html>
