<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Tooltips</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;gap:100px;}.btn{padding:20px 40px;background:#667eea;color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:16px;position:relative;}.tooltip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) scale(0);background:#000;color:#fff;padding:10px 15px;border-radius:8px;white-space:nowrap;transition:all 0.3s;pointer-events:none;}.tooltip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#000;}.btn:hover .tooltip{transform:translateX(-50%) scale(1);}</style></head><body><button class="btn">Hover Me<div class="tooltip">Tooltip on top</div></button><button class="btn">Click Me<div class="tooltip">More info here</div></button><button class="btn">Action<div class="tooltip">Perform action</div></button></body></html>
