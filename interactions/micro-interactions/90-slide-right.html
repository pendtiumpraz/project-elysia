<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Slide Right</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;gap:20px;}.box{width:150px;height:150px;background:linear-gradient(135deg,#00ffff,#ff00ff);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:48px;animation:slideRight 0.6s backwards;}.box:nth-child(1){animation-delay:0s;}.box:nth-child(2){animation-delay:0.2s;}.box:nth-child(3){animation-delay:0.4s;}@keyframes slideRight{from{opacity:0;transform:translateX(-100px);}to{opacity:1;transform:translateX(0);}}</style></head><body><div class="box">➡️</div><div class="box">➡️</div><div class="box">➡️</div></body></html>
