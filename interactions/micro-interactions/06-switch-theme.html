<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Theme Switcher</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;transition:background 0.5s;font-family:Arial;}body.dark{background:#1a1a2e;}.theme-switch{width:80px;height:40px;background:#ddd;border-radius:40px;position:relative;cursor:pointer;transition:background 0.3s;}.theme-switch.dark{background:#667eea;}.toggle{position:absolute;width:32px;height:32px;background:#fff;border-radius:50%;top:4px;left:4px;transition:all 0.3s;display:flex;align-items:center;justify-content:center;font-size:18px;}.theme-switch.dark .toggle{left:44px;}</style></head><body><div class="theme-switch" id="switch" onclick="toggleTheme()"><div class="toggle" id="toggle">☀️</div></div><script>function toggleTheme(){const body=document.body,sw=document.getElementById('switch'),toggle=document.getElementById('toggle');body.classList.toggle('dark');sw.classList.toggle('dark');toggle.textContent=body.classList.contains('dark')?'🌙':'☀️';}</script></body></html>
