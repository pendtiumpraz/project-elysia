<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Menu Indicator</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;}.menu{background:#16213e;padding:20px;border-radius:50px;position:relative;}.menu-list{display:flex;gap:10px;list-style:none;}.menu-item{padding:15px 30px;color:#aaa;cursor:pointer;border-radius:30px;transition:color 0.3s;position:relative;z-index:1;}.menu-item.active{color:#fff;}.indicator{position:absolute;height:50px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:30px;transition:all 0.4s cubic-bezier(0.68,-0.55,0.265,1.55);z-index:0;}</style></head><body><nav class="menu"><ul class="menu-list"><li class="menu-item active" onclick="moveIndicator(this,0)">Home</li><li class="menu-item" onclick="moveIndicator(this,1)">About</li><li class="menu-item" onclick="moveIndicator(this,2)">Services</li><li class="menu-item" onclick="moveIndicator(this,3)">Contact</li></ul><div class="indicator" id="indicator" style="width:90px;left:20px;top:20px;"></div></nav><script>function moveIndicator(el,index){document.querySelectorAll('.menu-item').forEach(item=>item.classList.remove('active'));el.classList.add('active');const indicator=document.getElementById('indicator'),rect=el.getBoundingClientRect(),parent=el.parentElement.parentElement.getBoundingClientRect();indicator.style.left=(rect.left-parent.left)+'px';indicator.style.width=rect.width+'px';}</script></body></html>
