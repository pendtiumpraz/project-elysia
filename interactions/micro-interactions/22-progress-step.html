<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Progress Steps</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial;}.stepper{display:flex;align-items:center;}.step{width:50px;height:50px;background:#16213e;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#aaa;font-weight:bold;font-size:20px;position:relative;transition:all 0.3s;}.step.active{background:#00ffff;color:#000;transform:scale(1.2);}.step.completed{background:#4caf50;color:#fff;}.line{width:100px;height:4px;background:#16213e;position:relative;overflow:hidden;}.line-fill{height:100%;background:#00ffff;width:0%;transition:width 0.5s;}.line.active .line-fill{width:100%;}</style></head><body><div class="stepper"><div class="step completed">1</div><div class="line active"><div class="line-fill"></div></div><div class="step active">2</div><div class="line"><div class="line-fill"></div></div><div class="step">3</div><div class="line"><div class="line-fill"></div></div><div class="step">4</div></div></body></html>
