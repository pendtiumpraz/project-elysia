<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Color Picker</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;transition:background 0.5s;font-family:Arial;}.picker{background:#fff;padding:40px;border-radius:20px;text-align:center;}.colors{display:grid;grid-template-columns:repeat(5,60px);gap:15px;margin-bottom:30px;}.color{width:60px;height:60px;border-radius:50%;cursor:pointer;transition:all 0.3s;border:4px solid transparent;}.color:hover{transform:scale(1.2);}.color.active{border-color:#fff;transform:scale(1.2);}.preview{width:100%;height:100px;border-radius:15px;margin-bottom:20px;transition:background 0.3s;}.hex{font-size:24px;font-weight:bold;color:#667eea;}</style></head><body><div class="picker"><div class="preview" id="preview" style="background:#667eea;"></div><div class="colors"><div class="color" style="background:#667eea;" onclick="selectColor('#667eea',this)"></div><div class="color" style="background:#f44336;" onclick="selectColor('#f44336',this)"></div><div class="color" style="background:#4caf50;" onclick="selectColor('#4caf50',this)"></div><div class="color" style="background:#2196f3;" onclick="selectColor('#2196f3',this)"></div><div class="color" style="background:#ff9800;" onclick="selectColor('#ff9800',this)"></div><div class="color" style="background:#9c27b0;" onclick="selectColor('#9c27b0',this)"></div><div class="color" style="background:#00bcd4;" onclick="selectColor('#00bcd4',this)"></div><div class="color" style="background:#ffeb3b;" onclick="selectColor('#ffeb3b',this)"></div><div class="color" style="background:#795548;" onclick="selectColor('#795548',this)"></div><div class="color" style="background:#000;" onclick="selectColor('#000',this)"></div></div><div class="hex" id="hex">#667eea</div></div><script>function selectColor(color,el){document.getElementById('preview').style.background=color;document.getElementById('hex').textContent=color;document.body.style.background=color;document.querySelectorAll('.color').forEach(c=>c.classList.remove('active'));el.classList.add('active');}</script></body></html>
