<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Bounce In</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:30px;}.bounce{width:150px;height:150px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:48px;animation:bounceIn 0.8s backwards;}.bounce:nth-child(2){animation-delay:0.2s;}.bounce:nth-child(3){animation-delay:0.4s;}@keyframes bounceIn{0%{transform:scale(0);}50%{transform:scale(1.2);}100%{transform:scale(1);}}</style></head><body><div class="bounce">🎈</div><div class="bounce">🎉</div><div class="bounce">🎊</div></body></html>
