<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Swing Animation</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:50px;}.swing{width:100px;height:100px;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:48px;animation:swing 2s ease-in-out infinite;transform-origin:top;}@keyframes swing{0%,100%{transform:rotate(0deg);}20%{transform:rotate(15deg);}40%{transform:rotate(-10deg);}60%{transform:rotate(5deg);}80%{transform:rotate(-5deg);}}</style></head><body><div class="swing">🔔</div><div class="swing">⏰</div></body></html>
