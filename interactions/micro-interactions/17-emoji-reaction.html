<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Emoji Reactions</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial;}.reactions{display:flex;gap:15px;}.emoji{width:60px;height:60px;background:#16213e;border:none;border-radius:50%;font-size:32px;cursor:pointer;transition:all 0.3s;position:relative;}.emoji:hover{transform:scale(1.2);background:#0f3460;}.emoji.clicked{animation:react 0.5s;}@keyframes react{0%,100%{transform:scale(1);}50%{transform:scale(1.5) rotate(15deg);}}.counter{position:absolute;bottom:-10px;right:-10px;background:#00ffff;color:#000;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;}</style></head><body><div class="reactions"><button class="emoji" onclick="react(this)">😍<span class="counter">0</span></button><button class="emoji" onclick="react(this)">😂<span class="counter">0</span></button><button class="emoji" onclick="react(this)">😮<span class="counter">0</span></button><button class="emoji" onclick="react(this)">😢<span class="counter">0</span></button><button class="emoji" onclick="react(this)">😡<span class="counter">0</span></button></div><script>function react(btn){btn.classList.add('clicked');setTimeout(()=>btn.classList.remove('clicked'),500);const counter=btn.querySelector('.counter');counter.textContent=parseInt(counter.textContent)+1;}</script></body></html>
