<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Countdown Timer</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial;}.timer{display:flex;gap:30px;}.time-box{background:#fff;padding:30px;border-radius:20px;text-align:center;min-width:120px;box-shadow:0 10px 40px rgba(0,0,0,0.2);}.number{font-size:72px;font-weight:bold;color:#667eea;}.label{font-size:18px;color:#999;margin-top:10px;}</style></head><body><div class="timer"><div class="time-box"><div class="number" id="days">00</div><div class="label">Days</div></div><div class="time-box"><div class="number" id="hours">00</div><div class="label">Hours</div></div><div class="time-box"><div class="number" id="minutes">00</div><div class="label">Minutes</div></div><div class="time-box"><div class="number" id="seconds">00</div><div class="label">Seconds</div></div></div><script>const targetDate=new Date().getTime()+86400000*7;function updateTimer(){const now=new Date().getTime(),distance=targetDate-now,days=Math.floor(distance/86400000),hours=Math.floor((distance%86400000)/3600000),minutes=Math.floor((distance%3600000)/60000),seconds=Math.floor((distance%60000)/1000);document.getElementById('days').textContent=String(days).padStart(2,'0');document.getElementById('hours').textContent=String(hours).padStart(2,'0');document.getElementById('minutes').textContent=String(minutes).padStart(2,'0');document.getElementById('seconds').textContent=String(seconds).padStart(2,'0');}setInterval(updateTimer,1000);updateTimer();</script></body></html>
