<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Wave Loader</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);}.wave{display:flex;gap:5px;}.bar{width:10px;height:80px;background:#fff;border-radius:10px;animation:wave 1s ease-in-out infinite;}.bar:nth-child(1){animation-delay:0s;}.bar:nth-child(2){animation-delay:0.1s;}.bar:nth-child(3){animation-delay:0.2s;}.bar:nth-child(4){animation-delay:0.3s;}.bar:nth-child(5){animation-delay:0.4s;}@keyframes wave{0%,100%{transform:scaleY(1);}50%{transform:scaleY(2);}}</style></head><body><div class="wave"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div></body></html>
