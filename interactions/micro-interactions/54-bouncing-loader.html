<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Bouncing Loader</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);}.bouncing{display:flex;gap:10px;}.ball{width:20px;height:20px;background:#fff;border-radius:50%;animation:bounce 0.6s ease-in-out infinite alternate;}.ball:nth-child(2){animation-delay:0.2s;}.ball:nth-child(3){animation-delay:0.4s;}@keyframes bounce{to{transform:translateY(-50px);}}</style></head><body><div class="bouncing"><div class="ball"></div><div class="ball"></div><div class="ball"></div></div></body></html>
