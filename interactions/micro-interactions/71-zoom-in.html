<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Zoom In</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;gap:30px;}.zoom{width:200px;height:200px;background:linear-gradient(135deg,#00ffff,#ff00ff);border-radius:20px;animation:zoomIn 1s backwards;}.zoom:nth-child(1){animation-delay:0s;}.zoom:nth-child(2){animation-delay:0.2s;}.zoom:nth-child(3){animation-delay:0.4s;}@keyframes zoomIn{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}</style></head><body><div class="zoom"></div><div class="zoom"></div><div class="zoom"></div></body></html>
