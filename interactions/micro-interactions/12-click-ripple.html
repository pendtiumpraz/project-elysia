<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Click Ripple</title><style>*{margin:0;padding:0;}body{min-height:100vh;background:linear-gradient(135deg,#667eea,#764ba2);overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-size:48px;}.ripple{position:fixed;border-radius:50%;border:3px solid #fff;animation:ripple 1s ease-out;pointer-events:none;}@keyframes ripple{from{width:0;height:0;opacity:1;}to{width:200px;height:200px;opacity:0;}}</style></head><body>Click Anywhere<script>document.addEventListener('click',e=>{const ripple=document.createElement('div');ripple.className='ripple';ripple.style.left=(e.clientX-100)+'px';ripple.style.top=(e.clientY-100)+'px';document.body.appendChild(ripple);setTimeout(()=>ripple.remove(),1000);});</script></body></html>
