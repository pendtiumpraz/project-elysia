<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Mode Switcher</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;transition:all 0.5s;font-family:Arial;}body.dark{background:#1a1a2e;color:#fff;}.modes{display:flex;gap:20px;}.mode-btn{padding:20px 30px;border:3px solid #667eea;background:transparent;border-radius:50px;cursor:pointer;font-size:24px;transition:all 0.3s;}.mode-btn.active{background:#667eea;color:#fff;transform:scale(1.1);}</style></head><body><div class="modes"><button class="mode-btn active" onclick="setMode('light',this)">☀️</button><button class="mode-btn" onclick="setMode('dark',this)">🌙</button><button class="mode-btn" onclick="setMode('auto',this)">⚡</button></div><script>function setMode(mode,btn){document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.body.className=mode==='dark'?'dark':'';}</script></body></html>
