<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Drag & Drop</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:50px;}.draggable{width:100px;height:100px;background:#fff;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:48px;cursor:move;transition:all 0.3s;}.draggable.dragging{opacity:0.5;transform:scale(1.1);}.dropzone{width:300px;height:300px;border:3px dashed#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;transition:all 0.3s;}.dropzone.over{background:rgba(255,255,255,0.2);border-style:solid;}</style></head><body><div class="draggable" draggable="true">📦</div><div class="draggable" draggable="true">🎁</div><div class="dropzone">Drop Here</div><script>const draggables=document.querySelectorAll('.draggable'),dropzone=document.querySelector('.dropzone');draggables.forEach(d=>{d.addEventListener('dragstart',()=>d.classList.add('dragging'));d.addEventListener('dragend',()=>d.classList.remove('dragging'));});dropzone.addEventListener('dragover',e=>{e.preventDefault();dropzone.classList.add('over');});dropzone.addEventListener('dragleave',()=>dropzone.classList.remove('over'));dropzone.addEventListener('drop',e=>{e.preventDefault();dropzone.classList.remove('over');const dragging=document.querySelector('.dragging');dropzone.appendChild(dragging);});</script></body></html>
