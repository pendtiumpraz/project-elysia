<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Slide Left</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:20px;}.box{width:150px;height:150px;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:48px;animation:slideLeft 0.6s backwards;}.box:nth-child(1){animation-delay:0s;}.box:nth-child(2){animation-delay:0.2s;}.box:nth-child(3){animation-delay:0.4s;}@keyframes slideLeft{from{opacity:0;transform:translateX(100px);}to{opacity:1;transform:translateX(0);}}</style></head><body><div class="box">⬅️</div><div class="box">⬅️</div><div class="box">⬅️</div></body></html>
