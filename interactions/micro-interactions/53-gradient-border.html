<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Gradient Border</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;gap:30px;}.gradient-box{width:200px;height:200px;position:relative;border-radius:20px;}.gradient-box::before{content:'';position:absolute;inset:-3px;background:linear-gradient(45deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#8b00ff);border-radius:20px;animation:rotate 3s linear infinite;z-index:-1;}@keyframes rotate{100%{filter:hue-rotate(360deg);}}.content{width:100%;height:100%;background:#000;border-radius:17px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;}</style></head><body><div class="gradient-box"><div class="content">Box 1</div></div><div class="gradient-box"><div class="content">Box 2</div></div></body></html>
