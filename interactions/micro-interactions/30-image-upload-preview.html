<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Image Upload Preview</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial;}.upload-box{background:#fff;padding:40px;border-radius:20px;text-align:center;width:400px;}.upload-area{border:3px dashed #ddd;border-radius:15px;padding:40px;cursor:pointer;transition:all 0.3s;}.upload-area:hover{border-color:#667eea;background:#f9f9f9;}.icon{font-size:64px;margin-bottom:15px;}input{display:none;}.preview{margin-top:20px;display:none;}img{max-width:100%;border-radius:10px;animation:zoomIn 0.3s;}@keyframes zoomIn{from{transform:scale(0);}to{transform:scale(1);}}.remove{margin-top:15px;padding:10px 20px;background:#f44336;color:#fff;border:none;border-radius:8px;cursor:pointer;}</style></head><body><div class="upload-box"><div class="upload-area" onclick="document.getElementById('file').click()"><div class="icon">📷</div><p>Click to upload image</p></div><input type="file" id="file" accept="image/*" onchange="previewImage(event)"><div class="preview" id="preview"><img id="img"><button class="remove" onclick="removeImage()">Remove</button></div></div><script>function previewImage(e){const file=e.target.files[0];if(file){const reader=new FileReader();reader.onload=function(e){document.getElementById('img').src=e.target.result;document.getElementById('preview').style.display='block';};reader.readAsDataURL(file);}}function removeImage(){document.getElementById('preview').style.display='none';document.getElementById('file').value='';}</script></body></html>
