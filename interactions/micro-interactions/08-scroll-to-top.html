<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Scroll To Top</title><style>*{margin:0;padding:0;}body{font-family:Arial;background:#f5f5f5;}.hero{height:100vh;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:72px;}.content{padding:50px;min-height:100vh;}.scroll-top{position:fixed;bottom:30px;right:30px;width:60px;height:60px;background:#667eea;color:#fff;border:none;border-radius:50%;font-size:24px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,0.3);opacity:0;visibility:hidden;transition:all 0.3s;}.scroll-top.show{opacity:1;visibility:visible;}.scroll-top:hover{transform:translateY(-5px);box-shadow:0 15px 40px rgba(102,126,234,0.5);}</style></head><body><div class="hero">Scroll Down</div><div class="content"><h1>Content Section</h1><p>Scroll down to see the button appear...</p></div><button class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button><script>window.addEventListener('scroll',()=>{const btn=document.getElementById('scrollTop');if(window.scrollY>300){btn.classList.add('show');}else{btn.classList.remove('show');}});</script></body></html>
