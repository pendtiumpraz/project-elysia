<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Infinite Scroll</title><style>*{margin:0;padding:0;}body{background:#1a1a2e;font-family:Arial;padding:20px;}.item{background:#16213e;padding:30px;margin-bottom:20px;border-radius:15px;color:#fff;animation:slideUp 0.5s;text-align:center;}@keyframes slideUp{from{opacity:0;transform:translateY(50px);}to{opacity:1;transform:translateY(0);}}.loader{text-align:center;padding:40px;color:#00ffff;font-size:24px;}</style></head><body><div id="container"><div class="item">Item 1</div><div class="item">Item 2</div><div class="item">Item 3</div></div><div class="loader">Loading more...</div><script>let count=4;window.addEventListener('scroll',()=>{if(window.innerHeight+window.scrollY>=document.body.offsetHeight-100){for(let i=0;i<3;i++){const item=document.createElement('div');item.className='item';item.textContent='Item '+count++;document.getElementById('container').appendChild(item);}}});</script></body></html>
