<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Skeleton Loader</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;}.card{width:400px;background:#16213e;padding:20px;border-radius:20px;}.skeleton{background:linear-gradient(90deg,#1e4d7a 25%,#2a5f8f 50%,#1e4d7a 75%);background-size:200% 100%;animation:loading 1.5s infinite;border-radius:10px;margin-bottom:15px;}.avatar{width:80px;height:80px;border-radius:50%;}.title{height:20px;width:60%;}.text{height:15px;width:100%;}.text:last-child{width:80%;}@keyframes loading{0%{background-position:200% 0;}100%{background-position:-200% 0;}}</style></head><body><div class="card"><div class="skeleton avatar"></div><div class="skeleton title"></div><div class="skeleton text"></div><div class="skeleton text"></div><div class="skeleton text"></div></div></body></html>
