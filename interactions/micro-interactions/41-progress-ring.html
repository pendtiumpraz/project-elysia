<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Progress Ring</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;gap:50px;}.ring{position:relative;width:150px;height:150px;}svg{transform:rotate(-90deg);}circle{fill:none;stroke-width:10;stroke:#333;}circle.progress{stroke:#00ffff;stroke-dasharray:440;stroke-dashoffset:440;animation:fill 2s ease forwards;stroke-linecap:round;}@keyframes fill{to{stroke-dashoffset:110;}}.percent{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:32px;color:#00ffff;font-weight:bold;}</style></head><body><div class="ring"><svg width="150" height="150"><circle cx="75" cy="75" r="70"/><circle class="progress" cx="75" cy="75" r="70"/></svg><div class="percent">75%</div></div></body></html>
