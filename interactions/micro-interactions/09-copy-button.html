<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Copy Button</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial;}.code-box{background:#16213e;padding:30px;border-radius:15px;position:relative;width:500px;}.code{color:#0f0;font-family:'Courier New';font-size:14px;}.copy-btn{position:absolute;top:15px;right:15px;padding:10px 20px;background:#667eea;color:#fff;border:none;border-radius:8px;cursor:pointer;transition:all 0.3s;}.copy-btn:hover{background:#5568d3;}.copy-btn.copied{background:#4caf50;}.copy-btn.copied::after{content:' ✓';}</style></head><body><div class="code-box"><button class="copy-btn" id="copyBtn" onclick="copyCode()">Copy</button><pre class="code" id="code">function helloWorld() {
  console.log("Hello World!");
}</pre></div><script>function copyCode(){const code=document.getElementById('code').textContent,btn=document.getElementById('copyBtn');navigator.clipboard.writeText(code);btn.textContent='Copied';btn.classList.add('copied');setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied');},2000);}</script></body></html>
