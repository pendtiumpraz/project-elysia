<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Password Strength</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);}.container{background:#fff;padding:40px;border-radius:20px;width:400px;}input{width:100%;padding:15px;border:2px solid#ddd;border-radius:10px;font-size:16px;margin-bottom:15px;outline:none;}.strength-bar{display:flex;gap:5px;height:8px;margin-bottom:10px;}.bar{flex:1;background:#ddd;border-radius:10px;transition:background 0.3s;}.text{text-align:center;font-weight:bold;color:#999;}</style></head><body><div class="container"><h2 style="margin-bottom:20px;text-align:center;">Enter Password</h2><input type="password" placeholder="Password" oninput="checkStrength(this.value)"><div class="strength-bar"><div class="bar" id="b1"></div><div class="bar" id="b2"></div><div class="bar" id="b3"></div><div class="bar" id="b4"></div></div><div class="text" id="text">Enter password</div></div><script>function checkStrength(pwd){const bars=[b1,b2,b3,b4],text=document.getElementById('text');bars.forEach(b=>b.style.background='#ddd');if(pwd.length<4){text.textContent='Too weak';text.style.color='#999';}else if(pwd.length<8){bars[0].style.background='#f44336';text.textContent='Weak';text.style.color='#f44336';}else if(pwd.length<12){bars[0].style.background=bars[1].style.background='#ff9800';text.textContent='Medium';text.style.color='#ff9800';}else{bars.forEach(b=>b.style.background='#4caf50');text.textContent='Strong';text.style.color='#4caf50';}}</script></body></html>
