<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Shake Animation</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;}.alert{background:#f44336;color:#fff;padding:30px 50px;border-radius:15px;font-size:24px;font-weight:bold;animation:shake 0.5s;box-shadow:0 10px 30px rgba(244,67,54,0.5);}@keyframes shake{0%,100%{transform:translateX(0);}10%,30%,50%,70%,90%{transform:translateX(-10px);}20%,40%,60%,80%{transform:translateX(10px);}}</style></head><body><div class="alert">⚠️ Error Message!</div></body></html>
