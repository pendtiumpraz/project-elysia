<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Light Speed</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;}.speed{width:100px;height:100px;background:#00ffff;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:48px;animation:lightSpeed 2s infinite;}@keyframes lightSpeed{0%{transform:translateX(-100vw) skewX(-30deg);opacity:0;}60%{transform:translateX(0) skewX(20deg);opacity:1;}80%{transform:skewX(-5deg);}100%{transform:translateX(100vw) skewX(30deg);opacity:0;}}</style></head><body><div class="speed">🚀</div></body></html>
