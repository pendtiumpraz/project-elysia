<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Rubber Band</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}.rubber{width:200px;height:200px;background:linear-gradient(135deg,#00ffff,#ff00ff);border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:48px;font-weight:bold;animation:rubberBand 1s;box-shadow:0 20px 60px rgba(255,0,255,0.5);}@keyframes rubberBand{0%{transform:scale(1);}30%{transform:scaleX(1.25) scaleY(0.75);}40%{transform:scaleX(0.75) scaleY(1.25);}50%{transform:scaleX(1.15) scaleY(0.85);}65%{transform:scaleX(0.95) scaleY(1.05);}75%{transform:scaleX(1.05) scaleY(0.95);}100%{transform:scale(1);}}</style></head><body><div class="rubber">BOUNCE</div></body></html>
