<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Flip Y</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;gap:30px;}.flip{width:150px;height:150px;background:linear-gradient(135deg,#00ffff,#ff00ff);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:48px;animation:flipY 2s infinite;}@keyframes flipY{0%,100%{transform:rotateY(0);}50%{transform:rotateY(180deg);}}</style></head><body><div class="flip">💎</div><div class="flip" style="animation-delay:0.5s;">💰</div></body></html>
