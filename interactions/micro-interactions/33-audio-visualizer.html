<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Audio Visualizer</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}.visualizer{display:flex;align-items:flex-end;gap:5px;height:200px;}.bar{width:15px;background:linear-gradient(180deg,#00ffff,#ff00ff);border-radius:10px 10px 0 0;animation:pulse ease-in-out infinite;}.bar:nth-child(1){animation-duration:0.5s;height:50px;}.bar:nth-child(2){animation-duration:0.6s;height:80px;}.bar:nth-child(3){animation-duration:0.4s;height:120px;}.bar:nth-child(4){animation-duration:0.7s;height:90px;}.bar:nth-child(5){animation-duration:0.5s;height:150px;}.bar:nth-child(6){animation-duration:0.6s;height:110px;}.bar:nth-child(7){animation-duration:0.4s;height:70px;}.bar:nth-child(8){animation-duration:0.5s;height:100px;}@keyframes pulse{0%,100%{transform:scaleY(0.3);}50%{transform:scaleY(1);}}</style></head><body><div class="visualizer"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div></body></html>
