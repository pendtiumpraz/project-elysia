<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Card Stack</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;}.stack{position:relative;width:300px;height:400px;}.card{position:absolute;width:100%;height:100%;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:48px;font-weight:bold;box-shadow:0 20px 60px rgba(0,0,0,0.5);transition:all 0.3s;}.card:nth-child(1){z-index:3;}.card:nth-child(2){z-index:2;transform:translateY(20px) scale(0.95);opacity:0.8;}.card:nth-child(3){z-index:1;transform:translateY(40px) scale(0.9);opacity:0.6;}.stack:hover .card:nth-child(1){transform:translateY(-20px);}.stack:hover .card:nth-child(2){transform:translateY(0) scale(0.95);}.stack:hover .card:nth-child(3){transform:translateY(20px) scale(0.9);}</style></head><body><div class="stack"><div class="card">1</div><div class="card">2</div><div class="card">3</div></div></body></html>
