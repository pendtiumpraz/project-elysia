<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Star Rating</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial;}.rating{display:flex;gap:10px;}.star{font-size:48px;cursor:pointer;transition:all 0.3s;color:#444;}.star:hover,.star.active{color:#ffff00;text-shadow:0 0 20px #ffff00;transform:scale(1.2);}</style></head><body><div class="rating" id="rating"><span class="star" data-value="1">★</span><span class="star" data-value="2">★</span><span class="star" data-value="3">★</span><span class="star" data-value="4">★</span><span class="star" data-value="5">★</span></div><script>const stars=document.querySelectorAll('.star');let rating=0;stars.forEach(star=>{star.addEventListener('click',()=>{rating=star.getAttribute('data-value');updateStars();});star.addEventListener('mouseenter',()=>{const value=star.getAttribute('data-value');stars.forEach((s,i)=>{s.style.color=i<value?'#ffff00':'#444';});});});document.getElementById('rating').addEventListener('mouseleave',updateStars);function updateStars(){stars.forEach((s,i)=>{s.classList.toggle('active',i<rating);s.style.color=i<rating?'#ffff00':'#444';});}</script></body></html>
