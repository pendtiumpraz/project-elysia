<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Breadcrumb Trail</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial;}.breadcrumb{display:flex;align-items:center;background:#16213e;padding:20px 30px;border-radius:50px;}.crumb{color:#aaa;text-decoration:none;padding:8px 15px;border-radius:20px;transition:all 0.3s;animation:slideIn 0.5s backwards;}.crumb:hover{background:#0f3460;color:#00ffff;}.crumb:nth-child(1){animation-delay:0s;}.crumb:nth-child(3){animation-delay:0.1s;}.crumb:nth-child(5){animation-delay:0.2s;}.crumb:nth-child(7){animation-delay:0.3s;}@keyframes slideIn{from{opacity:0;transform:translateX(-20px);}to{opacity:1;transform:translateX(0);}}.sep{color:#555;margin:0 10px;}</style></head><body><nav class="breadcrumb"><a href="#" class="crumb">Home</a><span class="sep">›</span><a href="#" class="crumb">Products</a><span class="sep">›</span><a href="#" class="crumb">Category</a><span class="sep">›</span><a href="#" class="crumb">Item</a></nav></body></html>
