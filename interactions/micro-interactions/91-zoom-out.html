<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Zoom Out</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);}.zoom{width:200px;height:200px;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:64px;animation:zoomOut 1s;}@keyframes zoomOut{from{transform:scale(1);opacity:1;}to{transform:scale(0);opacity:0;}}</style></head><body><div class="zoom">👋</div></body></html>
