<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Fade In</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:30px;}.fade{width:200px;height:200px;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:48px;animation:fadeIn 1s backwards;box-shadow:0 10px 30px rgba(0,0,0,0.3);}.fade:nth-child(1){animation-delay:0s;}.fade:nth-child(2){animation-delay:0.3s;}.fade:nth-child(3){animation-delay:0.6s;}@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}</style></head><body><div class="fade">🌟</div><div class="fade">💫</div><div class="fade">✨</div></body></html>
