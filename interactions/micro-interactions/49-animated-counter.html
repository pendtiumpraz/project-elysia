<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Animated Counter</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:50px;}.counter-box{background:#fff;padding:50px;border-radius:20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);}.number{font-size:96px;font-weight:bold;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.label{font-size:24px;color:#999;margin-top:15px;}</style></head><body><div class="counter-box"><div class="number" data-target="150">0</div><div class="label">Projects</div></div><div class="counter-box"><div class="number" data-target="5000">0</div><div class="label">Users</div></div><script>document.querySelectorAll('.number').forEach(n=>{const target=+n.getAttribute('data-target'),inc=target/100;let count=0;const update=()=>{count+=inc;if(count<target){n.textContent=Math.floor(count);requestAnimationFrame(update);}else n.textContent=target;};update();});</script></body></html>
