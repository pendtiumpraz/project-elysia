<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Slide Toggle</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:30px;flex-direction:column;}.toggle-group{display:flex;background:#fff;border-radius:50px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,0.2);}button{padding:15px 40px;border:none;background:transparent;border-radius:50px;cursor:pointer;font-size:16px;font-weight:bold;color:#999;transition:color 0.3s;position:relative;z-index:1;}button.active{color:#fff;}.slider{position:absolute;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:50px;height:calc(100% - 10px);transition:all 0.3s;top:5px;z-index:0;}</style></head><body><div class="toggle-group" style="position:relative;"><button class="active" onclick="slide(this,0)">Daily</button><button onclick="slide(this,1)">Weekly</button><button onclick="slide(this,2)">Monthly</button><div class="slider" id="slider" style="width:100px;left:5px;"></div></div><script>function slide(el,index){document.querySelectorAll('button').forEach(btn=>btn.classList.remove('active'));el.classList.add('active');const slider=document.getElementById('slider'),rect=el.getBoundingClientRect(),parent=el.parentElement.getBoundingClientRect();slider.style.left=(rect.left-parent.left)+'px';slider.style.width=rect.width+'px';}</script></body></html>
