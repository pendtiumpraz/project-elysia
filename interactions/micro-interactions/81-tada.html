<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Tada Animation</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}.tada{font-size:128px;animation:tada 2s infinite;}@keyframes tada{0%,100%{transform:scale(1) rotate(0);}10%,20%{transform:scale(0.9) rotate(-3deg);}30%,50%,70%,90%{transform:scale(1.1) rotate(3deg);}40%,60%,80%{transform:scale(1.1) rotate(-3deg);}}</style></head><body><div class="tada">🎉</div></body></html>
