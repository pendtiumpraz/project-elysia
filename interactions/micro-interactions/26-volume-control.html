<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Volume Control</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial;}.volume{display:flex;flex-direction:column;align-items:center;gap:30px;}.icon-btn{width:80px;height:80px;background:#16213e;border:none;border-radius:50%;font-size:40px;cursor:pointer;transition:all 0.3s;}.icon-btn:hover{transform:scale(1.1);background:#1e4d7a;}.slider-container{width:300px;}.slider{width:100%;height:8px;background:#16213e;border-radius:10px;outline:none;-webkit-appearance:none;}.slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;background:#00ffff;border-radius:50%;cursor:pointer;box-shadow:0 0 20px #00ffff;}.value{text-align:center;color:#00ffff;font-size:48px;font-weight:bold;margin-top:20px;}</style></head><body><div class="volume"><button class="icon-btn" id="icon" onclick="toggleMute()">🔊</button><div class="slider-container"><input type="range" class="slider" id="volume" min="0" max="100" value="70" oninput="updateVolume(this.value)"><div class="value" id="value">70</div></div></div><script>let muted=false;function updateVolume(val){document.getElementById('value').textContent=val;const icon=document.getElementById('icon');icon.textContent=val==0?'🔇':val<50?'🔉':'🔊';document.getElementById('volume').style.background=`linear-gradient(to right,#00ffff 0%,#00ffff ${val}%,#16213e ${val}%,#16213e 100%)`;}function toggleMute(){muted=!muted;const slider=document.getElementById('volume');if(muted){slider.dataset.prev=slider.value;slider.value=0;}else{slider.value=slider.dataset.prev||70;}updateVolume(slider.value);}updateVolume(70);</script></body></html>
