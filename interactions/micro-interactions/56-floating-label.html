<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Floating Label</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);}.form-group{position:relative;margin:30px;}input{padding:20px 15px;border:2px solid#ddd;border-radius:10px;font-size:16px;outline:none;width:300px;background:#fff;}label{position:absolute;left:15px;top:20px;color:#999;transition:all 0.3s;pointer-events:none;}input:focus~label,input:not(:placeholder-shown)~label{top:-10px;left:10px;font-size:12px;background:#fff;padding:0 5px;color:#667eea;}input:focus{border-color:#667eea;}</style></head><body><div class="form-group"><input type="text" placeholder=" "><label>Email</label></div></body></html>
