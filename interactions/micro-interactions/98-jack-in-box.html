<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Jack In Box</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}.jack{width:150px;height:150px;background:linear-gradient(135deg,#ff0000,#ff9800);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:64px;animation:jackInBox 1s;}@keyframes jackInBox{from{opacity:0;transform:scale(0.1) rotate(30deg);transform-origin:center bottom;}50%{transform:rotate(-10deg);}70%{transform:rotate(3deg);}to{opacity:1;transform:scale(1);}}</style></head><body><div class="jack">🤡</div></body></html>
