<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Tilt Card</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}.card{width:300px;height:400px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:20px;transition:transform 0.1s;transform-style:preserve-3d;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:48px;font-weight:bold;box-shadow:0 20px 60px rgba(102,126,234,0.5);}</style></head><body><div class="card" id="card">TILT ME</div><script>const card=document.getElementById('card');card.addEventListener('mousemove',e=>{const rect=card.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,centerX=rect.width/2,centerY=rect.height/2,rotateX=(y-centerY)/10,rotateY=(centerX-x)/10;card.style.transform=`perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05,1.05,1.05)`;});card.addEventListener('mouseleave',()=>card.style.transform='perspective(1000px) rotateX(0) rotateY(0)');</script></body></html>
