<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Zoom Toggle</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:30px;}.zoom-btn{width:80px;height:80px;border:none;border-radius:50%;background:#fff;font-size:32px;cursor:pointer;transition:all 0.3s;box-shadow:0 10px 30px rgba(0,0,0,0.2);}.zoom-btn:hover{transform:scale(1.2);box-shadow:0 15px 40px rgba(0,0,0,0.3);}.zoom-btn:active{transform:scale(0.9);}</style></head><body><button class="zoom-btn">🔍</button><button class="zoom-btn">🔎</button><button class="zoom-btn">🔬</button></body></html>
