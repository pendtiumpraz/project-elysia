<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Typing Indicator</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}.typing{display:flex;gap:8px;background:#16213e;padding:20px;border-radius:30px;}.dot{width:15px;height:15px;background:#00ffff;border-radius:50%;animation:bounce 1.4s infinite ease-in-out;}.dot:nth-child(1){animation-delay:-0.32s;}.dot:nth-child(2){animation-delay:-0.16s;}@keyframes bounce{0%,80%,100%{transform:scale(0);}40%{transform:scale(1);}}</style></head><body><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></body></html>
