<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Smooth Scroll</title><style>*{margin:0;padding:0;}body{font-family:Arial;}html{scroll-behavior:smooth;}.section{height:100vh;display:flex;align-items:center;justify-content:center;font-size:72px;color:#fff;}.s1{background:#667eea;}.s2{background:#764ba2;}.s3{background:#f093fb;}.nav{position:fixed;top:20px;right:20px;display:flex;flex-direction:column;gap:10px;}.dot{width:15px;height:15px;background:#fff;border-radius:50%;opacity:0.5;cursor:pointer;transition:all 0.3s;}.dot:hover,.dot.active{opacity:1;transform:scale(1.5);}</style></head><body><nav class="nav"><a href="#s1" class="dot"></a><a href="#s2" class="dot"></a><a href="#s3" class="dot"></a></nav><div id="s1" class="section s1">Section 1</div><div id="s2" class="section s2">Section 2</div><div id="s3" class="section s3">Section 3</div></body></html>
