<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Morph Shape</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);}.shape{width:200px;height:200px;background:#fff;animation:morph 4s ease-in-out infinite;box-shadow:0 20px 60px rgba(0,0,0,0.3);}@keyframes morph{0%,100%{border-radius:60% 40% 30% 70%/60% 30% 70% 40%;transform:rotate(0deg);}50%{border-radius:30% 60% 70% 40%/50% 60% 30% 60%;transform:rotate(180deg);}}</style></head><body><div class="shape"></div></body></html>
