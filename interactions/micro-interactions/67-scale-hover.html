<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Scale Hover</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;gap:30px;}.box{width:150px;height:150px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:48px;cursor:pointer;transition:transform 0.3s;box-shadow:0 10px 30px rgba(0,0,0,0.3);}.box:hover{transform:scale(1.2);box-shadow:0 20px 50px rgba(102,126,234,0.5);}</style></head><body><div class="box">🎨</div><div class="box">⚡</div><div class="box">🚀</div></body></html>
