<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Animated Checkbox</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:30px;flex-direction:column;}label{display:flex;align-items:center;gap:15px;cursor:pointer;}input{display:none;}.checkbox{width:60px;height:60px;border:3px solid#fff;border-radius:15px;position:relative;transition:all 0.3s;}input:checked+.checkbox{background:#fff;transform:rotate(10deg);}input:checked+.checkbox::after{content:'✓';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:32px;color:#667eea;animation:pop 0.3s;}@keyframes pop{from{transform:translate(-50%,-50%) scale(0);}to{transform:translate(-50%,-50%) scale(1);}}.text{color:#fff;font-size:20px;}</style></head><body><label><input type="checkbox"><div class="checkbox"></div><span class="text">Option 1</span></label><label><input type="checkbox"><div class="checkbox"></div><span class="text">Option 2</span></label><label><input type="checkbox"><div class="checkbox"></div><span class="text">Option 3</span></label></body></html>
