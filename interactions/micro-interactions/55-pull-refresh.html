<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Pull to Refresh</title><style>*{margin:0;padding:0;}body{font-family:Arial;background:#1a1a2e;}.refresh-indicator{text-align:center;padding:20px;color:#00ffff;font-size:24px;transform:translateY(-100px);transition:transform 0.3s;}.refresh-indicator.show{transform:translateY(0);}.content{padding:20px;color:#fff;}.item{background:#16213e;padding:20px;margin-bottom:10px;border-radius:10px;}</style></head><body><div class="refresh-indicator" id="indicator">↓ Pull to refresh</div><div class="content"><div class="item">Item 1</div><div class="item">Item 2</div><div class="item">Item 3</div></div><script>let startY=0;document.addEventListener('touchstart',e=>startY=e.touches[0].pageY);document.addEventListener('touchmove',e=>{if(window.scrollY===0&&e.touches[0].pageY>startY+50)document.getElementById('indicator').classList.add('show');});document.addEventListener('touchend',()=>{const ind=document.getElementById('indicator');if(ind.classList.contains('show')){setTimeout(()=>ind.classList.remove('show'),1000);}});</script></body></html>
