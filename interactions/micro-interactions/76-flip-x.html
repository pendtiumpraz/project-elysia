<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Flip X</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:30px;}.flip{width:150px;height:150px;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:48px;animation:flipX 2s infinite;}@keyframes flipX{0%,100%{transform:rotateX(0);}50%{transform:rotateX(180deg);}}</style></head><body><div class="flip">🎲</div><div class="flip" style="animation-delay:0.5s;">🎯</div></body></html>
