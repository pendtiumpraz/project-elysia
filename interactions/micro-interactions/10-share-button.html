<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Share Button</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);}.share-btn{width:60px;height:60px;background:#fff;border:none;border-radius:50%;font-size:24px;cursor:pointer;position:relative;transition:all 0.3s;}.share-btn:hover{transform:scale(1.1);}.share-options{position:absolute;display:flex;gap:10px;opacity:0;pointer-events:none;transition:all 0.3s;}.share-btn.active .share-options{opacity:1;pointer-events:all;}.social-btn{width:50px;height:50px;border-radius:50%;border:none;color:#fff;font-size:20px;cursor:pointer;transform:scale(0);transition:all 0.3s;}.share-btn.active .social-btn{transform:scale(1);}.social-btn:nth-child(1){background:#1877f2;transition-delay:0.1s;}.social-btn:nth-child(2){background:#1da1f2;transition-delay:0.2s;}.social-btn:nth-child(3){background:#25d366;transition-delay:0.3s;}.social-btn:nth-child(4){background:#0077b5;transition-delay:0.4s;}.share-options{top:-70px;left:50%;transform:translateX(-50%);}</style></head><body><button class="share-btn" onclick="this.classList.toggle('active')">📤<div class="share-options"><button class="social-btn">f</button><button class="social-btn">🐦</button><button class="social-btn">💬</button><button class="social-btn">in</button></div></button></body></html>
