<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Roll In</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);}.roll{width:150px;height:150px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:48px;animation:rollIn 1s;}@keyframes rollIn{from{opacity:0;transform:translateX(-100%) rotate(-720deg);}to{opacity:1;transform:translateX(0) rotate(0);}}</style></head><body><div class="roll">⚽</div></body></html>
