<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Animated Menu</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;}.menu-icon{width:50px;height:40px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;}.line{width:100%;height:5px;background:#00ffff;border-radius:5px;transition:all 0.3s;}.menu-icon.active .line:nth-child(1){transform:rotate(45deg) translateY(17px);}.menu-icon.active .line:nth-child(2){opacity:0;}.menu-icon.active .line:nth-child(3){transform:rotate(-45deg) translateY(-17px);}</style></head><body><div class="menu-icon" onclick="this.classList.toggle('active')"><div class="line"></div><div class="line"></div><div class="line"></div></div></body></html>
