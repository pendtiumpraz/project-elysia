<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Spotlight Effect</title><style>*{margin:0;padding:0;}body{min-height:100vh;background:#000;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;font-size:48px;}.spotlight{position:fixed;width:300px;height:300px;background:radial-gradient(circle,rgba(255,255,255,0.3),transparent);border-radius:50%;pointer-events:none;transition:all 0.1s;}</style></head><body><div class="spotlight" id="spotlight"></div><div>Move Your Mouse</div><script>const spotlight=document.getElementById('spotlight');document.addEventListener('mousemove',e=>{spotlight.style.left=(e.clientX-150)+'px';spotlight.style.top=(e.clientY-150)+'px';});</script></body></html>
