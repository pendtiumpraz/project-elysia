<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Shake Button</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:30px;}.shake-btn{padding:20px 40px;background:#fff;color:#667eea;border:none;border-radius:50px;font-size:18px;font-weight:bold;cursor:pointer;transition:all 0.3s;}.shake-btn.error{animation:shake 0.5s;}@keyframes shake{0%,100%{transform:translateX(0);}10%,30%,50%,70%,90%{transform:translateX(-10px);}20%,40%,60%,80%{transform:translateX(10px);}}</style></head><body><button class="shake-btn" onclick="this.classList.add('error');setTimeout(()=>this.classList.remove('error'),500)">Click Me</button><button class="shake-btn" onclick="this.classList.add('error');setTimeout(()=>this.classList.remove('error'),500)">Try Again</button></body></html>
