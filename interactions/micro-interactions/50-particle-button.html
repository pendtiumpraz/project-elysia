<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Particle Button</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;}button{padding:25px 50px;background:linear-gradient(135deg,#00ffff,#ff00ff);border:none;border-radius:50px;color:#fff;font-size:24px;font-weight:bold;cursor:pointer;position:relative;}.particle{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:explode 1s ease-out forwards;}@keyframes explode{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0;}}</style></head><body><button onclick="explode(event)">Click Me!</button><script>function explode(e){const btn=e.target,rect=btn.getBoundingClientRect(),centerX=rect.left+rect.width/2,centerY=rect.top+rect.height/2;for(let i=0;i<30;i++){const particle=document.createElement('div');particle.className='particle';particle.style.left=centerX+'px';particle.style.top=centerY+'px';particle.style.background=`hsl(${Math.random()*360},100%,50%)`;const angle=Math.random()*Math.PI*2,distance=Math.random()*200+50;particle.style.setProperty('--x',Math.cos(angle)*distance+'px');particle.style.setProperty('--y',Math.sin(angle)*distance+'px');document.body.appendChild(particle);setTimeout(()=>particle.remove(),1000);}}</script></body></html>
