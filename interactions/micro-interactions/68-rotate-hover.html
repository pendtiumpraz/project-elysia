<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Rotate Hover</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:30px;}.icon{width:100px;height:100px;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:48px;cursor:pointer;transition:transform 0.5s;box-shadow:0 10px 30px rgba(0,0,0,0.2);}.icon:hover{transform:rotate(360deg) scale(1.1);}</style></head><body><div class="icon">⚙️</div><div class="icon">🔄</div><div class="icon">♻️</div></body></html>
