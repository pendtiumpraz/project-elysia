<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Tilt Image</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);}.img-box{width:400px;height:500px;perspective:1000px;}img{width:100%;height:100%;object-fit:cover;border-radius:20px;transition:transform 0.1s;box-shadow:0 20px 60px rgba(0,0,0,0.5);}</style></head><body><div class="img-box" id="box"><img src="https://via.placeholder.com/400x500/667eea/fff" id="img"></div><script>const box=document.getElementById('box'),img=document.getElementById('img');box.addEventListener('mousemove',e=>{const rect=box.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,centerX=rect.width/2,centerY=rect.height/2,rotateX=(y-centerY)/10,rotateY=(centerX-x)/10;img.style.transform=`perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05,1.05,1.05)`;});box.addEventListener('mouseleave',()=>img.style.transform='perspective(1000px) rotateX(0) rotateY(0)');</script></body></html>
