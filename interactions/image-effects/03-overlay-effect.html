<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Overlay Effect</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;gap:30px;}.img-wrapper{position:relative;width:300px;height:300px;overflow:hidden;border-radius:15px;cursor:pointer;}img{width:100%;height:100%;object-fit:cover;}.overlay{position:absolute;inset:0;background:rgba(102,126,234,0.9);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:bold;opacity:0;transition:opacity 0.5s;}.img-wrapper:hover .overlay{opacity:1;}</style></head><body><div class="img-wrapper"><img src="https://via.placeholder.com/300/667eea/fff"><div class="overlay">Hover Me</div></div><div class="img-wrapper"><img src="https://via.placeholder.com/300/764ba2/fff"><div class="overlay">Image Info</div></div><div class="img-wrapper"><img src="https://via.placeholder.com/300/f093fb/fff"><div class="overlay">Details</div></div></body></html>
