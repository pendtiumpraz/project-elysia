<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Ken Burns Effect</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}.img-container{width:600px;height:400px;overflow:hidden;border-radius:15px;}img{width:100%;height:100%;object-fit:cover;animation:ken-burns 20s ease-in-out infinite;}@keyframes ken-burns{0%{transform:scale(1) translate(0,0);}50%{transform:scale(1.3) translate(-10%,-10%);}100%{transform:scale(1) translate(0,0);}}</style></head><body><div class="img-container"><img src="https://via.placeholder.com/800x600/667eea/fff"></div></body></html>
