<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Parallax Image</title><style>*{margin:0;padding:0;}body{height:200vh;background:#000;}.parallax{position:fixed;width:100%;height:100vh;overflow:hidden;}.layer{position:absolute;width:100%;height:100%;background-size:cover;background-position:center;}.bg{background-image:url('https://via.placeholder.com/1920x1080/667eea/fff');}.mid{background-image:url('https://via.placeholder.com/1920x1080/764ba2/fff');opacity:0.5;}.front{background-image:url('https://via.placeholder.com/1920x1080/f093fb/fff');opacity:0.3;}.content{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;font-size:72px;font-weight:bold;}</style></head><body><div class="parallax"><div class="layer bg" id="bg"></div><div class="layer mid" id="mid"></div><div class="layer front" id="front"></div></div><div class="content">Scroll Down</div><script>window.addEventListener('scroll',()=>{const scrolled=window.pageYOffset;document.getElementById('bg').style.transform=`translateY(${scrolled*0.5}px)`;document.getElementById('mid').style.transform=`translateY(${scrolled*0.3}px)`;document.getElementById('front').style.transform=`translateY(${scrolled*0.1}px)`;});</script></body></html>
