<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Mosaic Hover</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;}.grid{display:grid;grid-template-columns:repeat(3,200px);gap:10px;}.grid-item{width:200px;height:200px;overflow:hidden;border-radius:10px;transition:all 0.3s;}img{width:100%;height:100%;object-fit:cover;filter:grayscale(100%);transition:all 0.5s;}.grid-item:hover{transform:scale(1.1);z-index:10;}.grid-item:hover img{filter:grayscale(0);}</style></head><body><div class="grid"><div class="grid-item"><img src="https://via.placeholder.com/200/667eea/fff"></div><div class="grid-item"><img src="https://via.placeholder.com/200/764ba2/fff"></div><div class="grid-item"><img src="https://via.placeholder.com/200/f093fb/fff"></div><div class="grid-item"><img src="https://via.placeholder.com/200/f5576c/fff"></div><div class="grid-item"><img src="https://via.placeholder.com/200/43e97b/fff"></div><div class="grid-item"><img src="https://via.placeholder.com/200/fa709a/fff"></div></div></body></html>
