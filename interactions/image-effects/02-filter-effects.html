<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Image Filters</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;gap:20px;flex-wrap:wrap;padding:50px;}.img-box{width:250px;border-radius:15px;overflow:hidden;}img{width:100%;display:block;transition:all 0.5s;}.grayscale:hover img{filter:grayscale(100%);}.blur:hover img{filter:blur(5px);}.sepia:hover img{filter:sepia(100%);}.invert:hover img{filter:invert(100%);}.brightness:hover img{filter:brightness(150%);}.contrast:hover img{filter:contrast(200%);}</style></head><body><div class="img-box grayscale"><img src="https://via.placeholder.com/250/667eea/fff" alt="Grayscale"></div><div class="img-box blur"><img src="https://via.placeholder.com/250/764ba2/fff" alt="Blur"></div><div class="img-box sepia"><img src="https://via.placeholder.com/250/f093fb/fff" alt="Sepia"></div><div class="img-box invert"><img src="https://via.placeholder.com/250/f5576c/fff" alt="Invert"></div><div class="img-box brightness"><img src="https://via.placeholder.com/250/43e97b/fff" alt="Bright"></div><div class="img-box contrast"><img src="https://via.placeholder.com/250/fa709a/fff" alt="Contrast"></div></body></html>
