<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Flip Image</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:30px;}.flip-box{width:300px;height:400px;perspective:1000px;}.flip-inner{position:relative;width:100%;height:100%;transition:transform 0.8s;transform-style:preserve-3d;}.flip-box:hover .flip-inner{transform:rotateY(180deg);}.flip-front,.flip-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:15px;overflow:hidden;}.flip-back{transform:rotateY(180deg);}img{width:100%;height:100%;object-fit:cover;}</style></head><body><div class="flip-box"><div class="flip-inner"><div class="flip-front"><img src="https://via.placeholder.com/300x400/667eea/fff"></div><div class="flip-back"><img src="https://via.placeholder.com/300x400/f093fb/fff"></div></div></div></body></html>
