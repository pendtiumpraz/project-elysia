<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Comparison Slider</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}.container{position:relative;width:600px;height:400px;overflow:hidden;border-radius:15px;}img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;}.after{clip-path:inset(0 0 0 50%);}.slider{position:absolute;top:0;left:50%;width:4px;height:100%;background:#fff;cursor:ew-resize;}.handle{position:absolute;top:50%;left:50%;width:40px;height:40px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);}</style></head><body><div class="container" id="container"><img src="https://via.placeholder.com/600x400/667eea/fff" class="before"><img src="https://via.placeholder.com/600x400/f093fb/fff" class="after" id="after"><div class="slider" id="slider"><div class="handle"></div></div></div><script>const slider=document.getElementById('slider'),after=document.getElementById('after'),container=document.getElementById('container');let isDragging=false;slider.addEventListener('mousedown',()=>isDragging=true);document.addEventListener('mouseup',()=>isDragging=false);container.addEventListener('mousemove',e=>{if(!isDragging)return;const rect=container.getBoundingClientRect(),x=e.clientX-rect.left,percent=(x/rect.width)*100;slider.style.left=percent+'%';after.style.clipPath=`inset(0 0 0 ${percent}%)`;});</script></body></html>
