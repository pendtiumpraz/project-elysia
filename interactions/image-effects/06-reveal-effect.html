<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Reveal Effect</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;gap:30px;}.reveal-box{position:relative;width:300px;height:400px;overflow:hidden;border-radius:15px;cursor:pointer;}img{width:100%;height:100%;object-fit:cover;}.reveal{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#667eea,#764ba2);transform:translateY(100%);transition:transform 0.5s;}.reveal-box:hover .reveal{transform:translateY(0);}</style></head><body><div class="reveal-box"><img src="https://via.placeholder.com/300x400/667eea/fff"><div class="reveal"></div></div><div class="reveal-box"><img src="https://via.placeholder.com/300x400/764ba2/fff"><div class="reveal"></div></div></body></html>
