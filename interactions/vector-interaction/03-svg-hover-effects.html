<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Hover Effects</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        
        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 50px;
        }
        
        .icon-container {
            cursor: pointer;
        }
        
        svg {
            width: 120px;
            height: 120px;
            transition: all 0.3s;
        }
        
        .icon-container:hover svg {
            transform: scale(1.2) rotate(10deg);
        }
        
        .icon-shape {
            fill: white;
            transition: all 0.3s;
        }
        
        .icon-container:hover .icon-shape {
            fill: #f5576c;
            filter: drop-shadow(0 0 20px #f5576c);
        }
    </style>
</head>
<body>
    <div class="icon-grid">
        <div class="icon-container">
            <svg viewBox="0 0 100 100">
                <circle class="icon-shape" cx="50" cy="50" r="40"/>
            </svg>
        </div>
        
        <div class="icon-container">
            <svg viewBox="0 0 100 100">
                <rect class="icon-shape" x="20" y="20" width="60" height="60"/>
            </svg>
        </div>
        
        <div class="icon-container">
            <svg viewBox="0 0 100 100">
                <polygon class="icon-shape" points="50,10 90,90 10,90"/>
            </svg>
        </div>
        
        <div class="icon-container">
            <svg viewBox="0 0 100 100">
                <path class="icon-shape" d="M50,15 L60,35 L82,35 L65,50 L72,70 L50,57 L28,70 L35,50 L18,35 L40,35 Z"/>
            </svg>
        </div>
        
        <div class="icon-container">
            <svg viewBox="0 0 100 100">
                <path class="icon-shape" d="M50,80 C50,80 20,60 20,40 C20,28 28,20 40,20 C46,20 52,25 50,30 C48,25 42,20 36,20 C28,20 20,28 20,40"/>
            </svg>
        </div>
        
        <div class="icon-container">
            <svg viewBox="0 0 100 100">
                <polygon class="icon-shape" points="50,20 80,40 70,70 30,70 20,40"/>
            </svg>
        </div>
    </div>
</body>
</html>
