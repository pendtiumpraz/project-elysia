<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphing Shapes - SVG</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        
        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        
        h1 {
            color: white;
            font-size: 48px;
            margin-bottom: 50px;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        svg {
            width: 400px;
            height: 400px;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
        }
        
        .morph-shape {
            fill: white;
            transition: d 1s ease-in-out;
        }
        
        .controls {
            margin-top: 50px;
            display: flex;
            gap: 15px;
        }
        
        button {
            padding: 15px 30px;
            font-size: 18px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <h1>🔄 Morphing Shapes</h1>
    
    <svg viewBox="0 0 200 200">
        <path class="morph-shape" id="morphShape" d="M100,20 L180,100 L100,180 L20,100 Z"/>
    </svg>
    
    <div class="controls">
        <button onclick="morphTo('circle')">⭕ Circle</button>
        <button onclick="morphTo('square')">⬛ Square</button>
        <button onclick="morphTo('star')">⭐ Star</button>
        <button onclick="morphTo('heart')">❤️ Heart</button>
    </div>
    
    <script>
        const shapes = {
            circle: 'M100,20 A80,80 0 1,0 100,180 A80,80 0 1,0 100,20',
            square: 'M40,40 L160,40 L160,160 L40,160 Z',
            star: 'M100,20 L115,70 L170,70 L125,110 L140,160 L100,125 L60,160 L75,110 L30,70 L85,70 Z',
            heart: 'M100,160 C100,160 40,110 40,75 C40,55 55,40 75,40 C85,40 95,45 100,55 C105,45 115,40 125,40 C145,40 160,55 160,75 C160,110 100,160 100,160 Z'
        };
        
        function morphTo(shape) {
            document.getElementById('morphShape').setAttribute('d', shapes[shape]);
        }
    </script>
</body>
</html>
