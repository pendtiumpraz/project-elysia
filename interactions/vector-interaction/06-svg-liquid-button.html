<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Liquid Button</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        
        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        
        .liquid-button {
            position: relative;
            width: 300px;
            height: 80px;
            cursor: pointer;
        }
        
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .liquid-shape {
            fill: #f093fb;
            transition: all 0.5s;
        }
        
        .liquid-button:hover .liquid-shape {
            fill: #f5576c;
        }
        
        .button-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="liquid-button">
        <svg viewBox="0 0 300 80">
            <path class="liquid-shape" d="M10,40 Q10,10 40,10 L260,10 Q290,10 290,40 Q290,70 260,70 L40,70 Q10,70 10,40">
                <animate attributeName="d" 
                    values="M10,40 Q10,10 40,10 L260,10 Q290,10 290,40 Q290,70 260,70 L40,70 Q10,70 10,40;
                            M10,40 Q10,20 40,15 L260,15 Q290,20 290,40 Q290,65 260,65 L40,65 Q10,65 10,40;
                            M10,40 Q10,10 40,10 L260,10 Q290,10 290,40 Q290,70 260,70 L40,70 Q10,70 10,40"
                    dur="3s"
                    repeatCount="indefinite"/>
            </path>
        </svg>
        <div class="button-text">Liquid Button</div>
    </div>
</body>
</html>
