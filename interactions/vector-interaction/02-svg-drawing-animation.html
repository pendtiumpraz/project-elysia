<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Drawing Animation</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        
        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        
        h1 {
            color: white;
            font-size: 48px;
            margin-bottom: 50px;
        }
        
        svg {
            width: 600px;
            height: 400px;
        }
        
        .draw-path {
            fill: none;
            stroke: #00ffff;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 3s ease-out forwards;
            filter: drop-shadow(0 0 10px #00ffff);
        }
        
        @keyframes draw {
            to {
                stroke-dashoffset: 0;
            }
        }
        
        .draw-path:nth-child(2) {
            animation-delay: 0.5s;
            stroke: #f093fb;
            filter: drop-shadow(0 0 10px #f093fb);
        }
        
        .draw-path:nth-child(3) {
            animation-delay: 1s;
            stroke: #43e97b;
            filter: drop-shadow(0 0 10px #43e97b);
        }
        
        button {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 18px;
            background: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>✏️ SVG Drawing Animation</h1>
    
    <svg viewBox="0 0 300 200">
        <path class="draw-path" d="M50,100 Q100,50 150,100 T250,100"/>
        <path class="draw-path" d="M50,120 L150,120 L100,180 Z"/>
        <circle class="draw-path" cx="200" cy="150" r="30"/>
    </svg>
    
    <button onclick="replay()">🔄 Replay</button>
    
    <script>
        function replay() {
            const paths = document.querySelectorAll('.draw-path');
            paths.forEach(path => {
                path.style.animation = 'none';
                setTimeout(() => {
                    path.style.animation = '';
                }, 10);
            });
        }
    </script>
</body>
</html>
