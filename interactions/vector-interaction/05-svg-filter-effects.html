<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Filter Effects</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        
        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        
        h1 {
            color: white;
            font-size: 48px;
            margin-bottom: 50px;
        }
        
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
        }
        
        svg {
            width: 150px;
            height: 150px;
            cursor: pointer;
        }
        
        .shape {
            fill: #667eea;
            transition: all 0.3s;
        }
        
        svg:hover .shape {
            fill: #f093fb;
        }
    </style>
</head>
<body>
    <h1>🎨 SVG Filter Effects</h1>
    
    <div class="filter-grid">
        <svg viewBox="0 0 100 100">
            <defs>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
            <circle class="shape" cx="50" cy="50" r="40" filter="url(#glow)"/>
        </svg>
        
        <svg viewBox="0 0 100 100">
            <defs>
                <filter id="displace">
                    <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" result="turbulence"/>
                    <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="10"/>
                </filter>
            </defs>
            <rect class="shape" x="20" y="20" width="60" height="60" filter="url(#displace)"/>
        </svg>
        
        <svg viewBox="0 0 100 100">
            <defs>
                <filter id="shadow">
                    <feDropShadow dx="5" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
                </filter>
            </defs>
            <polygon class="shape" points="50,10 90,90 10,90" filter="url(#shadow)"/>
        </svg>
    </div>
</body>
</html>
