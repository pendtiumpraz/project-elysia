<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Bounce Text</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}.bounce{display:flex;font-size:72px;font-weight:bold;}.bounce span{display:inline-block;color:#fff;animation:bounce 0.6s ease-in-out infinite;}.bounce span:nth-child(1){animation-delay:0s;color:#ff0000;}.bounce span:nth-child(2){animation-delay:0.1s;color:#ff7f00;}.bounce span:nth-child(3){animation-delay:0.2s;color:#ffff00;}.bounce span:nth-child(4){animation-delay:0.3s;color:#00ff00;}.bounce span:nth-child(5){animation-delay:0.4s;color:#0000ff;}.bounce span:nth-child(6){animation-delay:0.5s;color:#4b0082;}@keyframes bounce{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-30px) scale(1.2);}}</style></head><body><div class="bounce"><span>B</span><span>O</span><span>U</span><span>N</span><span>C</span><span>E</span></div></body></html>
