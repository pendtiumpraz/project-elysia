<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Typing Effect</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;font-family:'Courier New',monospace;}.text{font-size:48px;color:#0f0;border-right:3px solid#0f0;white-space:nowrap;overflow:hidden;animation:typing 4s steps(30) infinite,blink 0.5s step-end infinite alternate;}@keyframes typing{0%,100%{width:0;}50%{width:100%;}}@keyframes blink{50%{border-color:transparent;}}</style></head><body><div class="text">Hello, World!</div></body></html>
