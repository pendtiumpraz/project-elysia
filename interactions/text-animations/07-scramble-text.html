<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Scramble Text</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:'Courier New';}.scramble{font-size:64px;color:#fff;font-weight:bold;}</style></head><body><div class="scramble" id="text">SCRAMBLE</div><script>const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';const target='SCRAMBLE';const el=document.getElementById('text');let frame=0;function scramble(){let output='';for(let i=0;i<target.length;i++){if(frame>=i*3){output+=target[i];}else{output+=chars[Math.floor(Math.random()*chars.length)];}}el.textContent=output;if(frame<target.length*3){frame++;requestAnimationFrame(scramble);}else{setTimeout(()=>{frame=0;scramble();},2000);}}scramble();</script></body></html>
