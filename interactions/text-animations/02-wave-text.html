<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Wave Text</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);}.wave{display:flex;font-size:64px;font-weight:bold;}.wave span{display:inline-block;animation:wave 1s ease-in-out infinite;color:#fff;}.wave span:nth-child(1){animation-delay:0s;}.wave span:nth-child(2){animation-delay:0.1s;}.wave span:nth-child(3){animation-delay:0.2s;}.wave span:nth-child(4){animation-delay:0.3s;}.wave span:nth-child(5){animation-delay:0.4s;}@keyframes wave{0%,100%{transform:translateY(0);}50%{transform:translateY(-20px);}}</style></head><body><div class="wave"><span>W</span><span>A</span><span>V</span><span>E</span><span>!</span></div></body></html>
