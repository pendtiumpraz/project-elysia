<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Gradient Text</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}.gradient-text{font-size:96px;font-weight:bold;background:linear-gradient(45deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#9400d3);background-size:400%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradient 3s ease infinite;}@keyframes gradient{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}</style></head><body><div class="gradient-text">GRADIENT</div></body></html>
