<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Fade In Text</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial;}.fade-text{font-size:48px;color:#fff;}.fade-text span{display:inline-block;opacity:0;animation:fadeIn 0.5s forwards;}.fade-text span:nth-child(1){animation-delay:0s;}.fade-text span:nth-child(2){animation-delay:0.1s;}.fade-text span:nth-child(3){animation-delay:0.2s;}.fade-text span:nth-child(4){animation-delay:0.3s;}.fade-text span:nth-child(5){animation-delay:0.4s;}.fade-text span:nth-child(6){animation-delay:0.5s;}.fade-text span:nth-child(7){animation-delay:0.6s;}.fade-text span:nth-child(8){animation-delay:0.7s;}.fade-text span:nth-child(9){animation-delay:0.8s;}.fade-text span:nth-child(10){animation-delay:0.9s;}.fade-text span:nth-child(11){animation-delay:1s;}@keyframes fadeIn{to{opacity:1;transform:translateY(0);}from{transform:translateY(20px);}}</style></head><body><div class="fade-text"><span>F</span><span>A</span><span>D</span><span>E</span><span> </span><span>I</span><span>N</span><span> </span><span>T</span><span>E</span><span>X</span><span>T</span></div></body></html>
