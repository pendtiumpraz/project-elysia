<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>3D Text</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);perspective:1000px;}.text-3d{font-size:120px;font-weight:bold;color:#fff;transform-style:preserve-3d;animation:rotate3d 5s linear infinite;text-shadow:1px 1px 0 #999,2px 2px 0 #888,3px 3px 0 #777,4px 4px 0 #666,5px 5px 0 #555,6px 6px 0 #444,7px 7px 0 #333,8px 8px 10px rgba(0,0,0,0.5);}@keyframes rotate3d{from{transform:rotateY(0deg);}to{transform:rotateY(360deg);}}</style></head><body><div class="text-3d">3D TEXT</div></body></html>
