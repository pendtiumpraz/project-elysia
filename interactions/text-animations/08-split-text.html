<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Split Text</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;}.split{font-size:96px;font-weight:bold;color:#00ffff;position:relative;}.split::before,.split::after{content:attr(data-text);position:absolute;top:0;}.split::before{left:0;animation:split-left 2s ease-in-out infinite;color:#ff00ff;clip-path:polygon(0 0,50% 0,50% 100%,0 100%);}@keyframes split-left{0%,100%{transform:translateX(0);}50%{transform:translateX(-20px);}}.split::after{right:0;animation:split-right 2s ease-in-out infinite;color:#00ffff;clip-path:polygon(50% 0,100% 0,100% 100%,50% 100%);}@keyframes split-right{0%,100%{transform:translateX(0);}50%{transform:translateX(20px);}}</style></head><body><div class="split" data-text="SPLIT">SPLIT</div></body></html>
