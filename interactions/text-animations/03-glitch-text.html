<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Glitch Text</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}.glitch{font-size:96px;font-weight:bold;color:#fff;position:relative;animation:glitch 1s infinite;}@keyframes glitch{0%,100%{transform:translate(0);}20%{transform:translate(-5px,5px);}40%{transform:translate(-5px,-5px);}60%{transform:translate(5px,5px);}80%{transform:translate(5px,-5px);}}.glitch::before,.glitch::after{content:attr(data-text);position:absolute;top:0;left:0;}.glitch::before{color:#f00;animation:glitch-before 0.3s infinite;}@keyframes glitch-before{0%,100%{clip-path:inset(0 0 0 0);}50%{clip-path:inset(40% 0 20% 0);}}.glitch::after{color:#0ff;animation:glitch-after 0.3s infinite;}@keyframes glitch-after{0%,100%{clip-path:inset(0 0 0 0);}50%{clip-path:inset(20% 0 40% 0);}}</style></head><body><div class="glitch" data-text="GLITCH">GLITCH</div></body></html>
