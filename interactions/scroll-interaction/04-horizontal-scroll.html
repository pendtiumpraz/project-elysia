<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Scroll</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        
        body {
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
        }
        
        .horizontal-container {
            height: 500vh;
        }
        
        .horizontal-scroll {
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: hidden;
        }
        
        .slides {
            display: flex;
            height: 100%;
            will-change: transform;
        }
        
        .slide {
            min-width: 100vw;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 72px;
            font-weight: bold;
        }
        
        .slide-1 {background: linear-gradient(135deg, #667eea, #764ba2);}
        .slide-2 {background: linear-gradient(135deg, #f093fb, #f5576c);}
        .slide-3 {background: linear-gradient(135deg, #4facfe, #00f2fe);}
        .slide-4 {background: linear-gradient(135deg, #43e97b, #38f9d7);}
        .slide-5 {background: linear-gradient(135deg, #fa709a, #fee140);}
    </style>
</head>
<body>
    <div class="horizontal-container">
        <div class="horizontal-scroll">
            <div class="slides" id="slides">
                <div class="slide slide-1">↔️ Slide 1</div>
                <div class="slide slide-2">↔️ Slide 2</div>
                <div class="slide slide-3">↔️ Slide 3</div>
                <div class="slide slide-4">↔️ Slide 4</div>
                <div class="slide slide-5">↔️ Slide 5</div>
            </div>
        </div>
    </div>
    
    <script>
        const slides = document.getElementById('slides');
        const container = document.querySelector('.horizontal-container');
        
        window.addEventListener('scroll', () => {
            const containerRect = container.getBoundingClientRect();
            const scrollProgress = -containerRect.top / (containerRect.height - window.innerHeight);
            const maxScroll = slides.scrollWidth - window.innerWidth;
            const scrollX = Math.max(0, Math.min(maxScroll, scrollProgress * maxScroll));
            
            slides.style.transform = `translateX(-${scrollX}px)`;
        });
    </script>
</body>
</html>
