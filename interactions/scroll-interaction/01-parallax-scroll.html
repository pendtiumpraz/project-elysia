<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Scroll Effect</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        
        body {
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
        }
        
        .parallax-section {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .parallax-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 120%;
            background-size: cover;
            background-position: center;
            z-index: -1;
        }
        
        .section-1 .parallax-bg {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        
        .section-2 .parallax-bg {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }
        
        .section-3 .parallax-bg {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }
        
        .content {
            text-align: center;
            color: white;
            z-index: 10;
            padding: 20px;
        }
        
        .content h1 {
            font-size: 72px;
            margin-bottom: 20px;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: translateY(50px);
            animation: fadeInUp 1s forwards;
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .content p {
            font-size: 24px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s 0.3s forwards;
        }
        
        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 48px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% {transform: translate(-50%, 0);}
            50% {transform: translate(-50%, -20px);}
        }
    </style>
</head>
<body>
    <div class="parallax-section section-1">
        <div class="parallax-bg" data-speed="0.5"></div>
        <div class="content">
            <h1>🌄 Parallax Scroll</h1>
            <p>Scroll down to see the magic!</p>
        </div>
        <div class="scroll-indicator">⬇️</div>
    </div>
    
    <div class="parallax-section section-2">
        <div class="parallax-bg" data-speed="0.3"></div>
        <div class="content">
            <h1>✨ Smooth Motion</h1>
            <p>Different layers move at different speeds</p>
        </div>
    </div>
    
    <div class="parallax-section section-3">
        <div class="parallax-bg" data-speed="0.7"></div>
        <div class="content">
            <h1>🚀 Keep Scrolling</h1>
            <p>Creating depth and dimension</p>
        </div>
    </div>
    
    <script>
        const parallaxBgs = document.querySelectorAll('.parallax-bg');
        
        window.addEventListener('scroll', () => {
            parallaxBgs.forEach(bg => {
                const speed = parseFloat(bg.dataset.speed);
                const rect = bg.parentElement.getBoundingClientRect();
                const yPos = -(rect.top * speed);
                bg.style.transform = `translateY(${yPos}px)`;
            });
        });
    </script>
</body>
</html>
