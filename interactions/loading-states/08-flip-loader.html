<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Flip Loader</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);}.cube{width:60px;height:60px;background:#fff;animation:flip 1.2s ease-in-out infinite;}@keyframes flip{0%,100%{transform:rotateY(0) rotateX(0);}25%{transform:rotateY(180deg) rotateX(0);}50%{transform:rotateY(180deg) rotateX(180deg);}75%{transform:rotateY(0) rotateX(180deg);}}</style></head><body><div class="cube"></div></body></html>
