<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Progress Bars</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:40px;padding:50px;}.progress-container{width:500px;}.progress-bar{width:100%;height:30px;background:#ddd;border-radius:50px;overflow:hidden;}.fill{height:100%;background:linear-gradient(90deg,#00ffff,#ff00ff);border-radius:50px;animation:load 3s ease-in-out infinite;}@keyframes load{0%{width:0%;}50%{width:100%;}100%{width:0%;}}.circular{width:150px;height:150px;}.circular svg{transform:rotate(-90deg);}.circular circle{fill:none;stroke:#ddd;stroke-width:10;}.circular .progress{stroke:#00ffff;stroke-dasharray:440;stroke-dashoffset:440;animation:circle 3s ease-in-out infinite;}@keyframes circle{0%,100%{stroke-dashoffset:440;}50%{stroke-dashoffset:0;}}</style></head><body><div class="progress-container"><h3 style="color:#fff;margin-bottom:10px;">Linear Progress</h3><div class="progress-bar"><div class="fill"></div></div></div><div class="circular"><svg width="150" height="150"><circle cx="75" cy="75" r="70"/><circle class="progress" cx="75" cy="75" r="70"/></svg></div></body></html>
