<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Percentage Loader</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial;color:#fff;}.loader{text-align:center;}.percentage{font-size:72px;font-weight:bold;margin-bottom:20px;background:linear-gradient(90deg,#00ffff,#ff00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.bar-container{width:400px;height:10px;background:#0f3460;border-radius:10px;overflow:hidden;}.bar-fill{height:100%;background:linear-gradient(90deg,#00ffff,#ff00ff);width:0%;animation:fill 3s ease-in-out forwards;}@keyframes fill{to{width:100%;}}</style></head><body><div class="loader"><div class="percentage" id="percent">0%</div><div class="bar-container"><div class="bar-fill"></div></div></div><script>let count=0;const interval=setInterval(()=>{count++;document.getElementById('percent').textContent=count+'%';if(count>=100)clearInterval(interval);},30);</script></body></html>
