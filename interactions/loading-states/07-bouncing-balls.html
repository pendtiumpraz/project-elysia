<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Bouncing Balls</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}.container{display:flex;gap:15px;align-items:flex-end;height:100px;}.ball{width:30px;height:30px;border-radius:50%;animation:bounce 0.6s ease-in-out infinite alternate;}.ball:nth-child(1){background:#ff0000;animation-delay:0s;}.ball:nth-child(2){background:#00ff00;animation-delay:0.1s;}.ball:nth-child(3){background:#0000ff;animation-delay:0.2s;}.ball:nth-child(4){background:#ffff00;animation-delay:0.3s;}@keyframes bounce{from{transform:translateY(0);}to{transform:translateY(-70px);}}</style></head><body><div class="container"><div class="ball"></div><div class="ball"></div><div class="ball"></div><div class="ball"></div></div></body></html>
