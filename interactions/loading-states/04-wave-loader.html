<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Wave Loader</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}.wave{display:flex;gap:5px;}.bar{width:10px;height:60px;background:linear-gradient(180deg,#00ffff,#ff00ff);border-radius:10px;animation:wave 1s ease-in-out infinite;}.bar:nth-child(1){animation-delay:0s;}.bar:nth-child(2){animation-delay:0.1s;}.bar:nth-child(3){animation-delay:0.2s;}.bar:nth-child(4){animation-delay:0.3s;}.bar:nth-child(5){animation-delay:0.4s;}@keyframes wave{0%,100%{transform:scaleY(0.5);}50%{transform:scaleY(1);}}</style></head><body><div class="wave"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div></body></html>
