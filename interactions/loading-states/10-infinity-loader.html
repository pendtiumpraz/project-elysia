<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Infinity Loader</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}.infinity{width:200px;height:100px;position:relative;}.circle{position:absolute;width:80px;height:80px;border:8px solid;border-radius:50%;}.circle:nth-child(1){left:0;border-color:#00ffff transparent transparent transparent;animation:spin1 1.5s linear infinite;}@keyframes spin1{to{transform:rotate(360deg);}}.circle:nth-child(2){right:0;border-color:transparent #ff00ff transparent transparent;animation:spin2 1.5s linear infinite;}@keyframes spin2{to{transform:rotate(-360deg);}}</style></head><body><div class="infinity"><div class="circle"></div><div class="circle"></div></div></body></html>
