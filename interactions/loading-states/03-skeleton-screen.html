<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Skeleton Screen</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f5;font-family:Arial;}.card{width:400px;background:#fff;padding:30px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,0.1);}.skeleton{background:#e0e0e0;border-radius:8px;animation:pulse 1.5s ease-in-out infinite;margin-bottom:15px;}@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}.avatar{width:60px;height:60px;border-radius:50%;}.title{height:20px;width:70%;}.text{height:15px;width:100%;}.text:last-child{width:80%;}</style></head><body><div class="card"><div class="skeleton avatar"></div><div class="skeleton title" style="margin-top:20px;"></div><div class="skeleton text"></div><div class="skeleton text"></div><div class="skeleton text"></div></div></body></html>
