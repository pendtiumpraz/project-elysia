<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Orbit Spinner</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);}.orbit{position:relative;width:150px;height:150px;}.ball{position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:calc(50% - 10px);left:calc(50% - 10px);animation:orbit 2s linear infinite;transform-origin:75px 0;}@keyframes orbit{to{transform:rotate(360deg);}}.ball:nth-child(2){animation-delay:0.5s;}.ball:nth-child(3){animation-delay:1s;}.ball:nth-child(4){animation-delay:1.5s;}</style></head><body><div class="orbit"><div class="ball"></div><div class="ball"></div><div class="ball"></div><div class="ball"></div></div></body></html>
