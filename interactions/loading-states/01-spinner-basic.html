<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Loading Spinners</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;gap:50px;flex-wrap:wrap;}.spinner{width:60px;height:60px;border:6px solid rgba(255,255,255,0.1);border-top-color:#00ffff;border-radius:50%;animation:spin 1s linear infinite;}@keyframes spin{to{transform:rotate(360deg);}}.dots{display:flex;gap:10px;}.dot{width:20px;height:20px;background:#ff00ff;border-radius:50%;animation:bounce 1.4s infinite both;}.dot:nth-child(1){animation-delay:-0.32s;}.dot:nth-child(2){animation-delay:-0.16s;}@keyframes bounce{0%,80%,100%{transform:scale(0);}40%{transform:scale(1);}}.pulse{width:60px;height:60px;border-radius:50%;background:#ffff00;animation:pulse 1.5s ease-in-out infinite;}@keyframes pulse{0%,100%{transform:scale(0.8);opacity:1;}50%{transform:scale(1.2);opacity:0.5;}}</style></head><body><div class="spinner"></div><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><div class="pulse"></div></body></html>
