<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Clock Loader</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;}.clock{width:150px;height:150px;border:8px solid#0f3460;border-radius:50%;position:relative;}.hand{position:absolute;background:#00ffff;transform-origin:bottom center;border-radius:10px;}.hour{width:6px;height:45px;left:72px;top:30px;animation:rotate 2s linear infinite;}@keyframes rotate{to{transform:rotate(360deg);}}.minute{width:4px;height:60px;left:73px;top:15px;animation:rotate 1.5s linear infinite;}.second{width:2px;height:70px;left:74px;top:5px;background:#ff00ff;animation:rotate 1s linear infinite;}</style></head><body><div class="clock"><div class="hand hour"></div><div class="hand minute"></div><div class="hand second"></div></div></body></html>
