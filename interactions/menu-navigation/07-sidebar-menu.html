<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Sidebar Menu</title><style>*{margin:0;padding:0;}body{font-family:Arial;background:#f5f5f5;}.sidebar{position:fixed;left:0;top:0;width:250px;height:100%;background:#16213e;padding:30px 0;transition:transform 0.3s;}.sidebar.collapsed{transform:translateX(-250px);}.menu-item{padding:15px 30px;color:#aaa;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;gap:15px;}.menu-item:hover{background:#0f3460;color:#00ffff;}.menu-item.active{background:#0f3460;color:#00ffff;border-left:4px solid #00ffff;}.toggle-btn{position:fixed;top:20px;left:20px;background:#667eea;color:#fff;border:none;padding:12px 20px;border-radius:10px;cursor:pointer;z-index:10;}.content{margin-left:250px;padding:30px;transition:margin 0.3s;}.sidebar.collapsed~.content{margin-left:0;}</style></head><body><div class="sidebar" id="sidebar"><div class="menu-item active">🏠 Dashboard</div><div class="menu-item">📊 Analytics</div><div class="menu-item">📁 Files</div><div class="menu-item">⚙️ Settings</div><div class="menu-item">👤 Profile</div><div class="menu-item">🚪 Logout</div></div><button class="toggle-btn" onclick="toggleSidebar()">☰ Menu</button><div class="content"><h1>Main Content</h1><p>Your content goes here.</p></div><script>function toggleSidebar(){document.getElementById('sidebar').classList.toggle('collapsed');}</script></body></html>
