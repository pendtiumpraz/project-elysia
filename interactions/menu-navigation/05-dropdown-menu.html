<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Dropdown Menu</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial;}.dropdown{position:relative;}.dropdown-btn{padding:15px 30px;background:#fff;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;color:#667eea;box-shadow:0 5px 15px rgba(0,0,0,0.2);}.dropdown-menu{position:absolute;top:calc(100% + 10px);left:0;background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,0.2);min-width:200px;opacity:0;visibility:hidden;transform:translateY(-10px);transition:all 0.3s;}.dropdown.active .dropdown-menu{opacity:1;visibility:visible;transform:translateY(0);}.dropdown-item{padding:15px 20px;cursor:pointer;transition:background 0.3s;}.dropdown-item:hover{background:#f5f5f5;}.dropdown-item:first-child{border-radius:10px 10px 0 0;}.dropdown-item:last-child{border-radius:0 0 10px 10px;}</style></head><body><div class="dropdown" id="dropdown"><button class="dropdown-btn" onclick="toggleDropdown()">Select Option ▼</button><div class="dropdown-menu"><div class="dropdown-item">Option 1</div><div class="dropdown-item">Option 2</div><div class="dropdown-item">Option 3</div><div class="dropdown-item">Option 4</div></div></div><script>function toggleDropdown(){document.getElementById('dropdown').classList.toggle('active');}document.addEventListener('click',e=>{if(!e.target.closest('.dropdown'))document.getElementById('dropdown').classList.remove('active');});</script></body></html>
