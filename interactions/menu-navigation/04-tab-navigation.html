<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Tab Navigation</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial;}.tabs-container{width:600px;background:#16213e;border-radius:15px;overflow:hidden;}.tab-list{display:flex;background:#0f3460;}.tab-btn{flex:1;padding:20px;background:transparent;border:none;color:#aaa;cursor:pointer;font-size:16px;transition:all 0.3s;border-bottom:3px solid transparent;}.tab-btn.active{color:#00ffff;border-bottom-color:#00ffff;}.tab-content{display:none;padding:30px;color:#fff;}.tab-content.active{display:block;}</style></head><body><div class="tabs-container"><div class="tab-list"><button class="tab-btn active" onclick="openTab(event,0)">Tab 1</button><button class="tab-btn" onclick="openTab(event,1)">Tab 2</button><button class="tab-btn" onclick="openTab(event,2)">Tab 3</button></div><div class="tab-content active"><h2>Content 1</h2><p>This is tab 1 content.</p></div><div class="tab-content"><h2>Content 2</h2><p>This is tab 2 content.</p></div><div class="tab-content"><h2>Content 3</h2><p>This is tab 3 content.</p></div></div><script>function openTab(e,index){document.querySelectorAll('.tab-btn').forEach(btn=>btn.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(content=>content.classList.remove('active'));e.target.classList.add('active');document.querySelectorAll('.tab-content')[index].classList.add('active');}</script></body></html>
