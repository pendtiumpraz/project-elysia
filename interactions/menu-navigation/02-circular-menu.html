<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Circular Menu</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;}.menu-btn{width:60px;height:60px;background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:50%;color:#fff;font-size:24px;cursor:pointer;position:relative;z-index:10;}.menu-items{position:absolute;}.menu-item{position:absolute;width:50px;height:50px;background:#00ffff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-weight:bold;transform:scale(0);transition:all 0.3s;cursor:pointer;}.menu-btn.active~.menu-items .menu-item{transform:scale(1);}.menu-item:nth-child(1){top:-80px;left:0;transition-delay:0.1s;}.menu-item:nth-child(2){top:-56px;left:56px;transition-delay:0.2s;}.menu-item:nth-child(3){top:0;left:80px;transition-delay:0.3s;}.menu-item:nth-child(4){top:56px;left:56px;transition-delay:0.4s;}.menu-item:nth-child(5){top:80px;left:0;transition-delay:0.5s;}</style></head><body><button class="menu-btn" onclick="this.classList.toggle('active')">☰</button><div class="menu-items"><div class="menu-item">🏠</div><div class="menu-item">⚙️</div><div class="menu-item">📊</div><div class="menu-item">👤</div><div class="menu-item">📧</div></div></body></html>
