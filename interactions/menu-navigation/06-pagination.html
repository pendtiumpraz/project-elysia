<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Pagination</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial;}.pagination{display:flex;gap:10px;}.page-btn{padding:12px 18px;background:#16213e;color:#fff;border:2px solid #0f3460;border-radius:10px;cursor:pointer;font-size:16px;font-weight:bold;transition:all 0.3s;}.page-btn:hover{background:#00ffff;color:#000;border-color:#00ffff;}.page-btn.active{background:#00ffff;color:#000;border-color:#00ffff;}.page-btn.disabled{opacity:0.5;pointer-events:none;}</style></head><body><div class="pagination"><button class="page-btn">«</button><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">3</button><button class="page-btn">4</button><button class="page-btn">5</button><button class="page-btn">»</button></div></body></html>
