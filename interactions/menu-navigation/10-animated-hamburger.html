<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Animated Hamburger</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;}.hamburger{width:50px;height:40px;position:relative;cursor:pointer;}.line{width:100%;height:4px;background:#00ffff;border-radius:10px;position:absolute;transition:all 0.3s;}.line:nth-child(1){top:0;}.line:nth-child(2){top:50%;transform:translateY(-50%);}.line:nth-child(3){bottom:0;}.hamburger.active .line:nth-child(1){top:50%;transform:translateY(-50%) rotate(45deg);}.hamburger.active .line:nth-child(2){opacity:0;}.hamburger.active .line:nth-child(3){bottom:50%;transform:translateY(50%) rotate(-45deg);}</style></head><body><div class="hamburger" id="hamburger" onclick="this.classList.toggle('active')"><div class="line"></div><div class="line"></div><div class="line"></div></div></body></html>
