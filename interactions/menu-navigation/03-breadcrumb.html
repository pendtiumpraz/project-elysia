<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Breadcrumb</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial;}.breadcrumb{display:flex;background:#fff;padding:15px 30px;border-radius:50px;box-shadow:0 10px 30px rgba(0,0,0,0.2);}.breadcrumb-item{display:flex;align-items:center;}.breadcrumb-item a{color:#667eea;text-decoration:none;padding:5px 15px;border-radius:20px;transition:all 0.3s;}.breadcrumb-item a:hover{background:#667eea;color:#fff;}.separator{margin:0 10px;color:#999;}.breadcrumb-item:last-child a{color:#999;pointer-events:none;}</style></head><body><nav class="breadcrumb"><div class="breadcrumb-item"><a href="#">Home</a></div><div class="separator">›</div><div class="breadcrumb-item"><a href="#">Products</a></div><div class="separator">›</div><div class="breadcrumb-item"><a href="#">Category</a></div><div class="separator">›</div><div class="breadcrumb-item"><a href="#">Item</a></div></nav></body></html>
