<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Context Menu</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial;}.target{width:400px;height:300px;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#667eea;box-shadow:0 10px 40px rgba(0,0,0,0.2);}.context-menu{position:fixed;background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,0.3);padding:10px 0;min-width:200px;display:none;z-index:1000;}.context-item{padding:12px 20px;cursor:pointer;transition:background 0.3s;display:flex;align-items:center;gap:10px;}.context-item:hover{background:#f5f5f5;}.separator{height:1px;background:#ddd;margin:5px 0;}</style></head><body><div class="target" id="target">Right Click Me!</div><div class="context-menu" id="contextMenu"><div class="context-item">📋 Copy</div><div class="context-item">📄 Paste</div><div class="separator"></div><div class="context-item">✂️ Cut</div><div class="context-item">🗑️ Delete</div><div class="separator"></div><div class="context-item">⚙️ Properties</div></div><script>const target=document.getElementById('target'),menu=document.getElementById('contextMenu');target.addEventListener('contextmenu',e=>{e.preventDefault();menu.style.display='block';menu.style.left=e.pageX+'px';menu.style.top=e.pageY+'px';});document.addEventListener('click',()=>menu.style.display='none');</script></body></html>
