<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Morphing Button</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial,sans-serif;gap:30px;flex-wrap:wrap;}.morph-btn{padding:20px 50px;font-size:18px;color:#fff;background:#fff;color:#667eea;border:none;border-radius:10px;cursor:pointer;font-weight:bold;transition:all 0.5s cubic-bezier(0.68,-0.55,0.265,1.55);box-shadow:0 10px 30px rgba(0,0,0,0.2);}.morph-btn:hover{border-radius:50px;background:#667eea;color:#fff;transform:scale(1.1) rotate(5deg);box-shadow:0 15px 40px rgba(102,126,234,0.4);}.morph-circle{border-radius:50%;padding:25px;}.morph-circle:hover{border-radius:10px;padding:20px 50px;}.expand-btn{transition:all 0.5s;}.expand-btn:hover{padding:25px 100px;letter-spacing:5px;}</style></head><body><button class="morph-btn">Morph Shape</button><button class="morph-btn morph-circle">●</button><button class="morph-btn expand-btn">Expand</button></body></html>
