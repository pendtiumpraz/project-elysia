<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Loading Button</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial,sans-serif;gap:30px;flex-direction:column;}.load-btn{padding:20px 50px;font-size:18px;color:#fff;background:#fff;color:#667eea;border:none;border-radius:50px;cursor:pointer;font-weight:bold;transition:all 0.3s;position:relative;overflow:hidden;min-width:200px;}.load-btn.loading{pointer-events:none;color:transparent;}.spinner{position:absolute;top:50%;left:50%;width:20px;height:20px;border:3px solid rgba(102,126,234,0.3);border-top-color:#667eea;border-radius:50%;animation:spin 0.8s linear infinite;transform:translate(-50%,-50%);opacity:0;}.load-btn.loading .spinner{opacity:1;}@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg);}}. progress-bar{position:absolute;bottom:0;left:0;height:4px;background:#667eea;width:0;transition:width 0.3s;}.load-btn.loading .progress-bar{width:100%;transition:width 3s linear;}.load-btn.success{background:#4caf50;color:#fff;}.load-btn.success::after{content:'✓';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;}</style></head><body><button class="load-btn" onclick="loadBtn1(this)">Click to Load<span class="spinner"></span><div class="progress-bar"></div></button><button class="load-btn" onclick="loadBtn2(this)">Submit Form<span class="spinner"></span></button><script>function loadBtn1(btn){btn.classList.add('loading');setTimeout(()=>{btn.classList.remove('loading');btn.classList.add('success');btn.textContent='Success!';},3000);}function loadBtn2(btn){btn.classList.add('loading');setTimeout(()=>{btn.classList.remove('loading');btn.textContent='Submitted!';},2000);}</script></body></html>
