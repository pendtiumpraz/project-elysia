<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>3D Button</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial,sans-serif;gap:30px;perspective:1000px;}.btn-3d{padding:20px 50px;font-size:20px;color:#fff;background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:15px;cursor:pointer;position:relative;transform-style:preserve-3d;transition:all 0.3s;box-shadow:0 10px 30px rgba(0,0,0,0.3);}.btn-3d::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.2);transform:translateZ(-10px);border-radius:15px;}.btn-3d:hover{transform:translateY(-5px) rotateX(10deg);box-shadow:0 20px 50px rgba(0,0,0,0.4);}.btn-3d:active{transform:translateY(0) rotateX(0);box-shadow:0 5px 15px rgba(0,0,0,0.2);}.btn-flip{transform-style:preserve-3d;transition:transform 0.6s;}.btn-flip:hover{transform:rotateY(180deg);}.btn-flip .front,.btn-flip .back{position:absolute;top:0;left:0;width:100%;height:100%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:20px 50px;border-radius:15px;}.btn-flip .back{transform:rotateY(180deg);background:linear-gradient(135deg,#f093fb,#f5576c);}</style></head><body><button class="btn-3d">3D Lift</button><button class="btn-3d btn-flip"><span class="front">Hover</span><span class="back">Flipped!</span></button></body></html>
