<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Ripple Button</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial,sans-serif;gap:30px;}.ripple-btn{padding:20px 50px;font-size:20px;color:#fff;background:#fff;color:#667eea;border:none;border-radius:10px;cursor:pointer;position:relative;overflow:hidden;font-weight:bold;transition:all 0.3s;box-shadow:0 10px 30px rgba(0,0,0,0.2);}.ripple-btn:hover{transform:translateY(-3px);box-shadow:0 15px 40px rgba(0,0,0,0.3);}.ripple{position:absolute;border-radius:50%;background:rgba(102,126,234,0.5);transform:scale(0);animation:ripple-animation 0.6s;pointer-events:none;}@keyframes ripple-animation{to{transform:scale(4);opacity:0;}}</style></head><body><button class="ripple-btn" onclick="createRipple(event,this)">Click Me</button><button class="ripple-btn" onclick="createRipple(event,this)">Ripple Effect</button><script>function createRipple(e,btn){const ripple=document.createElement('span');ripple.classList.add('ripple');const rect=btn.getBoundingClientRect();const size=Math.max(rect.width,rect.height);ripple.style.width=ripple.style.height=size+'px';ripple.style.left=(e.clientX-rect.left-size/2)+'px';ripple.style.top=(e.clientY-rect.top-size/2)+'px';btn.appendChild(ripple);setTimeout(()=>ripple.remove(),600);}</script></body></html>
