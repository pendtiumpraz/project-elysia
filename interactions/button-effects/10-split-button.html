<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Split Button Effect</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial,sans-serif;gap:50px;}.split-btn{padding:20px 50px;font-size:20px;color:#fff;background:#fff;color:#667eea;border:none;border-radius:10px;cursor:pointer;font-weight:bold;position:relative;overflow:hidden;transition:color 0.3s;box-shadow:0 10px 30px rgba(0,0,0,0.2);}.split-btn::before{content:'';position:absolute;top:0;left:0;width:0;height:100%;background:#667eea;transition:all 0.4s;z-index:-1;}.split-btn:hover::before{width:100%;}.split-btn:hover{color:#fff;}.split-v::before{width:100%;height:0;}.split-v:hover::before{height:100%;}.split-center::before{left:50%;transform:translateX(-50%);}.split-center:hover::before{width:100%;left:0;transform:translateX(0);}.split-diagonal::before{transform:skewX(-20deg);left:-20%;width:0;}.split-diagonal:hover::before{width:140%;}</style></head><body><button class="split-btn">Slide Left</button><button class="split-btn split-v">Slide Down</button><button class="split-btn split-center">Center Out</button><button class="split-btn split-diagonal">Diagonal</button></body></html>
