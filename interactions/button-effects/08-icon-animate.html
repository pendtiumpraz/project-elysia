<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Animated Icon Buttons</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial,sans-serif;gap:30px;flex-wrap:wrap;}.icon-btn{padding:20px 40px;font-size:18px;color:#fff;background:#fff;color:#667eea;border:none;border-radius:50px;cursor:pointer;font-weight:bold;transition:all 0.3s;box-shadow:0 10px 30px rgba(0,0,0,0.2);display:flex;align-items:center;gap:10px;}.icon-btn:hover{transform:translateY(-5px);box-shadow:0 15px 40px rgba(0,0,0,0.3);}.icon{font-size:24px;transition:all 0.3s;}.icon-btn:hover .icon.rotate{transform:rotate(360deg);}.icon-btn:hover .icon.bounce{animation:bounce 0.5s;}@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}.icon-btn:hover .icon.scale{transform:scale(1.3);}.icon-btn:hover .icon.shake{animation:shake 0.5s;}@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}</style></head><body><button class="icon-btn"><span class="icon rotate">⚙️</span>Settings</button><button class="icon-btn"><span class="icon bounce">❤️</span>Like</button><button class="icon-btn"><span class="icon scale">🔍</span>Search</button><button class="icon-btn"><span class="icon shake">🔔</span>Notify</button></body></html>
