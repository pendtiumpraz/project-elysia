<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Border Animation Button</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;font-family:Arial,sans-serif;gap:50px;flex-wrap:wrap;}.border-btn{padding:20px 50px;font-size:20px;color:#fff;background:transparent;border:3px solid #00ffff;border-radius:10px;cursor:pointer;font-weight:bold;position:relative;transition:all 0.3s;overflow:hidden;}.border-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:rgba(0,255,255,0.2);transition:all 0.3s;}.border-btn:hover::before{left:100%;}.dash{border-style:dashed;animation:dash 20s linear infinite;}@keyframes dash{to{stroke-dashoffset:1000;}}.glow-border{box-shadow:0 0 20px #00ffff;animation:glow-pulse 2s ease-in-out infinite;}@keyframes glow-pulse{0%,100%{box-shadow:0 0 20px #00ffff;}50%{box-shadow:0 0 40px #00ffff,0 0 60px #00ffff;}}.rotate-border{border-image:linear-gradient(45deg,#00ffff,#ff00ff,#00ffff) 1;animation:rotate-gradient 3s linear infinite;}@keyframes rotate-gradient{to{filter:hue-rotate(360deg);}}</style></head><body><button class="border-btn">Slide Border</button><button class="border-btn dash">Dashed</button><button class="border-btn glow-border">Glow Pulse</button><button class="border-btn rotate-border">Rotating</button></body></html>
