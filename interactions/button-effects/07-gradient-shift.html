<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Gradient Shift Button</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial,sans-serif;gap:30px;flex-wrap:wrap;}.gradient-btn{padding:20px 50px;font-size:20px;color:#fff;background:linear-gradient(45deg,#667eea,#764ba2,#f093fb,#f5576c);background-size:300% 300%;border:none;border-radius:50px;cursor:pointer;font-weight:bold;animation:gradient 3s ease infinite;transition:all 0.3s;box-shadow:0 10px 40px rgba(0,0,0,0.3);}@keyframes gradient{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}.gradient-btn:hover{transform:scale(1.1);box-shadow:0 15px 50px rgba(102,126,234,0.5);animation-duration:1s;}.rainbow{background:linear-gradient(45deg,red,orange,yellow,green,cyan,blue,violet);background-size:400% 400%;animation:rainbow 2s linear infinite;}@keyframes rainbow{to{background-position:400% 0;}}</style></head><body><button class="gradient-btn">Shifting Gradient</button><button class="gradient-btn rainbow">Rainbow Flow</button></body></html>
