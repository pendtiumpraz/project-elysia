<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Particle Button</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;font-family:Arial,sans-serif;}canvas{position:fixed;top:0;left:0;pointer-events:none;}.particle-btn{padding:25px 60px;font-size:22px;color:#fff;background:linear-gradient(135deg,#f093fb,#f5576c);border:none;border-radius:50px;cursor:pointer;font-weight:bold;transition:all 0.3s;box-shadow:0 10px 40px rgba(245,87,108,0.5);position:relative;z-index:10;}.particle-btn:hover{transform:scale(1.05);box-shadow:0 15px 50px rgba(245,87,108,0.7);}</style></head><body><canvas id="canvas"></canvas><button class="particle-btn" onclick="explode(event)">Click for Particles!</button><script>const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');canvas.width=innerWidth;canvas.height=innerHeight;const particles=[];class Particle{constructor(x,y){this.x=x;this.y=y;const angle=Math.random()*Math.PI*2,speed=Math.random()*5+2;this.vx=Math.cos(angle)*speed;this.vy=Math.sin(angle)*speed;this.life=1;this.color=`hsl(${Math.random()*60+300},100%,50%)`;}update(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.2;this.life-=0.02;}draw(){ctx.beginPath();ctx.arc(this.x,this.y,5,0,Math.PI*2);ctx.fillStyle=this.color;ctx.globalAlpha=this.life;ctx.fill();ctx.globalAlpha=1;}}function explode(e){const rect=e.target.getBoundingClientRect(),x=rect.left+rect.width/2,y=rect.top+rect.height/2;for(let i=0;i<50;i++)particles.push(new Particle(x,y));}function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);for(let i=particles.length-1;i>=0;i--){particles[i].update();particles[i].draw();if(particles[i].life<=0)particles.splice(i,1);}requestAnimationFrame(animate);}animate();</script></body></html>
