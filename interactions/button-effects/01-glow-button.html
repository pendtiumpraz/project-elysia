<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Glow Button</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;font-family:Arial,sans-serif;gap:30px;flex-wrap:wrap;padding:50px;}.glow-btn{padding:20px 50px;font-size:20px;color:#fff;background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:50px;cursor:pointer;position:relative;overflow:hidden;transition:all 0.3s;box-shadow:0 0 20px rgba(102,126,234,0.5);}.glow-btn:hover{transform:translateY(-5px);box-shadow:0 0 60px rgba(102,126,234,1),0 0 100px rgba(102,126,234,0.8);}.glow-btn::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent,rgba(255,255,255,0.3),transparent);transform:rotate(45deg);transition:all 0.6s;}.glow-btn:hover::before{left:100%;}.neon{background:transparent;color:#00ffff;border:3px solid #00ffff;box-shadow:0 0 20px #00ffff,inset 0 0 20px #00ffff;}.neon:hover{color:#000;background:#00ffff;box-shadow:0 0 60px #00ffff,inset 0 0 60px #00ffff;}.pulse{animation:pulse 2s infinite;}@keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(102,126,234,0.5);}50%{box-shadow:0 0 60px rgba(102,126,234,1);}}</style></head><body><button class="glow-btn">Hover Me</button><button class="glow-btn neon">Neon Glow</button><button class="glow-btn pulse">Pulsing</button></body></html>
