<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Stack Cards</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);}.stack{position:relative;width:300px;height:400px;}.card{position:absolute;width:100%;height:100%;background:#fff;border-radius:20px;padding:30px;box-shadow:0 10px 40px rgba(0,0,0,0.2);transition:all 0.3s;cursor:pointer;}.card:nth-child(1){top:0;left:0;z-index:3;}.card:nth-child(2){top:10px;left:10px;z-index:2;opacity:0.8;}.card:nth-child(3){top:20px;left:20px;z-index:1;opacity:0.6;}.stack:hover .card:nth-child(1){transform:translateY(-20px) rotate(-5deg);}.stack:hover .card:nth-child(2){transform:translateY(-10px);}.stack:hover .card:nth-child(3){transform:translateY(0);}</style></head><body><div class="stack"><div class="card"><h2>Card 1</h2><p>Top card</p></div><div class="card"><h2>Card 2</h2><p>Middle card</p></div><div class="card"><h2>Card 3</h2><p>Bottom card</p></div></div></body></html>
