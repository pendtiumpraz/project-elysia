<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Slide Card</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;gap:30px;}.card{width:300px;height:400px;position:relative;overflow:hidden;border-radius:20px;cursor:pointer;box-shadow:0 10px 40px rgba(0,0,0,0.5);}.card-bg{width:100%;height:100%;background:linear-gradient(135deg,#667eea,#764ba2);transition:transform 0.5s;}.card:hover .card-bg{transform:scale(1.1);}.card-content{position:absolute;bottom:-100%;left:0;width:100%;background:rgba(0,0,0,0.8);color:#fff;padding:30px;transition:bottom 0.5s;}.card:hover .card-content{bottom:0;}</style></head><body><div class="card"><div class="card-bg"></div><div class="card-content"><h2>Slide Up</h2><p>Content appears from bottom</p></div></div><div class="card"><div class="card-bg" style="background:linear-gradient(135deg,#f093fb,#f5576c)"></div><div class="card-content"><h2>Slide Up</h2><p>Smooth transition effect</p></div></div></body></html>
