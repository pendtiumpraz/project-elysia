<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Parallax Card</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}.card{width:400px;height:500px;position:relative;overflow:hidden;border-radius:20px;}.layer{position:absolute;width:100%;height:100%;transition:transform 0.1s;}.bg{background:linear-gradient(135deg,#667eea,#764ba2);}.content{display:flex;align-items:center;justify-content:center;color:#fff;font-size:48px;font-weight:bold;}</style></head><body><div class="card" id="card"><div class="layer bg" id="bg"></div><div class="layer content">PARALLAX</div></div><script>const card=document.getElementById('card'),bg=document.getElementById('bg');card.addEventListener('mousemove',e=>{const rect=card.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width-0.5,y=(e.clientY-rect.top)/rect.height-0.5;bg.style.transform=`translate(${x*50}px,${y*50}px) scale(1.1)`;});card.addEventListener('mouseleave',()=>bg.style.transform='translate(0,0) scale(1)');</script></body></html>
