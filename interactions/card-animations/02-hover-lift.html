<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Hover Lift Card</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial;gap:30px;flex-wrap:wrap;}.card{width:300px;padding:30px;background:#16213e;border-radius:20px;transition:all 0.3s;cursor:pointer;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,0.3);}.card:hover{transform:translateY(-15px);box-shadow:0 25px 50px rgba(0,0,0,0.5);}.card h2{margin-bottom:15px;color:#00ffff;}.card p{color:#aaa;line-height:1.6;}</style></head><body><div class="card"><h2>Card 1</h2><p>Hover to see lift effect</p></div><div class="card"><h2>Card 2</h2><p>Smooth elevation animation</p></div><div class="card"><h2>Card 3</h2><p>Enhanced shadow on hover</p></div></body></html>
