<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Glow Border Card</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;gap:30px;}.card{width:300px;height:400px;background:#1a1a2e;border-radius:20px;padding:30px;position:relative;overflow:hidden;color:#fff;}.card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(transparent,#00ffff,transparent 30%);animation:rotate 4s linear infinite;}@keyframes rotate{to{transform:rotate(360deg);}}.card::after{content:'';position:absolute;inset:3px;background:#1a1a2e;border-radius:17px;}.card-content{position:relative;z-index:1;}</style></head><body><div class="card"><div class="card-content"><h2>Glow Border</h2><p>Rotating gradient border effect</p></div></div><div class="card"><div class="card-content"><h2>Neon Effect</h2><p>Continuous rotation animation</p></div></div></body></html>
