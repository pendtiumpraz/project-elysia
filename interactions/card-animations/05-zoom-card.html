<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Zoom Card</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:30px;flex-wrap:wrap;}.card{width:250px;height:300px;background:#fff;border-radius:15px;overflow:hidden;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,0.2);transition:transform 0.3s;}.card:hover{transform:scale(1.1);z-index:10;}.card img{width:100%;height:200px;object-fit:cover;transition:transform 0.3s;}.card:hover img{transform:scale(1.2);}.card-content{padding:20px;text-align:center;}</style></head><body><div class="card"><img src="https://via.placeholder.com/250x200/667eea/fff" alt="Card"><div class="card-content"><h3>Card Title</h3></div></div><div class="card"><img src="https://via.placeholder.com/250x200/764ba2/fff" alt="Card"><div class="card-content"><h3>Card Title</h3></div></div><div class="card"><img src="https://via.placeholder.com/250x200/f093fb/fff" alt="Card"><div class="card-content"><h3>Card Title</h3></div></div></body></html>
