<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Expand Card</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial;}.card{width:300px;height:200px;background:#fff;border-radius:20px;padding:30px;transition:all 0.5s;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,0.2);cursor:pointer;}.card:hover{height:400px;}.card h2{margin-bottom:15px;color:#667eea;}.card p{color:#666;line-height:1.6;opacity:0;transition:opacity 0.5s;}.card:hover p{opacity:1;}</style></head><body><div class="card"><h2>Expandable Card</h2><p>Hover to reveal more content. This text appears smoothly as the card expands to show additional information.</p></div></body></html>
