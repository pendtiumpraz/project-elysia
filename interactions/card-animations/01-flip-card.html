<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Flip Card</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial,sans-serif;}.card{width:300px;height:400px;perspective:1000px;}.card-inner{position:relative;width:100%;height:100%;transition:transform 0.8s;transform-style:preserve-3d;}.card:hover .card-inner{transform:rotateY(180deg);}.front,.back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;}.front{background:linear-gradient(135deg,#667eea,#764ba2);}.back{background:linear-gradient(135deg,#f093fb,#f5576c);transform:rotateY(180deg);}</style></head><body><div class="card"><div class="card-inner"><div class="front">Front Side</div><div class="back">Back Side</div></div></div></body></html>
