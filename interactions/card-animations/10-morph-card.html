<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Morph Card</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:30px;}.card{width:200px;height:200px;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.5s cubic-bezier(0.68,-0.55,0.265,1.55);box-shadow:0 10px 30px rgba(0,0,0,0.2);}.card:hover{width:350px;height:250px;border-radius:50px;background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff;transform:rotate(5deg);}</style></head><body><div class="card">Hover</div><div class="card">Me</div><div class="card">!</div></body></html>
