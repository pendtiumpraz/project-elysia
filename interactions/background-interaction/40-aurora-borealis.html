<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Borealis</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        
        body {
            font-family: 'Arial', sans-serif;
            background: #000814;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            filter: blur(20px);
        }
        
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 10;
        }
        
        h1 {
            font-size: 72px;
            text-shadow: 0 0 40px #00ff88;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="content">
        <h1>🌠 AURORA</h1>
    </div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        let time = 0;
        
        class AuroraWave {
            constructor(y, hue) {
                this.y = y;
                this.hue = hue;
                this.amplitude = Math.random() * 100 + 50;
                this.frequency = Math.random() * 0.01 + 0.005;
                this.speed = Math.random() * 0.02 + 0.01;
            }
            
            draw(time) {
                ctx.beginPath();
                for (let x = 0; x < canvas.width; x += 5) {
                    const y = this.y + Math.sin(x * this.frequency + time * this.speed) * this.amplitude;
                    if (x === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                
                ctx.lineTo(canvas.width, canvas.height);
                ctx.lineTo(0, canvas.height);
                ctx.closePath();
                
                const gradient = ctx.createLinearGradient(0, this.y - this.amplitude, 0, this.y + this.amplitude);
                gradient.addColorStop(0, `hsla(${this.hue}, 100%, 50%, 0.2)`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.fill();
            }
        }
        
        const waves = [
            new AuroraWave(100, 160),
            new AuroraWave(200, 180),
            new AuroraWave(150, 140),
            new AuroraWave(250, 200)
        ];
        
        function animate() {
            ctx.fillStyle = 'rgba(0, 8, 20, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            waves.forEach(wave => wave.draw(time));
            
            time += 1;
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
