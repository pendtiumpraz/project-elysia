<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Storm</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {background: #000; overflow: hidden; font-family: 'Courier New', monospace;}
        canvas {display: block; image-rendering: pixelated;}
        .content {position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #00ffff; z-index: 10;}
        h1 {font-size: 72px; text-shadow: 0 0 30px #00ffff;}
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="content"><h1>◼️ PIXELS</h1></div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const pixelSize = 8;
        function animate() {
            for (let i = 0; i < 50; i++) {
                const x = Math.floor(Math.random() * canvas.width / pixelSize) * pixelSize;
                const y = Math.floor(Math.random() * canvas.height / pixelSize) * pixelSize;
                ctx.fillStyle = `hsl(${Math.random() * 360}, 100%, 50%)`;
                ctx.fillRect(x, y, pixelSize, pixelSize);
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
