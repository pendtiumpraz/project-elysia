<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Pixel Art Generator</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;image-rendering:pixelated;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;z-index:10;}h1{font-size:72px;text-shadow:0 0 30px #ff00ff;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>🎨 PIXEL</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const s=15;function animate(){for(let i=0;i<10;i++){const x=Math.floor(Math.random()*c.width/s)*s,y=Math.floor(Math.random()*c.height/s)*s;ctx.fillStyle=`hsl(${Math.random()*360},80%,60%)`;ctx.fillRect(x,y,s,s);}requestAnimationFrame(animate);}animate();</script></body></html>
