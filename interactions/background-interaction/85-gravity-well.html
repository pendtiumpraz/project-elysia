<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Gravity Well</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#ffff00;z-index:10;}h1{font-size:72px;text-shadow:0 0 30px #ffff00;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>🕳️ GRAVITY</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cx=c.width/2,cy=c.height/2,ps=[];for(let i=0;i<150;i++)ps.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2});function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);ps.forEach(p=>{const dx=cx-p.x,dy=cy-p.y,d=Math.sqrt(dx*dx+dy*dy),f=500/(d*d);p.vx+=dx/d*f;p.vy+=dy/d*f;p.x+=p.vx;p.y+=p.vy;if(d<20){p.x=Math.random()*c.width;p.y=Math.random()*c.height;p.vx=0;p.vy=0;}ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fillStyle='#ffff00';ctx.fill();});requestAnimationFrame(animate);}animate();</script></body></html>
