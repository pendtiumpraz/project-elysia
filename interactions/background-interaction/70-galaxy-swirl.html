<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Galaxy Swirl</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;z-index:10;}h1{font-size:96px;text-shadow:0 0 40px #8B00FF;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>🌌 SWIRL</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cx=c.width/2,cy=c.height/2,stars=[];for(let i=0;i<300;i++)stars.push({angle:Math.random()*Math.PI*2,dist:Math.random()*300,speed:0.001+Math.random()*0.005,size:Math.random()*2+1});function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);stars.forEach(s=>{s.angle+=s.speed;const x=cx+Math.cos(s.angle)*s.dist,y=cy+Math.sin(s.angle)*s.dist;ctx.beginPath();ctx.arc(x,y,s.size,0,Math.PI*2);const g=ctx.createRadialGradient(x,y,0,x,y,s.size*2);g.addColorStop(0,'#8B00FF');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fill();});requestAnimationFrame(animate);}animate();</script></body></html>
