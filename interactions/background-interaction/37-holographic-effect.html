<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holographic Effect</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        
        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            overflow: hidden;
        }
        
        .hologram {
            position: fixed;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 255, 255, 0.05),
                    rgba(0, 255, 255, 0.05) 1px,
                    transparent 1px,
                    transparent 2px
                );
            animation: scan 5s linear infinite;
        }
        
        @keyframes scan {
            0% {background-position: 0 0;}
            100% {background-position: 0 100px;}
        }
        
        .glitch {
            position: fixed;
            width: 100%;
            height: 100%;
            background: transparent;
            animation: glitch 0.1s infinite;
        }
        
        @keyframes glitch {
            0%, 100% {opacity: 0;}
            50% {
                opacity: 1;
                background: rgba(0, 255, 255, 0.03);
            }
        }
        
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            color: #00ffff;
        }
        
        h1 {
            font-size: 96px;
            text-shadow: 
                0 0 20px #00ffff,
                0 0 40px #00ffff,
                0 0 60px #00ffff;
            animation: hologram-text 2s ease-in-out infinite;
        }
        
        @keyframes hologram-text {
            0%, 100% {
                opacity: 1;
                transform: translateY(0);
            }
            50% {
                opacity: 0.8;
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>
    <div class="hologram"></div>
    <div class="glitch"></div>
    
    <div class="content">
        <h1>⚡ HOLOGRAM</h1>
    </div>
</body>
</html>
