<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Star Burst</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;z-index:10;}h1{font-size:96px;text-shadow:0 0 40px #ffff00;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>⭐ BURST</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cx=c.width/2,cy=c.height/2;let t=0;function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);for(let i=0;i<12;i++){const a=i*Math.PI/6+t;ctx.beginPath();ctx.moveTo(cx,cy);const r1=50,r2=200;ctx.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);ctx.lineTo(cx+Math.cos(a+Math.PI/12)*r2,cy+Math.sin(a+Math.PI/12)*r2);ctx.lineTo(cx+Math.cos(a+Math.PI/6)*r1,cy+Math.sin(a+Math.PI/6)*r1);ctx.closePath();ctx.fillStyle=`hsl(${(t*50+i*30)%360},100%,50%)`;ctx.shadowBlur=20;ctx.shadowColor=ctx.fillStyle;ctx.fill();}t+=0.02;requestAnimationFrame(animate);}animate();</script></body></html>
