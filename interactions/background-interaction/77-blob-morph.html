<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Blob Morph</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;filter:blur(40px);}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;z-index:10;}h1{font-size:96px;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>💧 BLOB</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const blobs=[{x:c.width*0.3,y:c.height*0.5,vx:2,vy:1,r:150,hue:0},{x:c.width*0.7,y:c.height*0.5,vx:-1.5,vy:1.5,r:180,hue:180}];function animate(){ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);blobs.forEach(b=>{b.x+=b.vx;b.y+=b.vy;if(b.x<0||b.x>c.width)b.vx*=-1;if(b.y<0||b.y>c.height)b.vy*=-1;const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);g.addColorStop(0,`hsl(${b.hue},100%,50%)`);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);b.hue=(b.hue+1)%360;});requestAnimationFrame(animate);}animate();</script></body></html>
