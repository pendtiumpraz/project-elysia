<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Digital Wind</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#0ff;z-index:10;}h1{font-size:72px;text-shadow:0 0 30px #0ff;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>💨 WIND</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const lines=[];for(let i=0;i<50;i++)lines.push({x:-100,y:Math.random()*c.height,speed:Math.random()*5+2,length:Math.random()*100+50});function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);lines.forEach(l=>{l.x+=l.speed;if(l.x>c.width+100){l.x=-100;l.y=Math.random()*c.height;}ctx.beginPath();ctx.moveTo(l.x,l.y);ctx.lineTo(l.x+l.length,l.y);ctx.strokeStyle='#0ff';ctx.lineWidth=2;ctx.shadowBlur=10;ctx.shadowColor='#0ff';ctx.stroke();});requestAnimationFrame(animate);}animate();</script></body></html>
