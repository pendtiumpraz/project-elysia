<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Field</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {background: #000; overflow: hidden;}
        canvas {display: block;}
        .content {position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #00ffff; z-index: 10;}
        h1 {font-size: 96px; text-shadow: 0 0 40px #00ffff;}
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="content"><h1>⚡ FIELD</h1></div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const particles = [];
        for (let i = 0; i < 100; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                charge: Math.random() > 0.5 ? 1 : -1
            });
        }
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                let fx = 0, fy = 0;
                particles.forEach((other, j) => {
                    if (i !== j) {
                        const dx = other.x - p.x;
                        const dy = other.y - p.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist > 0 && dist < 100) {
                            const force = (p.charge * other.charge) / (dist * dist);
                            fx -= force * dx / dist;
                            fy -= force * dy / dist;
                        }
                    }
                });
                p.x += fx;
                p.y += fy;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = p.charge > 0 ? '#00ffff' : '#ff00ff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = ctx.fillStyle;
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
