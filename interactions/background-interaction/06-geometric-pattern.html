<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometric Pattern Background</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        
        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            background: #f093fb;
            overflow: hidden;
            position: relative;
        }
        
        .pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(30deg, #f5576c 12%, transparent 12.5%, transparent 87%, #f5576c 87.5%, #f5576c),
                linear-gradient(150deg, #f5576c 12%, transparent 12.5%, transparent 87%, #f5576c 87.5%, #f5576c),
                linear-gradient(30deg, #f5576c 12%, transparent 12.5%, transparent 87%, #f5576c 87.5%, #f5576c),
                linear-gradient(150deg, #f5576c 12%, transparent 12.5%, transparent 87%, #f5576c 87.5%, #f5576c);
            background-size: 80px 140px;
            background-position: 0 0, 0 0, 40px 70px, 40px 70px;
            opacity: 0.3;
            animation: pattern-move 20s linear infinite;
        }
        
        @keyframes pattern-move {
            from {background-position: 0 0, 0 0, 40px 70px, 40px 70px;}
            to {background-position: 80px 140px, 80px 140px, 120px 210px, 120px 210px;}
        }
        
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            color: white;
        }
        
        h1 {
            font-size: 72px;
            margin-bottom: 20px;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="pattern"></div>
    
    <div class="content">
        <div>
            <h1>◆ Geometric Pattern</h1>
            <p style="font-size: 24px;">Moving triangular design</p>
        </div>
    </div>
</body>
</html>
