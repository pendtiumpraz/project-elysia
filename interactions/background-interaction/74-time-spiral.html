<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Time Spiral</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#ffff00;z-index:10;}h1{font-size:96px;text-shadow:0 0 40px #ffff00;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>⏰ TIME</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cx=c.width/2,cy=c.height/2;let t=0;function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);ctx.beginPath();for(let i=0;i<500;i++){const a=(i+t)*Math.PI/180,r=i*0.5;ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}ctx.strokeStyle=`hsl(${(t*2)%360},100%,50%)`;ctx.lineWidth=2;ctx.shadowBlur=15;ctx.shadowColor=ctx.strokeStyle;ctx.stroke();t+=2;requestAnimationFrame(animate);}animate();</script></body></html>
