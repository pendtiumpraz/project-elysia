<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Wave Pool</title><style>*{margin:0;padding:0;}body{background:linear-gradient(180deg,#003366,#0066cc);overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;z-index:10;}h1{font-size:96px;text-shadow:0 0 40px #00ffff;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>🌊 POOL</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let t=0;function animate(){ctx.fillStyle='rgba(0,51,102,0.05)';ctx.fillRect(0,0,c.width,c.height);for(let y=0;y<c.height;y+=20){ctx.beginPath();for(let x=0;x<=c.width;x+=5){const wave=Math.sin(x*0.01+t)*20+Math.sin(x*0.02+t*0.5+y*0.1)*10;if(x===0)ctx.moveTo(x,y+wave);else ctx.lineTo(x,y+wave);}ctx.strokeStyle=`rgba(0,255,255,${0.3+Math.sin(y*0.05+t)*0.2})`;ctx.lineWidth=2;ctx.stroke();}t+=0.05;requestAnimationFrame(animate);}animate();</script></body></html>
