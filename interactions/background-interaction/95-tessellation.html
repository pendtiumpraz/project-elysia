<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Tessellation</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;z-index:10;mix-blend-mode:difference;}h1{font-size:96px;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>🔷 TILES</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const s=60;let t=0;function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);for(let y=-s;y<c.height+s;y+=s){for(let x=-s;x<c.width+s;x+=s*1.5){const offset=(y/s%2)*s*0.75;ctx.save();ctx.translate(x+offset,y);ctx.rotate(t*0.01);ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.lineTo(Math.cos(a)*s/2,Math.sin(a)*s/2);}ctx.closePath();ctx.strokeStyle=`hsl(${(x+y+t)%360},70%,50%)`;ctx.lineWidth=2;ctx.stroke();ctx.restore();}}t+=1;requestAnimationFrame(animate);}animate();</script></body></html>
