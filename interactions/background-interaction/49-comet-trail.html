<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comet Trail</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {background: #000; overflow: hidden; font-family: 'Arial', sans-serif;}
        canvas {display: block;}
        .content {position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; z-index: 10;}
        h1 {font-size: 72px; text-shadow: 0 0 30px #ffff00;}
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="content"><h1>☄️ COMET</h1></div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        class Comet {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -50;
                this.vx = (Math.random() - 0.5) * 5;
                this.vy = Math.random() * 5 + 5;
                this.trail = [];
                this.hue = Math.random() * 60;
            }
            update() {
                this.trail.unshift({x: this.x, y: this.y});
                if (this.trail.length > 30) this.trail.pop();
                this.x += this.vx;
                this.y += this.vy;
                if (this.y > canvas.height + 50) this.reset();
            }
            draw() {
                this.trail.forEach((pos, i) => {
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, 3 * (1 - i / 30), 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.hue + 40}, 100%, 50%, ${1 - i / 30})`;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = ctx.fillStyle;
                    ctx.fill();
                });
            }
        }
        const comets = [];
        for (let i = 0; i < 5; i++) comets.push(new Comet());
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            comets.forEach(comet => {
                comet.update();
                comet.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
