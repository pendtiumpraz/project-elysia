<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starfield Warp Background</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        
        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            overflow: hidden;
        }
        
        canvas {
            display: block;
        }
        
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 10;
        }
        
        h1 {
            font-size: 72px;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.8);
        }
        
        p {
            font-size: 24px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="content">
        <h1>🚀 Starfield Warp</h1>
        <p>Hyperspace travel effect</p>
    </div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        
        class Star {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = (Math.random() - 0.5) * canvas.width;
                this.y = (Math.random() - 0.5) * canvas.height;
                this.z = Math.random() * canvas.width;
                this.speed = 10;
            }
            
            update() {
                this.z -= this.speed;
                if (this.z <= 0) {
                    this.reset();
                }
            }
            
            draw() {
                const sx = (this.x / this.z) * canvas.width + centerX;
                const sy = (this.y / this.z) * canvas.height + centerY;
                const size = (1 - this.z / canvas.width) * 3;
                
                const px = (this.x / (this.z + this.speed)) * canvas.width + centerX;
                const py = (this.y / (this.z + this.speed)) * canvas.height + centerY;
                
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(sx, sy);
                ctx.strokeStyle = `rgba(255, 255, 255, ${1 - this.z / canvas.width})`;
                ctx.lineWidth = size;
                ctx.stroke();
            }
        }
        
        const stars = [];
        for (let i = 0; i < 500; i++) {
            stars.push(new Star());
        }
        
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
