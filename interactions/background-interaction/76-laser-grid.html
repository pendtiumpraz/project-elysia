<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Laser Grid</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#f00;z-index:10;}h1{font-size:96px;text-shadow:0 0 40px #f00;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>🔴 LASER</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let t=0;function animate(){ctx.fillStyle='rgba(0,0,0,0.1)';ctx.fillRect(0,0,c.width,c.height);for(let x=0;x<c.width;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.strokeStyle=`rgba(255,0,0,${0.5+Math.sin(t+x*0.01)*0.5})`;ctx.lineWidth=2;ctx.shadowBlur=15;ctx.shadowColor='#f00';ctx.stroke();}for(let y=0;y<c.height;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.strokeStyle=`rgba(255,0,0,${0.5+Math.cos(t+y*0.01)*0.5})`;ctx.lineWidth=2;ctx.shadowBlur=15;ctx.shadowColor='#f00';ctx.stroke();}t+=0.05;requestAnimationFrame(animate);}animate();</script></body></html>
