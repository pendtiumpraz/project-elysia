<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Infinity Symbol</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;z-index:10;}h1{font-size:96px;text-shadow:0 0 40px #ff00ff;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>∞ INFINITY</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cx=c.width/2,cy=c.height/2;let t=0;function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);ctx.beginPath();for(let a=0;a<Math.PI*2;a+=0.1){const s=200/(1.5+Math.cos(a)),x=cx+s*Math.cos(a),y=cy+s*Math.sin(a)*Math.cos(a);if(a===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.strokeStyle=`hsl(${t*2%360},100%,50%)`;ctx.lineWidth=5;ctx.shadowBlur=20;ctx.shadowColor=ctx.strokeStyle;ctx.stroke();for(let i=0;i<10;i++){const a=(t*0.05+i*Math.PI*2/10)%(Math.PI*2),s=200/(1.5+Math.cos(a)),x=cx+s*Math.cos(a),y=cy+s*Math.sin(a)*Math.cos(a);ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle=`hsl(${(t*2+i*36)%360},100%,50%)`;ctx.fill();}t+=1;requestAnimationFrame(animate);}animate();</script></body></html>
