<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Atomic Structure</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#0ff;z-index:10;}h1{font-size:72px;text-shadow:0 0 30px #0ff;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>⚛️ ATOM</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cx=c.width/2,cy=c.height/2;let a=0;function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);ctx.beginPath();ctx.arc(cx,cy,10,0,Math.PI*2);ctx.fillStyle='#fff';ctx.shadowBlur=20;ctx.shadowColor='#fff';ctx.fill();for(let i=0;i<3;i++){const r=100,angle=a+i*Math.PI*2/3;ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);ctx.beginPath();ctx.ellipse(0,0,r,r/3,0,0,Math.PI*2);ctx.strokeStyle=`hsl(${(i*120)%360},100%,50%)`;ctx.stroke();ctx.restore();const ex=cx+Math.cos(a*2)*r,ey=cy+Math.sin(a*2)*r/3;ctx.beginPath();ctx.arc(ex,ey,5,0,Math.PI*2);ctx.fillStyle=`hsl(${(i*120)%360},100%,50%)`;ctx.fill();}a+=0.02;requestAnimationFrame(animate);}animate();</script></body></html>
