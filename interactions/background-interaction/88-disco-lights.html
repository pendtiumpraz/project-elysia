<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Disco Lights</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;z-index:10;}h1{font-size:96px;text-shadow:0 0 40px #fff;animation:disco 0.5s infinite;}@keyframes disco{0%,100%{color:#f00;}25%{color:#0f0;}50%{color:#00f;}75%{color:#ff0;}}</style></head><body><canvas id="c"></canvas><div class="content"><h1>🪩 DISCO</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const lights=[];for(let i=0;i<20;i++)lights.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*100+50,hue:Math.random()*360});function animate(){ctx.fillStyle='rgba(0,0,0,0.1)';ctx.fillRect(0,0,c.width,c.height);lights.forEach(l=>{l.hue=(l.hue+2)%360;const g=ctx.createRadialGradient(l.x,l.y,0,l.x,l.y,l.r);g.addColorStop(0,`hsl(${l.hue},100%,50%)`);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);});requestAnimationFrame(animate);}animate();</script></body></html>
