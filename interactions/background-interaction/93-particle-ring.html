<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Particle Ring</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#0ff;z-index:10;}h1{font-size:96px;text-shadow:0 0 40px #0ff;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>💍 RING</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cx=c.width/2,cy=c.height/2,ps=[];for(let i=0;i<100;i++)ps.push({angle:i*Math.PI*2/100,offset:Math.random()*50});let t=0;function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);ps.forEach((p,i)=>{p.angle+=0.02;const r=200+Math.sin(t+p.offset)*30,x=cx+Math.cos(p.angle)*r,y=cy+Math.sin(p.angle)*r;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle=`hsl(${(i*3.6+t*10)%360},100%,50%)`;ctx.shadowBlur=15;ctx.shadowColor=ctx.fillStyle;ctx.fill();});t+=0.05;requestAnimationFrame(animate);}animate();</script></body></html>
