<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Cyber Rain</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;font-family:monospace;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#0f0;z-index:10;}h1{font-size:96px;text-shadow:0 0 40px #0f0;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>⚡ CYBER</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const drops=[];for(let i=0;i<50;i++)drops.push({x:Math.random()*c.width,y:Math.random()*-c.height,speed:Math.random()*5+5,chars:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',text:''});function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#0f0';ctx.font='20px monospace';drops.forEach(d=>{d.y+=d.speed;d.text=d.chars[Math.floor(Math.random()*d.chars.length)];ctx.fillText(d.text,d.x,d.y);if(d.y>c.height+50){d.y=-50;d.x=Math.random()*c.width;}});requestAnimationFrame(animate);}animate();</script></body></html>
