<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Supernova</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;z-index:10;}h1{font-size:96px;text-shadow:0 0 40px #fff;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>🌟 SUPERNOVA</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cx=c.width/2,cy=c.height/2;let r=0,particles=[];function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);if(r<400){r+=5;for(let i=0;i<10;i++){const a=Math.random()*Math.PI*2;particles.push({x:cx,y:cy,vx:Math.cos(a)*Math.random()*10,vy:Math.sin(a)*Math.random()*10,life:1,hue:Math.random()*60});}}else{r=0;particles=[];}ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,'rgba(255,255,255,0.8)');g.addColorStop(0.5,'rgba(255,200,0,0.5)');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fill();for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life-=0.01;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fillStyle=`hsla(${p.hue+40},100%,50%,${p.life})`;ctx.fill();if(p.life<=0)particles.splice(i,1);}requestAnimationFrame(animate);}animate();</script></body></html>
