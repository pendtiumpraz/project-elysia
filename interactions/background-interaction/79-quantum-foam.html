<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Quantum Foam</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#0ff;z-index:10;}h1{font-size:72px;text-shadow:0 0 30px #0ff;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>⚛️ FOAM</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const ps=[];for(let i=0;i<100;i++)ps.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,life:Math.random()});function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx+Math.random()*2-1;p.y+=p.vy+Math.random()*2-1;p.life=(p.life+0.01)%1;if(p.x<0||p.x>c.width||p.y<0||p.y>c.height){p.x=Math.random()*c.width;p.y=Math.random()*c.height;}ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fillStyle=`hsla(${p.life*360},100%,50%,0.5)`;ctx.shadowBlur=15;ctx.shadowColor=ctx.fillStyle;ctx.fill();});requestAnimationFrame(animate);}animate();</script></body></html>
