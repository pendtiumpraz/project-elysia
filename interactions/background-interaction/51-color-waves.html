<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Waves</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {background: #000; overflow: hidden;}
        canvas {display: block;}
        .content {position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; z-index: 10; mix-blend-mode: difference;}
        h1 {font-size: 96px; font-weight: bold;}
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="content"><h1>🌊 WAVES</h1></div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let time = 0;
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 8; i++) {
                ctx.beginPath();
                for (let x = 0; x <= canvas.width; x += 5) {
                    const y = canvas.height / 2 + Math.sin(x * 0.01 + time + i * 0.5) * 80 + Math.sin(x * 0.005 + time * 0.5) * 40;
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.strokeStyle = `hsl(${(time * 20 + i * 45) % 360}, 100%, 50%)`;
                ctx.lineWidth = 3;
                ctx.shadowBlur = 15;
                ctx.shadowColor = ctx.strokeStyle;
                ctx.stroke();
            }
            time += 0.03;
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
