<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Flowing Liquid</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;filter:blur(30px);}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;z-index:10;}h1{font-size:96px;text-shadow:0 0 40px #00ffff;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>💧 LIQUID</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const bs=[];for(let i=0;i<5;i++)bs.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,r:Math.random()*100+80,hue:Math.random()*360});function animate(){ctx.fillStyle='rgba(0,0,0,0.02)';ctx.fillRect(0,0,c.width,c.height);bs.forEach(b=>{b.x+=b.vx;b.y+=b.vy;if(b.x<0||b.x>c.width)b.vx*=-1;if(b.y<0||b.y>c.height)b.vy*=-1;const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);g.addColorStop(0,`hsl(${b.hue},100%,50%)`);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);});requestAnimationFrame(animate);}animate();</script></body></html>
