<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Sine Waves</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;z-index:10;}h1{font-size:96px;text-shadow:0 0 40px #00ff88;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>〰️ SINE</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let t=0;function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);for(let i=0;i<10;i++){ctx.beginPath();for(let x=0;x<=c.width;x+=5){const y=c.height/2+Math.sin(x*0.01+t+i*0.5)*50+Math.sin(x*0.02+t)*30;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.strokeStyle=`hsl(${(t*10+i*36)%360},100%,50%)`;ctx.lineWidth=2;ctx.stroke();}t+=0.05;requestAnimationFrame(animate);}animate();</script></body></html>
