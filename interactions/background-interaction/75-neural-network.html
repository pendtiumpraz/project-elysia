<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Neural Network</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#ff00ff;z-index:10;}h1{font-size:72px;text-shadow:0 0 30px #ff00ff;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>🧠 NEURAL</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const nodes=[];for(let i=0;i<60;i++)nodes.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-0.5),vy:(Math.random()-0.5),active:Math.random()});function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);nodes.forEach(n=>{n.x+=n.vx;n.y+=n.vy;n.active+==(Math.random()-0.5)*0.1;n.active=Math.max(0,Math.min(1,n.active));if(n.x<0||n.x>c.width)n.vx*=-1;if(n.y<0||n.y>c.height)n.vy*=-1;ctx.beginPath();ctx.arc(n.x,n.y,3,0,Math.PI*2);ctx.fillStyle=`rgba(255,0,255,${n.active})`;ctx.fill();});for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<100){ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.strokeStyle=`rgba(255,0,255,${(1-d/100)*0.5})`;ctx.stroke();}}requestAnimationFrame(animate);}animate();</script></body></html>
