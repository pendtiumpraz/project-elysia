<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Sound Waves</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#0f0;z-index:10;}h1{font-size:96px;text-shadow:0 0 40px #0f0;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>🔊 SOUND</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cx=c.width/2;let t=0;function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);for(let i=0;i<50;i++){const r=i*15,a=(t+i*0.2)%1;ctx.beginPath();ctx.arc(cx,c.height/2,r,0,Math.PI*2);ctx.strokeStyle=`rgba(0,255,0,${1-a})`;ctx.lineWidth=3;ctx.stroke();}t+=0.02;requestAnimationFrame(animate);}animate();</script></body></html>
