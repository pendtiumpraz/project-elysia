<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Neon Tunnel</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#ff00ff;z-index:10;}h1{font-size:96px;text-shadow:0 0 40px #ff00ff;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>🚇 TUNNEL</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cx=c.width/2,cy=c.height/2;let t=0;function animate(){ctx.fillStyle='rgba(0,0,0,0.1)';ctx.fillRect(0,0,c.width,c.height);for(let i=0;i<20;i++){const r=(i*50+(t*5))%1000,a=1-r/1000;ctx.beginPath();ctx.rect(cx-r/2,cy-r/2,r,r);ctx.strokeStyle=`hsla(${(t+i*18)%360},100%,50%,${a})`;ctx.lineWidth=5;ctx.shadowBlur=20;ctx.shadowColor=ctx.strokeStyle;ctx.stroke();}t+=2;requestAnimationFrame(animate);}animate();</script></body></html>
