<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Animation Background</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        
        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            background: #000;
            overflow: hidden;
        }
        
        .grid-container {
            position: fixed;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            grid-template-rows: repeat(20, 1fr);
            gap: 2px;
        }
        
        .grid-cell {
            background: rgba(102, 126, 234, 0.1);
            transition: all 0.5s;
        }
        
        .grid-cell:hover {
            background: rgba(102, 126, 234, 0.8);
            box-shadow: 0 0 20px #667eea;
        }
        
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            color: white;
        }
        
        h1 {
            font-size: 72px;
            text-shadow: 0 0 30px #667eea;
        }
    </style>
</head>
<body>
    <div class="grid-container" id="grid"></div>
    
    <div class="content">
        <h1>⬜ GRID</h1>
    </div>
    
    <script>
        const grid = document.getElementById('grid');
        
        for (let i = 0; i < 400; i++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            grid.appendChild(cell);
            
            setTimeout(() => {
                cell.style.background = `rgba(102, 126, 234, ${Math.random() * 0.3})`;
            }, i * 10);
        }
    </script>
</body>
</html>
