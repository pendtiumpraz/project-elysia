<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Pulse</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {background: #000; overflow: hidden; font-family: 'Arial', sans-serif;}
        canvas {display: block;}
        .content {position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #ff00ff; z-index: 10;}
        h1 {font-size: 96px; animation: pulse 2s ease-in-out infinite;}
        @keyframes pulse {
            0%, 100% {text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff;}
            50% {text-shadow: 0 0 60px #ff00ff, 0 0 100px #ff00ff;}
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="content"><h1>⚡ PULSE</h1></div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const circles = [];
        setInterval(() => {
            circles.push({x: Math.random() * canvas.width, y: Math.random() * canvas.height, radius: 0, maxRadius: Math.random() * 100 + 50});
        }, 500);
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = circles.length - 1; i >= 0; i--) {
                const c = circles[i];
                c.radius += 2;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `hsla(300, 100%, 50%, ${1 - c.radius / c.maxRadius})`;
                ctx.lineWidth = 3;
                ctx.stroke();
                if (c.radius > c.maxRadius) circles.splice(i, 1);
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
