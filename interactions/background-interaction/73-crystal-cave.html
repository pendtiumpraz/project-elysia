<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Crystal Cave</title><style>*{margin:0;padding:0;}body{background:linear-gradient(180deg,#0a0a2e,#1a1a3e);overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#0ff;z-index:10;}h1{font-size:72px;text-shadow:0 0 30px #0ff;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>💎 CAVE</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cr=[];for(let i=0;i<30;i++)cr.push({x:Math.random()*c.width,y:Math.random()*c.height,h:Math.random()*60+40,w:Math.random()*20+10,hue:Math.random()*60+180,pulse:Math.random()*0.05+0.02});function animate(){ctx.fillStyle='rgba(10,10,46,0.05)';ctx.fillRect(0,0,c.width,c.height);cr.forEach(c=>{c.pulse=Math.sin(Date.now()*0.001)*0.03+0.02;ctx.save();ctx.translate(c.x,c.y);ctx.rotate(Math.PI/6);ctx.fillStyle=`hsl(${c.hue},100%,50%)`;ctx.shadowBlur=20;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.moveTo(0,-c.h);ctx.lineTo(c.w/2,0);ctx.lineTo(-c.w/2,0);ctx.closePath();ctx.fill();ctx.restore();});requestAnimationFrame(animate);}animate();</script></body></html>
