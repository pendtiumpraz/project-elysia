<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Magic Sparkles</title><style>*{margin:0;padding:0;}body{background:linear-gradient(135deg,#1a1a2e,#2a0a4a);overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;z-index:10;}h1{font-size:72px;text-shadow:0 0 30px #ff69b4;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>✨ MAGIC</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const sp=[];setInterval(()=>sp.push({x:Math.random()*c.width,y:Math.random()*c.height,size:Math.random()*3+1,life:1,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2}),50);function animate(){ctx.fillStyle='rgba(26,26,46,0.05)';ctx.fillRect(0,0,c.width,c.height);for(let i=sp.length-1;i>=0;i--){const s=sp[i];s.x+=s.vx;s.y+=s.vy;s.life-=0.01;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.life*Math.PI*4);ctx.fillStyle=`hsla(${s.life*360},100%,70%,${s.life})`;ctx.fillRect(-s.size,0,s.size*2,1);ctx.fillRect(0,-s.size,1,s.size*2);ctx.restore();if(s.life<=0)sp.splice(i,1);}requestAnimationFrame(animate);}animate();</script></body></html>
