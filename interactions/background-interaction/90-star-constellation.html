<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Star Constellation</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;z-index:10;}h1{font-size:72px;text-shadow:0 0 30px #fff;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>⭐ CONSTELLATION</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const stars=[];for(let i=0;i<30;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,brightness:Math.random()});function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);stars.forEach((s,i)=>{s.brightness+==(Math.random()-0.5)*0.05;s.brightness=Math.max(0.3,Math.min(1,s.brightness));ctx.beginPath();ctx.arc(s.x,s.y,3,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${s.brightness})`;ctx.shadowBlur=10;ctx.shadowColor='#fff';ctx.fill();for(let j=i+1;j<stars.length;j++){const dx=stars[i].x-stars[j].x,dy=stars[i].y-stars[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<200){ctx.beginPath();ctx.moveTo(stars[i].x,stars[i].y);ctx.lineTo(stars[j].x,stars[j].y);ctx.strokeStyle=`rgba(255,255,255,${(1-d/200)*0.3})`;ctx.stroke();}}});requestAnimationFrame(animate);}animate();</script></body></html>
