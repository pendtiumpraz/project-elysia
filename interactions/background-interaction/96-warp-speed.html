<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Warp Speed</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;z-index:10;}h1{font-size:96px;text-shadow:0 0 40px #fff;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>🚀 WARP</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cx=c.width/2,cy=c.height/2,stars=[];for(let i=0;i<100;i++)stars.push({x:(Math.random()-0.5)*c.width,y:(Math.random()-0.5)*c.height,z:Math.random()*c.width});function animate(){ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fillRect(0,0,c.width,c.height);stars.forEach(s=>{s.z-=30;if(s.z<=0){s.x=(Math.random()-0.5)*c.width;s.y=(Math.random()-0.5)*c.height;s.z=c.width;}const sx=(s.x/s.z)*c.width+cx,sy=(s.y/s.z)*c.height+cy,px=(s.x/(s.z+30))*c.width+cx,py=(s.y/(s.z+30))*c.height+cy;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(sx,sy);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();});requestAnimationFrame(animate);}animate();</script></body></html>
