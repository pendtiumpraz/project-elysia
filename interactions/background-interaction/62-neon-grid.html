<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Neon Grid</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#0ff;z-index:10;}h1{font-size:96px;text-shadow:0 0 40px #0ff;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>⚡ GRID</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let t=0;function animate(){ctx.fillStyle='rgba(0,0,0,0.1)';ctx.fillRect(0,0,c.width,c.height);for(let x=0;x<c.width;x+=50){for(let y=0;y<c.height;y+=50){const h=(x+y+t)%360;ctx.strokeStyle=`hsl(${h},100%,50%)`;ctx.strokeRect(x,y,50,50);}}t+=5;requestAnimationFrame(animate);}animate();</script></body></html>
