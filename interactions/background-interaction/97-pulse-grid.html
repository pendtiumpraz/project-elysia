<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Pulse Grid</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#0ff;z-index:10;}h1{font-size:96px;text-shadow:0 0 40px #0ff;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>▦ PULSE</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const s=50;let t=0;function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);for(let y=0;y<c.height;y+=s){for(let x=0;x<c.width;x+=s){const d=Math.sqrt(Math.pow(x-c.width/2,2)+Math.pow(y-c.height/2,2)),pulse=Math.sin(d*0.02-t*0.1);ctx.fillStyle=`hsla(${(d+t*10)%360},100%,50%,${(pulse+1)*0.5})`;ctx.fillRect(x,y,s-2,s-2);}}t+=1;requestAnimationFrame(animate);}animate();</script></body></html>
