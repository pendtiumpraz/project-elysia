<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Electric Arc</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#0ff;z-index:10;}h1{font-size:96px;text-shadow:0 0 40px #0ff;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>⚡ ARC</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;function drawArc(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);let cx=x1,cy=y1;while(Math.abs(cx-x2)>10||Math.abs(cy-y2)>10){cx+=(x2-cx)*0.1+(Math.random()-0.5)*50;cy+=(y2-cy)*0.1+(Math.random()-0.5)*50;ctx.lineTo(cx,cy);}ctx.lineTo(x2,y2);ctx.strokeStyle='#0ff';ctx.lineWidth=2;ctx.shadowBlur=15;ctx.shadowColor='#0ff';ctx.stroke();}function animate(){ctx.fillStyle='rgba(0,0,0,0.1)';ctx.fillRect(0,0,c.width,c.height);if(Math.random()>0.7){const x1=Math.random()*c.width,y1=Math.random()*c.height,x2=Math.random()*c.width,y2=Math.random()*c.height;drawArc(x1,y1,x2,y2);}requestAnimationFrame(animate);}animate();</script></body></html>
