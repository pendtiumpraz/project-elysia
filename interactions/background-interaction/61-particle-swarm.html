<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Particle Swarm</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#ff00ff;z-index:10;}h1{font-size:72px;text-shadow:0 0 30px #ff00ff;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>🐝 SWARM</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const ps=[];for(let i=0;i<200;i++)ps.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:0,vy:0});function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);const cx=c.width/2,cy=c.height/2;ps.forEach(p=>{const dx=cx-p.x,dy=cy-p.y,dist=Math.sqrt(dx*dx+dy*dy);p.vx+=(dx/dist)*0.1;p.vy+=(dy/dist)*0.1;p.vx*=0.95;p.vy*=0.95;p.x+=p.vx;p.y+=p.vy;ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fillStyle='#ff00ff';ctx.fill();});requestAnimationFrame(animate);}animate();</script></body></html>
