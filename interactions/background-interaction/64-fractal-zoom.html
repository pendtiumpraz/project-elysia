<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Fractal Zoom</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;z-index:10;mix-blend-mode:difference;}h1{font-size:96px;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>🔷 FRACTAL</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let z=1;function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);const cx=c.width/2,cy=c.height/2;for(let i=0;i<6;i++){const r=100*z*(i+1);ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle=`hsl(${(i*60+z*50)%360},100%,50%)`;ctx.lineWidth=3;ctx.stroke();}z+=0.05;if(z>10)z=1;requestAnimationFrame(animate);}animate();</script></body></html>
