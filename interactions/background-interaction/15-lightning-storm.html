<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightning Storm</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        
        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            background: #1a1a2e;
            overflow: hidden;
        }
        
        .lightning {
            position: fixed;
            width: 5px;
            height: 100vh;
            background: linear-gradient(180deg, #fff, #ffff00, transparent);
            box-shadow: 0 0 20px #ffff00;
            opacity: 0;
            animation: lightning-strike 0.2s ease-out;
        }
        
        @keyframes lightning-strike {
            0%, 100% {opacity: 0;}
            50% {opacity: 1;}
        }
        
        .flash {
            position: fixed;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            animation: flash 0.2s ease-out;
        }
        
        @keyframes flash {
            0%, 100% {opacity: 0;}
            50% {opacity: 0.8;}
        }
        
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            color: white;
        }
        
        h1 {
            font-size: 72px;
            text-shadow: 0 0 20px #ffff00;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>⚡ STORM</h1>
    </div>
    
    <script>
        function createLightning() {
            const lightning = document.createElement('div');
            lightning.className = 'lightning';
            lightning.style.left = Math.random() * 100 + '%';
            lightning.style.transform = `rotate(${Math.random() * 20 - 10}deg)`;
            document.body.appendChild(lightning);
            
            const flash = document.createElement('div');
            flash.className = 'flash';
            document.body.appendChild(flash);
            
            setTimeout(() => {
                lightning.remove();
                flash.remove();
            }, 200);
        }
        
        setInterval(() => {
            if (Math.random() > 0.7) {
                createLightning();
            }
        }, 1000);
    </script>
</body>
</html>
