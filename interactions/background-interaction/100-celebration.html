<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>🎉 100 BACKGROUNDS!</title><style>*{margin:0;padding:0;}body{background:linear-gradient(135deg,#667eea,#764ba2);overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;z-index:10;}h1{font-size:120px;margin-bottom:20px;text-shadow:0 0 50px #fff;animation:glow 2s ease-in-out infinite;}p{font-size:48px;}@keyframes glow{0%,100%{text-shadow:0 0 50px #fff,0 0 100px #fff;}50%{text-shadow:0 0 80px #fff,0 0 150px #fff;}}</style></head><body><canvas id="c"></canvas><div class="content"><h1>🎉 100 🎉</h1><p>BACKGROUND INTERACTIONS!</p></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const fireworks=[];function createFirework(){const x=Math.random()*c.width,y=Math.random()*c.height/2,ps=[];for(let i=0;i<50;i++){const a=Math.random()*Math.PI*2,s=Math.random()*5+2;ps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,hue:Math.random()*360});}fireworks.push(ps);}setInterval(createFirework,500);function animate(){ctx.fillStyle='rgba(102,126,234,0.05)';ctx.fillRect(0,0,c.width,c.height);for(let i=fireworks.length-1;i>=0;i--){const fw=fireworks[i];let allDead=true;fw.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life-=0.01;if(p.life>0){allDead=false;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fillStyle=`hsla(${p.hue},100%,50%,${p.life})`;ctx.shadowBlur=15;ctx.shadowColor=ctx.fillStyle;ctx.fill();}});if(allDead)fireworks.splice(i,1);}requestAnimationFrame(animate);}animate();</script></body></html>
