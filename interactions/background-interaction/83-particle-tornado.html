<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Particle Tornado</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#0ff;z-index:10;}h1{font-size:96px;text-shadow:0 0 40px #0ff;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>🌪️ TORNADO</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const ps=[];for(let i=0;i<200;i++)ps.push({y:Math.random()*c.height,angle:Math.random()*Math.PI*2,radius:Math.random()*200,speed:Math.random()*0.05+0.02});function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);ps.forEach(p=>{p.angle+=p.speed;p.y-=2;if(p.y<-50){p.y=c.height+50;p.angle=Math.random()*Math.PI*2;}const x=c.width/2+Math.cos(p.angle)*p.radius,y=p.y;ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fillStyle=`hsl(${(p.angle*180/Math.PI)%360},100%,50%)`;ctx.fill();});requestAnimationFrame(animate);}animate();</script></body></html>
