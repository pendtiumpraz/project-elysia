<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Meteor Shower</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;z-index:10;}h1{font-size:72px;text-shadow:0 0 30px #ff6600;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>☄️ METEORS</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const ms=[];setInterval(()=>ms.push({x:Math.random()*c.width,y:-50,vx:Math.random()*3-1.5,vy:Math.random()*5+5,trail:[]}),300);function animate(){ctx.fillStyle='rgba(0,0,0,0.1)';ctx.fillRect(0,0,c.width,c.height);for(let i=ms.length-1;i>=0;i--){const m=ms[i];m.trail.unshift({x:m.x,y:m.y});if(m.trail.length>15)m.trail.pop();m.x+=m.vx;m.y+=m.vy;m.trail.forEach((t,j)=>{ctx.beginPath();ctx.arc(t.x,t.y,3*(1-j/15),0,Math.PI*2);ctx.fillStyle=`rgba(255,102,0,${1-j/15})`;ctx.fill();});if(m.y>c.height)ms.splice(i,1);}requestAnimationFrame(animate);}animate();</script></body></html>
