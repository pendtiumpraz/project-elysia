<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laser Show</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {background: #000; overflow: hidden; font-family: 'Arial', sans-serif;}
        canvas {display: block;}
        .content {position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #ff00ff; z-index: 10;}
        h1 {font-size: 96px; text-shadow: 0 0 40px #ff00ff;}
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="content"><h1>✨ LASER</h1></div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const lasers = [];
        class Laser {
            constructor() {
                this.x1 = Math.random() * canvas.width;
                this.y1 = Math.random() * canvas.height;
                this.angle = Math.random() * Math.PI * 2;
                this.length = Math.random() * 300 + 200;
                this.hue = Math.random() * 360;
                this.speed = Math.random() * 0.02 + 0.01;
            }
            update() {
                this.angle += this.speed;
            }
            draw() {
                const x2 = this.x1 + Math.cos(this.angle) * this.length;
                const y2 = this.y1 + Math.sin(this.angle) * this.length;
                ctx.beginPath();
                ctx.moveTo(this.x1, this.y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = `hsl(${this.hue}, 100%, 50%)`;
                ctx.lineWidth = 3;
                ctx.shadowBlur = 20;
                ctx.shadowColor = `hsl(${this.hue}, 100%, 50%)`;
                ctx.stroke();
            }
        }
        for (let i = 0; i < 15; i++) lasers.push(new Laser());
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            lasers.forEach(laser => {
                laser.update();
                laser.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
