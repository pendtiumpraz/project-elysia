<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Prism Light</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;z-index:10;mix-blend-mode:difference;}h1{font-size:96px;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>🌈 PRISM</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let t=0;function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);const cx=c.width/2,cy=c.height/2;for(let i=0;i<7;i++){ctx.save();ctx.translate(cx,cy);ctx.rotate(t+i*Math.PI/3.5);ctx.fillStyle=`hsl(${i*51},100%,50%)`;ctx.shadowBlur=30;ctx.shadowColor=ctx.fillStyle;ctx.fillRect(-200,-10,400,20);ctx.restore();}t+=0.01;requestAnimationFrame(animate);}animate();</script></body></html>
