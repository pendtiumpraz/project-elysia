<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Stream</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {background: #0a0a0a; overflow: hidden; font-family: 'Courier New', monospace;}
        canvas {display: block;}
        .content {position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #00ff00; z-index: 10;}
        h1 {font-size: 72px; text-shadow: 0 0 30px #00ff00;}
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="content"><h1>📊 DATA</h1></div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const streams = [];
        for (let i = 0; i < 30; i++) {
            streams.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: Math.random() * 100 + 50,
                speed: Math.random() * 3 + 1,
                values: Array(10).fill(0).map(() => Math.floor(Math.random() * 100))
            });
        }
        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = '12px Courier New';
            ctx.fillStyle = '#00ff00';
            streams.forEach(s => {
                s.y += s.speed;
                if (s.y > canvas.height + s.length) {
                    s.y = -s.length;
                    s.x = Math.random() * canvas.width;
                }
                s.values.forEach((val, i) => {
                    const alpha = 1 - (i / s.values.length);
                    ctx.fillStyle = `rgba(0, 255, 0, ${alpha})`;
                    ctx.fillText(val, s.x, s.y - i * 15);
                });
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
