<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Energy Burst</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#ffff00;z-index:10;}h1{font-size:96px;text-shadow:0 0 40px #ffff00;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>💥 BURST</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cx=c.width/2,cy=c.height/2;const bursts=[];function createBurst(){const rays=[];for(let i=0;i<20;i++)rays.push({angle:Math.random()*Math.PI*2,length:0,maxLength:Math.random()*200+100,speed:Math.random()*5+3});bursts.push({rays,life:1});}setInterval(createBurst,2000);function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);for(let i=bursts.length-1;i>=0;i--){const b=bursts[i];b.life-=0.01;b.rays.forEach(r=>{r.length+=r.speed;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(r.angle)*r.length,cy+Math.sin(r.angle)*r.length);ctx.strokeStyle=`hsla(60,100%,50%,${b.life})`;ctx.lineWidth=3;ctx.shadowBlur=15;ctx.shadowColor='#ffff00';ctx.stroke();});if(b.life<=0)bursts.splice(i,1);}requestAnimationFrame(animate);}animate();</script></body></html>
