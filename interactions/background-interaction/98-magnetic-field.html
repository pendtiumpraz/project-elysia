<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Magnetic Field</title><style>*{margin:0;padding:0;}body{background:#000;overflow:hidden;}canvas{display:block;}.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#ff00ff;z-index:10;}h1{font-size:72px;text-shadow:0 0 30px #ff00ff;}</style></head><body><canvas id="c"></canvas><div class="content"><h1>🧲 MAGNETIC</h1></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cx=c.width/2,cy=c.height/2;let t=0;function animate(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);for(let a=0;a<Math.PI*2;a+=Math.PI/16){ctx.beginPath();for(let r=50;r<400;r+=5){const wave=Math.sin(r*0.02+t)*20,x=cx+Math.cos(a)*(r+wave),y=cy+Math.sin(a)*(r+wave);if(r===50)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.strokeStyle=`hsl(${(a*180/Math.PI+t*10)%360},100%,50%)`;ctx.lineWidth=2;ctx.stroke();}t+=0.05;requestAnimationFrame(animate);}animate();</script></body></html>
