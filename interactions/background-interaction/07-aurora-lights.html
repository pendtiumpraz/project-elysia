<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Lights Background</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        
        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            background: #000;
            overflow: hidden;
        }
        
        .aurora {
            position: fixed;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(0, 255, 128, 0.3), transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(138, 43, 226, 0.3), transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(0, 191, 255, 0.3), transparent 50%);
            animation: aurora-move 15s ease-in-out infinite;
        }
        
        @keyframes aurora-move {
            0%, 100% {
                background-position: 0% 0%, 100% 50%, 50% 100%;
            }
            33% {
                background-position: 100% 0%, 0% 100%, 100% 50%;
            }
            66% {
                background-position: 50% 100%, 100% 0%, 0% 50%;
            }
        }
        
        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle ease-in-out infinite;
        }
        
        @keyframes twinkle {
            0%, 100% {opacity: 0.2;}
            50% {opacity: 1;}
        }
        
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            color: white;
        }
        
        h1 {
            font-size: 72px;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(0, 255, 128, 0.5);
        }
        
        p {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="aurora"></div>
    <div class="stars" id="stars"></div>
    
    <div class="content">
        <div>
            <h1>🌌 Aurora Lights</h1>
            <p>Northern lights effect</p>
        </div>
    </div>
    
    <script>
        const starsContainer = document.getElementById('stars');
        
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDuration = Math.random() * 3 + 2 + 's';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }
    </script>
</body>
</html>
