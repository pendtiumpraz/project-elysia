<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Heatmap</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;font-family:Arial;}.heatmap{display:grid;grid-template-columns:repeat(10,50px);grid-template-rows:repeat(7,50px);gap:5px;}.cell{background:#1a1a1a;border-radius:5px;animation:fadeIn 0.3s ease-out;transition:transform 0.3s;cursor:pointer;}.cell:hover{transform:scale(1.1);}.level-0{background:#0e4429;}.level-1{background:#006d32;}.level-2{background:#26a641;}.level-3{background:#39d353;}.cell:nth-child(n){animation-delay:calc(var(--i)*0.02s);}</style></head><body><div class="heatmap"><div class="cell level-1" style="--i:0;"></div><div class="cell level-2" style="--i:1;"></div><div class="cell level-0" style="--i:2;"></div><div class="cell level-3" style="--i:3;"></div><div class="cell level-1" style="--i:4;"></div><div class="cell level-2" style="--i:5;"></div><div class="cell level-1" style="--i:6;"></div><div class="cell level-3" style="--i:7;"></div><div class="cell level-0" style="--i:8;"></div><div class="cell level-2" style="--i:9;"></div></div><style>@keyframes fadeIn{from{opacity:0;transform:scale(0);}to{opacity:1;transform:scale(1);}}</style><script>const heatmap=document.querySelector('.heatmap');for(let i=0;i<60;i++){const cell=document.createElement('div');cell.className=`cell level-${Math.floor(Math.random()*4)}`;cell.style.setProperty('--i',i);heatmap.appendChild(cell);}</script></body></html>
