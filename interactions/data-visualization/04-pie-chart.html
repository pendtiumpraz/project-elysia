<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Animated Pie Chart</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;}.pie{width:300px;height:300px;border-radius:50%;background:conic-gradient(#ff0000 0deg 90deg,#00ff00 90deg 180deg,#0000ff 180deg 270deg,#ffff00 270deg 360deg);animation:spin 2s ease-out;transform:scale(0);animation-fill-mode:forwards;}@keyframes spin{to{transform:rotate(360deg) scale(1);}}</style></head><body><div class="pie"></div></body></html>
