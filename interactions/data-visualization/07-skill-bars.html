<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Skill Bars</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial;}.skills{width:500px;}.skill{margin-bottom:30px;}.skill-name{color:#fff;margin-bottom:10px;display:flex;justify-content:space-between;}.bar-container{background:#0f3460;height:20px;border-radius:10px;overflow:hidden;}.bar-fill{height:100%;background:linear-gradient(90deg,#00ffff,#ff00ff);border-radius:10px;animation:fill 2s ease-out forwards;transform-origin:left;}.skill:nth-child(1) .bar-fill{width:0;animation-delay:0s;}@keyframes fill{to{width:var(--width);}}.skill:nth-child(1) .bar-fill{--width:90%;}.skill:nth-child(2) .bar-fill{--width:80%;animation-delay:0.2s;}.skill:nth-child(3) .bar-fill{--width:95%;animation-delay:0.4s;}.skill:nth-child(4) .bar-fill{--width:70%;animation-delay:0.6s;}</style></head><body><div class="skills"><div class="skill"><div class="skill-name"><span>HTML/CSS</span><span>90%</span></div><div class="bar-container"><div class="bar-fill"></div></div></div><div class="skill"><div class="skill-name"><span>JavaScript</span><span>80%</span></div><div class="bar-container"><div class="bar-fill"></div></div></div><div class="skill"><div class="skill-name"><span>React</span><span>95%</span></div><div class="bar-container"><div class="bar-fill"></div></div></div><div class="skill"><div class="skill-name"><span>Node.js</span><span>70%</span></div><div class="bar-container"><div class="bar-fill"></div></div></div></div></body></html>
