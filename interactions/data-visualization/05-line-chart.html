<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Line Chart Animation</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}.chart{width:600px;height:400px;}svg{width:100%;height:100%;}path{fill:none;stroke:#00ffff;stroke-width:3;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2s ease-out forwards;}@keyframes draw{to{stroke-dashoffset:0;}}</style></head><body><div class="chart"><svg viewBox="0 0 600 400"><path d="M 50 350 L 100 250 L 150 300 L 200 150 L 250 200 L 300 100 L 350 150 L 400 50 L 450 100 L 500 80 L 550 50"/></svg></div></body></html>
