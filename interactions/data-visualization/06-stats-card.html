<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Stats Cards</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:30px;font-family:Arial;}.stat-card{background:#fff;padding:30px;border-radius:20px;text-align:center;min-width:200px;box-shadow:0 10px 40px rgba(0,0,0,0.2);animation:slideUp 0.6s ease-out;}.stat-card:nth-child(2){animation-delay:0.2s;}.stat-card:nth-child(3){animation-delay:0.4s;}@keyframes slideUp{from{opacity:0;transform:translateY(50px);}to{opacity:1;transform:translateY(0);}}.icon{font-size:48px;margin-bottom:15px;}.number{font-size:48px;font-weight:bold;color:#667eea;margin-bottom:10px;}.label{color:#999;font-size:16px;}</style></head><body><div class="stat-card"><div class="icon">👥</div><div class="number">2.5K</div><div class="label">Active Users</div></div><div class="stat-card"><div class="icon">📈</div><div class="number">85%</div><div class="label">Growth Rate</div></div><div class="stat-card"><div class="icon">💰</div><div class="number">$1.2M</div><div class="label">Revenue</div></div></body></html>
