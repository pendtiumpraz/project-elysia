<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Donut Chart</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);}.donut{position:relative;width:300px;height:300px;}.donut svg{transform:rotate(-90deg);animation:rotate 2s ease-out;}.donut circle{fill:none;stroke-width:40;}.bg{stroke:#ddd;}.progress{stroke-dasharray:565;stroke-dashoffset:565;animation:donut 2s ease-out forwards;stroke-linecap:round;}.segment1{stroke:#ff0000;animation-delay:0s;}@keyframes donut{to{stroke-dashoffset:141;}}.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;font-weight:bold;}.value{font-size:48px;}.label{font-size:18px;color:#ddd;}@keyframes rotate{from{transform:rotate(-90deg) scale(0);}to{transform:rotate(-90deg) scale(1);}}</style></head><body><div class="donut"><svg width="300" height="300"><circle class="bg" cx="150" cy="150" r="90"/><circle class="progress segment1" cx="150" cy="150" r="90"/></svg><div class="center"><div class="value">75%</div><div class="label">Complete</div></div></div></body></html>
