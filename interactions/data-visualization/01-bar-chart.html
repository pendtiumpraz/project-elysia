<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Animated Bar Chart</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial;}.chart{display:flex;align-items:flex-end;gap:20px;height:400px;}.bar{width:60px;background:linear-gradient(180deg,#00ffff,#ff00ff);border-radius:10px 10px 0 0;position:relative;animation:grow 1s ease-out forwards;transform-origin:bottom;}@keyframes grow{from{height:0;}}.bar:nth-child(1){height:0;animation-delay:0s;--final-height:250px;}.bar:nth-child(2){height:0;animation-delay:0.1s;--final-height:180px;}.bar:nth-child(3){height:0;animation-delay:0.2s;--final-height:320px;}.bar:nth-child(4){height:0;animation-delay:0.3s;--final-height:200px;}.bar:nth-child(5){height:0;animation-delay:0.4s;--final-height:280px;}.bar::after{content:attr(data-value);position:absolute;top:-30px;left:50%;transform:translateX(-50%);color:#fff;font-weight:bold;}</style></head><body><div class="chart"><div class="bar" data-value="250" style="animation:grow 1s ease-out forwards;--final-height:250px;">@keyframes grow{to{height:var(--final-height);}}</div><div class="bar" data-value="180" style="animation:grow 1s 0.1s ease-out forwards;--final-height:180px;"></div><div class="bar" data-value="320" style="animation:grow 1s 0.2s ease-out forwards;--final-height:320px;"></div><div class="bar" data-value="200" style="animation:grow 1s 0.3s ease-out forwards;--final-height:200px;"></div><div class="bar" data-value="280" style="animation:grow 1s 0.4s ease-out forwards;--final-height:280px;"></div></div><style>@keyframes grow{to{height:var(--final-height);}}</style></body></html>
