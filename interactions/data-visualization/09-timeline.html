<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Timeline</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial;padding:50px;}.timeline{position:relative;max-width:800px;}.timeline::before{content:'';position:absolute;left:50%;width:4px;height:100%;background:#0f3460;transform:translateX(-50%);}.timeline-item{position:relative;margin-bottom:50px;width:calc(50% - 30px);animation:slideIn 0.6s ease-out;}.timeline-item:nth-child(odd){left:0;}.timeline-item:nth-child(even){left:calc(50% + 30px);}.timeline-item:nth-child(2){animation-delay:0.2s;}.timeline-item:nth-child(3){animation-delay:0.4s;}.timeline-item:nth-child(4){animation-delay:0.6s;}@keyframes slideIn{from{opacity:0;transform:translateY(50px);}to{opacity:1;transform:translateY(0);}}.content{background:#16213e;padding:20px;border-radius:10px;color:#fff;}.content h3{margin-bottom:10px;color:#00ffff;}.dot{position:absolute;width:20px;height:20px;background:#00ffff;border-radius:50%;top:0;box-shadow:0 0 20px #00ffff;}.timeline-item:nth-child(odd) .dot{right:-40px;}.timeline-item:nth-child(even) .dot{left:-40px;}</style></head><body><div class="timeline"><div class="timeline-item"><div class="content"><h3>2024</h3><p>Latest achievement description</p></div><div class="dot"></div></div><div class="timeline-item"><div class="content"><h3>2023</h3><p>Major milestone reached</p></div><div class="dot"></div></div><div class="timeline-item"><div class="content"><h3>2022</h3><p>Project launched successfully</p></div><div class="dot"></div></div><div class="timeline-item"><div class="content"><h3>2021</h3><p>Company founded</p></div><div class="dot"></div></div></div></body></html>
