<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Counter Animation</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);gap:50px;font-family:Arial;}.counter-box{text-align:center;background:#fff;padding:40px;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,0.2);}.counter{font-size:72px;font-weight:bold;color:#667eea;margin-bottom:10px;}.label{font-size:18px;color:#999;}</style></head><body><div class="counter-box"><div class="counter" data-target="1250">0</div><div class="label">Users</div></div><div class="counter-box"><div class="counter" data-target="850">0</div><div class="label">Projects</div></div><div class="counter-box"><div class="counter" data-target="99">0</div><div class="label">Awards</div></div><script>document.querySelectorAll('.counter').forEach(counter=>{const target=+counter.getAttribute('data-target');const increment=target/100;let count=0;const updateCounter=()=>{count+=increment;if(count<target){counter.textContent=Math.floor(count);requestAnimationFrame(updateCounter);}else{counter.textContent=target;}};updateCounter();});</script></body></html>
