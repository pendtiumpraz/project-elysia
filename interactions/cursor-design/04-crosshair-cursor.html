<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crosshair Cursor</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        
        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            cursor: none;
            overflow: hidden;
        }
        
        h1 {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 48px;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .crosshair {
            position: fixed;
            width: 60px;
            height: 60px;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }
        
        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }
        
        .crosshair::before {
            width: 2px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .crosshair::after {
            width: 100%;
            height: 2px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .crosshair-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff00;
            animation: pulse-ring 1.5s ease-out infinite;
        }
        
        @keyframes pulse-ring {
            0% {transform: scale(1); opacity: 1;}
            100% {transform: scale(1.5); opacity: 0;}
        }
        
        .target {
            position: absolute;
            width: 150px;
            height: 150px;
            background: rgba(255, 0, 0, 0.2);
            border: 3px solid #ff0000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            transition: all 0.3s;
        }
        
        .target:hover {
            background: rgba(255, 0, 0, 0.5);
            transform: scale(1.2);
        }
        
        .target-1 {top: 30%; left: 20%;}
        .target-2 {top: 30%; right: 20%;}
        .target-3 {bottom: 30%; left: 30%;}
        .target-4 {bottom: 30%; right: 30%;}
        
        .score {
            position: absolute;
            top: 150px;
            right: 50px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            color: white;
            font-size: 24px;
            font-family: 'Courier New', monospace;
        }
        
        .info {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="crosshair" id="crosshair">
        <div class="crosshair-circle"></div>
    </div>
    
    <h1>🎯 Crosshair Cursor</h1>
    
    <div class="score">
        HITS: <span id="hits">0</span>
    </div>
    
    <div class="target target-1">🎯</div>
    <div class="target target-2">🎯</div>
    <div class="target target-3">🎯</div>
    <div class="target target-4">🎯</div>
    
    <div class="info">
        Click the targets!
    </div>
    
    <script>
        const crosshair = document.getElementById('crosshair');
        const hitsDisplay = document.getElementById('hits');
        let hits = 0;
        
        document.addEventListener('mousemove', (e) => {
            crosshair.style.left = e.clientX + 'px';
            crosshair.style.top = e.clientY + 'px';
        });
        
        document.querySelectorAll('.target').forEach(target => {
            target.addEventListener('click', () => {
                hits++;
                hitsDisplay.textContent = hits;
                target.style.background = 'rgba(0, 255, 0, 0.5)';
                setTimeout(() => {
                    target.style.background = 'rgba(255, 0, 0, 0.2)';
                }, 300);
            });
        });
    </script>
</body>
</html>
