<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Drawer Menu</title><style>*{margin:0;padding:0;}body{min-height:100vh;background:#1a1a2e;font-family:Arial;padding:30px;color:#fff;}.btn{padding:15px 30px;background:#00ffff;color:#000;border:none;border-radius:10px;cursor:pointer;font-weight:bold;}.drawer{position:fixed;left:-300px;top:0;width:300px;height:100%;background:#16213e;transition:left 0.3s;padding:30px;box-shadow:5px 0 20px rgba(0,0,0,0.5);overflow-y:auto;}.drawer.show{left:0;}.menu-item{padding:15px;margin:10px 0;background:#0f3460;border-radius:10px;cursor:pointer;transition:all 0.3s;}.menu-item:hover{background:#1e4d7a;transform:translateX(10px);}</style></head><body><button class="btn" onclick="toggleDrawer()">☰ Menu</button><div class="drawer" id="drawer"><h2>Navigation</h2><div class="menu-item">🏠 Home</div><div class="menu-item">📊 Dashboard</div><div class="menu-item">⚙️ Settings</div><div class="menu-item">👤 Profile</div><div class="menu-item">📧 Messages</div><div class="menu-item">🚪 Logout</div></div><script>function toggleDrawer(){document.getElementById('drawer').classList.toggle('show');}document.addEventListener('click',e=>{const drawer=document.getElementById('drawer');if(!drawer.contains(e.target)&&!e.target.matches('.btn'))drawer.classList.remove('show');});</script></body></html>
