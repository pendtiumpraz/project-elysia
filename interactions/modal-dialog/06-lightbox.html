<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Lightbox Gallery</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;gap:20px;padding:50px;flex-wrap:wrap;}.thumb{width:200px;height:200px;object-fit:cover;border-radius:10px;cursor:pointer;transition:transform 0.3s;}.thumb:hover{transform:scale(1.1);}.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);align-items:center;justify-content:center;}.lightbox.show{display:flex;}.lightbox img{max-width:90%;max-height:90%;border-radius:10px;animation:zoomIn 0.3s;}@keyframes zoomIn{from{transform:scale(0.5);}to{transform:scale(1);}}.close{position:absolute;top:30px;right:50px;color:#fff;font-size:40px;cursor:pointer;}</style></head><body><img class="thumb" src="https://via.placeholder.com/400/667eea/fff" onclick="openLightbox(this.src)"><img class="thumb" src="https://via.placeholder.com/400/764ba2/fff" onclick="openLightbox(this.src)"><img class="thumb" src="https://via.placeholder.com/400/f093fb/fff" onclick="openLightbox(this.src)"><img class="thumb" src="https://via.placeholder.com/400/f5576c/fff" onclick="openLightbox(this.src)"><div class="lightbox" id="lightbox" onclick="closeLightbox()"><span class="close">&times;</span><img id="lightboxImg"></div><script>function openLightbox(src){document.getElementById('lightbox').classList.add('show');document.getElementById('lightboxImg').src=src;}function closeLightbox(){document.getElementById('lightbox').classList.remove('show');}</script></body></html>
