<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Bottom Sheet</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial;}.btn{padding:20px 40px;background:#fff;border:none;border-radius:50px;cursor:pointer;font-size:18px;font-weight:bold;}.sheet{position:fixed;bottom:-100%;left:0;width:100%;background:#fff;border-radius:30px 30px 0 0;padding:40px;transition:bottom 0.4s;box-shadow:0 -10px 30px rgba(0,0,0,0.2);max-height:80vh;overflow-y:auto;}.sheet.show{bottom:0;}.handle{width:60px;height:5px;background:#ddd;border-radius:10px;margin:0 auto 20px;}</style></head><body><button class="btn" onclick="openSheet()">Open Bottom Sheet</button><div class="sheet" id="sheet"><div class="handle"></div><h2>Bottom Sheet</h2><p>Swipe down or tap outside to close.</p><button onclick="closeSheet()" style="margin-top:20px;padding:10px 30px;background:#667eea;color:#fff;border:none;border-radius:20px;cursor:pointer;">Close</button></div><script>function openSheet(){document.getElementById('sheet').classList.add('show');}function closeSheet(){document.getElementById('sheet').classList.remove('show');}document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});</script></body></html>
