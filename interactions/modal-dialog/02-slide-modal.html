<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Slide Modal</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial;}.btn{padding:20px 40px;background:#00ffff;color:#000;border:none;border-radius:10px;cursor:pointer;font-size:18px;font-weight:bold;}.modal{position:fixed;top:0;right:-100%;width:400px;height:100%;background:#16213e;box-shadow:-5px 0 20px rgba(0,0,0,0.5);transition:right 0.3s;padding:40px;color:#fff;overflow-y:auto;}.modal.show{right:0;}.close{font-size:30px;cursor:pointer;float:right;}</style></head><body><button class="btn" onclick="openModal()">Open Sidebar</button><div class="modal" id="modal"><span class="close" onclick="closeModal()">&times;</span><h2>Side Modal</h2><p>This modal slides in from the right side.</p><p style="margin-top:20px;">Add your content here...</p></div><script>function openModal(){document.getElementById('modal').classList.add('show');}function closeModal(){document.getElementById('modal').classList.remove('show');}</script></body></html>
