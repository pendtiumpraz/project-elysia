<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Fullscreen Modal</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial;}.btn{padding:20px 40px;background:#fff;border:none;border-radius:50px;cursor:pointer;font-size:18px;font-weight:bold;}.modal{display:none;position:fixed;inset:0;background:linear-gradient(135deg,#f093fb,#f5576c);align-items:center;justify-content:center;animation:slideIn 0.5s;}@keyframes slideIn{from{transform:translateY(100%);}to{transform:translateY(0);}}.modal.show{display:flex;}.modal-content{text-align:center;color:#fff;max-width:600px;}.close{position:absolute;top:30px;right:50px;font-size:40px;cursor:pointer;color:#fff;}</style></head><body><button class="btn" onclick="openModal()">Open Fullscreen</button><div class="modal" id="modal"><span class="close" onclick="closeModal()">&times;</span><div class="modal-content"><h1 style="font-size:72px;margin-bottom:30px;">Fullscreen Modal</h1><p style="font-size:24px;margin-bottom:30px;">This modal covers the entire screen with a smooth slide-in animation.</p><button onclick="closeModal()" style="padding:15px 40px;background:#fff;border:none;border-radius:50px;cursor:pointer;font-size:16px;font-weight:bold;">Close</button></div></div><script>function openModal(){document.getElementById('modal').classList.add('show');}function closeModal(){document.getElementById('modal').classList.remove('show');}</script></body></html>
