<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Fade Modal</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial;}.btn{padding:20px 40px;background:#fff;color:#667eea;border:none;border-radius:50px;cursor:pointer;font-size:18px;font-weight:bold;}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;opacity:0;transition:opacity 0.3s;}.modal.show{display:flex;opacity:1;}.modal-content{background:#fff;padding:40px;border-radius:20px;max-width:500px;transform:scale(0.7);transition:transform 0.3s;}.modal.show .modal-content{transform:scale(1);}.close{float:right;font-size:30px;cursor:pointer;}</style></head><body><button class="btn" onclick="openModal()">Open Modal</button><div class="modal" id="modal" onclick="closeModal()"><div class="modal-content" onclick="event.stopPropagation()"><span class="close" onclick="closeModal()">&times;</span><h2>Modal Title</h2><p>This is a fade-in modal dialog.</p></div></div><script>function openModal(){document.getElementById('modal').classList.add('show');}function closeModal(){document.getElementById('modal').classList.remove('show');}</script></body></html>
