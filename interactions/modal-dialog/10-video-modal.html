<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Video Modal</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;font-family:Arial;}.btn{padding:20px 40px;background:linear-gradient(135deg,#ff0000,#ff6b6b);color:#fff;border:none;border-radius:50px;cursor:pointer;font-size:20px;font-weight:bold;display:flex;align-items:center;gap:10px;}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);align-items:center;justify-content:center;padding:50px;}.modal.show{display:flex;}.video-container{position:relative;width:100%;max-width:900px;aspect-ratio:16/9;background:#000;border-radius:15px;overflow:hidden;}.close{position:absolute;top:-40px;right:0;color:#fff;font-size:40px;cursor:pointer;z-index:10;}iframe{width:100%;height:100%;border:none;}</style></head><body><button class="btn" onclick="openModal()">▶️ Play Video</button><div class="modal" id="modal" onclick="closeModal()"><div class="video-container" onclick="event.stopPropagation()"><span class="close" onclick="closeModal()">&times;</span><iframe id="video" src="" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe></div></div><script>function openModal(){document.getElementById('modal').classList.add('show');document.getElementById('video').src='https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1';}function closeModal(){document.getElementById('modal').classList.remove('show');document.getElementById('video').src='';}</script></body></html>
