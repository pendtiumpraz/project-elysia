<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Confirm Dialog</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-family:Arial;}.btn{padding:20px 40px;background:#f44336;color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:18px;font-weight:bold;}.dialog{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);align-items:center;justify-content:center;}.dialog.show{display:flex;}.dialog-content{background:#16213e;padding:30px;border-radius:15px;text-align:center;color:#fff;animation:bounce 0.5s;}@keyframes bounce{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}.buttons{display:flex;gap:15px;margin-top:25px;justify-content:center;}button{padding:12px 30px;border:none;border-radius:8px;cursor:pointer;font-size:16px;font-weight:bold;}.btn-yes{background:#4caf50;color:#fff;}.btn-no{background:#f44336;color:#fff;}</style></head><body><button class="btn" onclick="openDialog()">Delete Item</button><div class="dialog" id="dialog"><div class="dialog-content"><h2>⚠️ Confirm Action</h2><p style="margin:15px 0;">Are you sure you want to delete this item?</p><div class="buttons"><button class="btn-yes" onclick="confirm()">Yes, Delete</button><button class="btn-no" onclick="closeDialog()">Cancel</button></div></div></div><script>function openDialog(){document.getElementById('dialog').classList.add('show');}function closeDialog(){document.getElementById('dialog').classList.remove('show');}function confirm(){alert('Item deleted!');closeDialog();}</script></body></html>
