<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Alert Dialog</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial;gap:20px;}.btn{padding:20px 30px;border:none;border-radius:10px;cursor:pointer;font-size:16px;font-weight:bold;color:#fff;}.success{background:#4caf50;}.warning{background:#ff9800;}.danger{background:#f44336;}.alert{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:30px 40px;border-radius:15px;box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center;min-width:350px;animation:shake 0.5s;}@keyframes shake{0%,100%{transform:translate(-50%,-50%);}25%{transform:translate(-55%,-50%);}75%{transform:translate(-45%,-50%);}}.alert.show{display:block;}.icon{font-size:64px;margin-bottom:15px;}.alert button{margin-top:20px;padding:12px 30px;background:#667eea;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;}</style></head><body><button class="btn success" onclick="showAlert('✓','Success!','Operation completed successfully.','#4caf50')">Success</button><button class="btn warning" onclick="showAlert('⚠️','Warning!','Please review your action.','#ff9800')">Warning</button><button class="btn danger" onclick="showAlert('✗','Error!','Something went wrong.','#f44336')">Error</button><div class="alert" id="alert"><div class="icon" id="icon"></div><h2 id="title"></h2><p id="message"></p><button onclick="closeAlert()">OK</button></div><script>function showAlert(icon,title,msg,color){document.getElementById('icon').textContent=icon;document.getElementById('title').textContent=title;document.getElementById('title').style.color=color;document.getElementById('message').textContent=msg;document.getElementById('alert').classList.add('show');}function closeAlert(){document.getElementById('alert').classList.remove('show');}</script></body></html>
