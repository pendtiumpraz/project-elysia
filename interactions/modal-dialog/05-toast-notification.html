<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Toast Notification</title><style>*{margin:0;padding:0;}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial;gap:20px;}.btn{padding:20px 30px;border:none;border-radius:10px;cursor:pointer;font-size:16px;font-weight:bold;color:#fff;}.success{background:#4caf50;}.error{background:#f44336;}.info{background:#2196f3;}.toast{position:fixed;top:-100px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:20px 30px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,0.3);transition:top 0.3s;z-index:1000;}.toast.show{top:30px;}</style></head><body><button class="btn success" onclick="showToast('✓ Success message!','#4caf50')">Success</button><button class="btn error" onclick="showToast('✗ Error occurred!','#f44336')">Error</button><button class="btn info" onclick="showToast('ℹ Info message!','#2196f3')">Info</button><div class="toast" id="toast"></div><script>function showToast(msg,color){const toast=document.getElementById('toast');toast.textContent=msg;toast.style.background=color;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3000);}</script></body></html>
