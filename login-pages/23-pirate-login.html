<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirate Ship - Login</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            font-family: 'Impact', sans-serif;
            background: linear-gradient(180deg, #003366 0%, #004080 50%, #0059b3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* OCEAN WAVES */
        .waves {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 200px;
        }
        
        .wave {
            position: absolute;
            bottom: 0;
            width: 200%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120"><path d="M0,60 Q300,120 600,60 T1200,60 V120 H0 V60" fill="%23004080" opacity="0.5"/></svg>');
            background-repeat: repeat-x;
            animation: wave-move 15s linear infinite;
        }
        
        .wave-2 {
            animation-duration: 10s;
            opacity: 0.7;
        }
        
        @keyframes wave-move {
            from {transform: translateX(0);}
            to {transform: translateX(-600px);}
        }
        
        /* SHIP WHEEL DESIGN */
        .ship-wheel-container {
            width: 600px;
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .ship-wheel {
            width: 500px;
            height: 500px;
            border-radius: 50%;
            border: 20px solid #8B4513;
            background: radial-gradient(circle, #D2691E 0%, #D2691E 30%, transparent 30%, transparent 100%);
            position: absolute;
            animation: wheel-turn 20s linear infinite;
            box-shadow: 0 0 50px rgba(139, 69, 19, 0.5);
        }
        
        @keyframes wheel-turn {
            from {transform: rotate(0deg);}
            to {transform: rotate(360deg);}
        }
        
        .wheel-spoke {
            position: absolute;
            width: 10px;
            height: 250px;
            background: #8B4513;
            top: 50%;
            left: 50%;
            transform-origin: center center;
        }
        
        .spoke-1 {transform: translate(-50%, -50%) rotate(0deg);}
        .spoke-2 {transform: translate(-50%, -50%) rotate(45deg);}
        .spoke-3 {transform: translate(-50%, -50%) rotate(90deg);}
        .spoke-4 {transform: translate(-50%, -50%) rotate(135deg);}
        
        /* TREASURE MAP LOGIN */
        .treasure-login {
            background: linear-gradient(135deg, #f4e4c1, #d4b896);
            padding: 50px;
            border: 5px solid #8B4513;
            width: 450px;
            position: relative;
            z-index: 10;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="50" cy="50" r="2" fill="%23d4b896"/></svg>');
            animation: counter-wheel 20s linear infinite;
        }
        
        @keyframes counter-wheel {
            from {transform: rotate(0deg);}
            to {transform: rotate(-360deg);}
        }
        
        .pirate-flag {
            text-align: center;
            font-size: 100px;
            margin-bottom: 20px;
            animation: flag-wave 2s ease-in-out infinite;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.5));
        }
        
        @keyframes flag-wave {
            0%, 100% {transform: rotate(-10deg);}
            50% {transform: rotate(10deg);}
        }
        
        .title {
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            color: #8B4513;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 #000, 0 0 10px #FFD700;
            letter-spacing: 3px;
        }
        
        .subtitle {
            text-align: center;
            color: #654321;
            margin-bottom: 30px;
            font-size: 18px;
            font-family: 'Georgia', serif;
            font-style: italic;
        }
        
        .compass {
            text-align: center;
            font-size: 80px;
            margin-bottom: 20px;
            animation: compass-spin 5s ease-in-out infinite;
        }
        
        @keyframes compass-spin {
            0%, 100% {transform: rotate(-20deg);}
            50% {transform: rotate(20deg);}
        }
        
        .x-marks {
            text-align: center;
            font-size: 60px;
            color: #ff0000;
            margin: 20px 0;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }
        
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #8B4513;
            font-weight: bold;
            font-size: 16px;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            padding-left: 45px;
            border: 3px solid #8B4513;
            background: rgba(255, 255, 255, 0.8);
            color: #654321;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        
        .input-icon {
            position: absolute;
            left: 15px;
            top: 45px;
            font-size: 20px;
        }
        
        .rope-divider {
            width: 100%;
            height: 10px;
            background: repeating-linear-gradient(
                90deg,
                #8B4513,
                #8B4513 10px,
                #A0522D 10px,
                #A0522D 20px
            );
            margin: 25px 0;
            border-radius: 5px;
        }
        
        .plunder-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #654321;
            border: 4px solid #8B4513;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 10px 30px rgba(139, 69, 19, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .plunder-btn::before {
            content: '💰';
            position: absolute;
            font-size: 30px;
            animation: coin-roll 3s linear infinite;
        }
        
        @keyframes coin-roll {
            0% {left: -50px; transform: rotate(0deg);}
            100% {left: 110%; transform: rotate(720deg);}
        }
        
        .plunder-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(139, 69, 19, 0.7);
        }
        
        .crew-link {
            text-align: center;
            margin-top: 20px;
            color: #654321;
            font-size: 14px;
            font-family: 'Georgia', serif;
        }
        
        .crew-link a {
            color: #8B4513;
            text-decoration: none;
            font-weight: bold;
            border-bottom: 2px solid #8B4513;
        }
        
        .wooden-texture {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 100px,
                rgba(139, 69, 19, 0.05) 100px,
                rgba(139, 69, 19, 0.05) 102px
            );
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="waves">
        <div class="wave"></div>
        <div class="wave wave-2"></div>
    </div>
    
    <div class="ship-wheel-container">
        <div class="ship-wheel">
            <div class="wheel-spoke spoke-1"></div>
            <div class="wheel-spoke spoke-2"></div>
            <div class="wheel-spoke spoke-3"></div>
            <div class="wheel-spoke spoke-4"></div>
        </div>
        
        <div class="treasure-login">
            <div class="wooden-texture"></div>
            
            <div class="pirate-flag">🏴‍☠️</div>
            <h1 class="title">PIRATE SHIP</h1>
            <p class="subtitle">Ahoy! Welcome Aboard, Matey!</p>
            
            <div class="compass">🧭</div>
            <div class="x-marks">✗</div>
            <p style="text-align: center; color: #8B4513; margin-bottom: 25px; font-weight: bold;">
                X MARKS THE SPOT
            </p>
            
            <form>
                <div class="form-group">
                    <label>⚓ Pirate Name</label>
                    <div class="input-icon">👤</div>
                    <input type="text" placeholder="Captain's identity" required>
                </div>
                
                <div class="rope-divider"></div>
                
                <div class="form-group">
                    <label>🗝️ Treasure Code</label>
                    <div class="input-icon">🔒</div>
                    <input type="password" placeholder="Secret map password" required>
                </div>
                
                <button type="submit" class="plunder-btn">⚔️ BOARD SHIP ⚔️</button>
                
                <p class="crew-link">
                    Need a crew? <a href="#">Join the Fleet!</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
