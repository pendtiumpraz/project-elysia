<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber City - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(transparent 50%, rgba(255, 0, 255, 0.03) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 999;
            animation: scanline 8s linear infinite;
        }
        
        @keyframes scanline {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }
        
        .login-container {
            background: rgba(0, 0, 0, 0.95);
            padding: 50px;
            border: 2px solid #ff00ff;
            clip-path: polygon(0 0, 95% 0, 100% 5%, 100% 100%, 5% 100%, 0 95%);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.7), inset 0 0 30px rgba(0, 255, 255, 0.1);
            width: 100%;
            max-width: 450px;
            animation: neonFadeIn 2s ease;
            position: relative;
            z-index: 10;
        }
        
        @keyframes neonFadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }
        
        .cyber-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .cyber-badge {
            display: inline-block;
            background: rgba(255, 0, 255, 0.2);
            color: #ff00ff;
            padding: 8px 25px;
            border: 2px solid #ff00ff;
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 3px;
            font-size: 12px;
        }
        
        .title {
            font-size: 36px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #00ffff;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }
        
        .terminal-box {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ffff;
            padding: 15px;
            margin: 20px 0;
            font-size: 11px;
        }
        
        .terminal-line {
            color: #00ffff;
            margin: 5px 0;
        }
        
        .terminal-line::before {
            content: '> ';
            color: #ff00ff;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ff00ff;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 12px;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ff00ff;
            background: rgba(0, 0, 0, 0.7);
            color: #00ffff;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
        
        .form-group input::placeholder {
            color: rgba(0, 255, 255, 0.5);
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .remember-forgot label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #00ffff;
            cursor: pointer;
            font-size: 12px;
        }
        
        .remember-forgot a {
            color: #ff00ff;
            text-decoration: none;
            font-size: 12px;
        }
        
        .remember-forgot a:hover {
            text-shadow: 0 0 10px #ff00ff;
        }
        
        .login-btn {
            width: 100%;
            padding: 18px;
            background: #ff00ff;
            color: #000;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.7);
        }
        
        .login-btn:hover {
            background: #00ffff;
            box-shadow: 0 0 50px rgba(0, 255, 255, 1);
        }
        
        .divider {
            text-align: center;
            margin: 25px 0;
            color: rgba(255, 0, 255, 0.5);
            font-size: 12px;
        }
        
        .signup-link {
            text-align: center;
            color: #00ffff;
            font-size: 12px;
        }
        
        .signup-link a {
            color: #ff00ff;
            text-decoration: none;
            font-weight: bold;
        }
        
        .signup-link a:hover {
            text-shadow: 0 0 10px #ff00ff;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    
    <div class="login-container">
        <div class="cyber-header">
            <div class="cyber-badge">◢ 2099 ◣</div>
            <h1 class="title">CYBER CITY</h1>
            <p class="subtitle">NEURAL NETWORK ACCESS</p>
        </div>
        
        <div class="terminal-box">
            <div class="terminal-line">SYSTEM.BOOT()</div>
            <div class="terminal-line">NEURAL_LINK: STANDBY</div>
            <div class="terminal-line">AWAITING CREDENTIALS...</div>
        </div>
        
        <form>
            <div class="form-group">
                <label for="email">◢ User ID ◣</label>
                <input type="text" id="email" placeholder="Enter netrunner ID" required>
            </div>
            
            <div class="form-group">
                <label for="password">◢ Access Code ◣</label>
                <input type="password" id="password" placeholder="Enter cyberkey" required>
            </div>
            
            <div class="remember-forgot">
                <label>
                    <input type="checkbox">
                    Save session
                </label>
                <a href="#">Lost key?</a>
            </div>
            
            <button type="submit" class="login-btn">◢ Jack In ◣</button>
            
            <p class="divider">━━━━━━━━━━━━━━━</p>
            
            <p class="signup-link">
                New user? <a href="#">Register Neural Link</a>
            </p>
        </form>
    </div>
</body>
</html>
