<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Apocalypse - Login</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            font-family: 'Impact', sans-serif;
            background: #1a1a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* CRACKED SCREEN EFFECT */
        .crack-overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(45deg, transparent 48%, rgba(255, 0, 0, 0.3) 49%, rgba(255, 0, 0, 0.3) 51%, transparent 52%),
                linear-gradient(-45deg, transparent 48%, rgba(255, 0, 0, 0.3) 49%, rgba(255, 0, 0, 0.3) 51%, transparent 52%);
            background-size: 100px 100px;
            pointer-events: none;
            opacity: 0.3;
        }
        
        .static-noise {
            position: fixed;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="noise"><feTurbulence baseFrequency="0.9"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.1"/></svg>');
            animation: static 0.2s infinite;
            pointer-events: none;
        }
        
        @keyframes static {
            0%, 100% {opacity: 0.1;}
            50% {opacity: 0.2;}
        }
        
        .zombie-hand {
            position: fixed;
            bottom: -100px;
            font-size: 150px;
            animation: hand-reach 5s ease-in-out infinite;
            z-index: 5;
        }
        
        .hand-1 {left: 10%; animation-delay: 0s;}
        .hand-2 {right: 15%; animation-delay: 2s;}
        
        @keyframes hand-reach {
            0%, 100% {transform: translateY(0) rotate(0deg);}
            50% {transform: translateY(-150px) rotate(-20deg);}
        }
        
        /* EMERGENCY BROADCAST DESIGN */
        .survivor-panel {
            background: linear-gradient(135deg, #2d1f1f, #1a1a1a);
            border: 5px solid #00ff00;
            width: 500px;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.5), inset 0 0 30px rgba(0, 255, 0, 0.1);
            position: relative;
            animation: panel-flicker 3s infinite;
        }
        
        @keyframes panel-flicker {
            0%, 100% {border-color: #00ff00;}
            50% {border-color: #00aa00;}
        }
        
        .biohazard-top {
            background: #ffcc00;
            padding: 15px;
            text-align: center;
            border-bottom: 3px solid #000;
            position: relative;
        }
        
        .biohazard-icon {
            font-size: 50px;
            animation: rotate-hazard 10s linear infinite;
        }
        
        @keyframes rotate-hazard {
            from {transform: rotate(0deg);}
            to {transform: rotate(360deg);}
        }
        
        .warning-text {
            color: #000;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 3px;
        }
        
        .content {
            padding: 40px;
            background: rgba(0, 0, 0, 0.8);
        }
        
        .emergency-header {
            background: #ff0000;
            color: #fff;
            padding: 15px;
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
            letter-spacing: 5px;
            animation: blink-red 1s infinite;
        }
        
        @keyframes blink-red {
            0%, 49% {opacity: 1;}
            50%, 100% {opacity: 0.7;}
        }
        
        .countdown-timer {
            text-align: center;
            font-size: 48px;
            color: #00ff00;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 20px #00ff00;
        }
        
        .survival-status {
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff0000;
            padding: 15px;
            margin-bottom: 25px;
            color: #00ff00;
            font-size: 14px;
        }
        
        .status-line {
            margin: 5px 0;
            font-family: 'Courier New', monospace;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #00ff00;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00ff00;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #00ff00;
            background: rgba(0, 255, 0, 0.05);
            color: #00ff00;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
            background: rgba(0, 255, 0, 0.1);
        }
        
        .form-group input::placeholder {
            color: rgba(0, 255, 0, 0.5);
        }
        
        .survive-btn {
            width: 100%;
            padding: 20px;
            background: #00ff00;
            color: #000;
            border: 3px solid #00aa00;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 10px 30px rgba(0, 255, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .survive-btn::before {
            content: '☢️';
            position: absolute;
            font-size: 30px;
            animation: warning-move 2s linear infinite;
        }
        
        @keyframes warning-move {
            0% {left: -50px;}
            100% {left: 110%;}
        }
        
        .survive-btn:hover {
            background: #00aa00;
            box-shadow: 0 15px 40px rgba(0, 255, 0, 0.6);
        }
        
        .distress-link {
            text-align: center;
            margin-top: 20px;
            color: #00ff00;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }
        
        .distress-link a {
            color: #ffcc00;
            text-decoration: none;
            font-weight: bold;
        }
        
        .blood-splatter {
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #8B0000, transparent);
            border-radius: 50%;
            opacity: 0.6;
        }
        
        .splatter-1 {top: 20px; right: 30px;}
        .splatter-2 {bottom: 40px; left: 20px; width: 60px; height: 60px;}
    </style>
</head>
<body>
    <div class="crack-overlay"></div>
    <div class="static-noise"></div>
    <div class="zombie-hand hand-1">🧟</div>
    <div class="zombie-hand hand-2">🧟‍♀️</div>
    
    <div class="survivor-panel">
        <div class="blood-splatter splatter-1"></div>
        <div class="blood-splatter splatter-2"></div>
        
        <div class="biohazard-top">
            <div class="biohazard-icon">☢️</div>
            <div class="warning-text">⚠️ BIOHAZARD WARNING ⚠️</div>
        </div>
        
        <div class="content">
            <div class="emergency-header">
                🚨 EMERGENCY BROADCAST 🚨
            </div>
            
            <div class="countdown-timer" id="countdown">00:00:00</div>
            
            <div class="survival-status">
                <div class="status-line">> INFECTION RATE: 87%</div>
                <div class="status-line">> SURVIVORS: 1,234</div>
                <div class="status-line">> ZOMBIE THREAT: CRITICAL</div>
                <div class="status-line">> SAFE ZONES: 3 ACTIVE</div>
            </div>
            
            <form>
                <div class="form-group">
                    <label>🆔 Survivor ID</label>
                    <input type="text" placeholder="Enter identification code" required>
                </div>
                
                <div class="form-group">
                    <label>🔒 Security Clearance</label>
                    <input type="password" placeholder="Safe zone access code" required>
                </div>
                
                <button type="submit" class="survive-btn">🏃 ENTER SAFE ZONE</button>
                
                <p class="distress-link">
                    Need rescue? <a href="#">Send distress signal...</a>
                </p>
            </form>
        </div>
    </div>
    
    <script>
        let seconds = 0;
        setInterval(() => {
            seconds++;
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            document.getElementById('countdown').textContent = 
                `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }, 1000);
    </script>
</body>
</html>
