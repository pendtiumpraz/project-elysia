<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post-Apocalypse - Login</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #2a1a0a 0%, #3a2a1a 50%, #4a3a2a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* NUCLEAR FALLOUT */
        .fallout-particles {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .fallout {
            position: absolute;
            width: 3px;
            height: 30px;
            background: linear-gradient(180deg, #ff6600, transparent);
            animation: fallout-drop linear infinite;
        }
        
        @keyframes fallout-drop {
            from {
                transform: translateY(-100px);
                opacity: 1;
            }
            to {
                transform: translateY(100vh);
                opacity: 0.3;
            }
        }
        
        /* RADIATION WARNING */
        .radiation-glow {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(255, 102, 0, 0.2) 0%, transparent 70%);
            animation: radiation-pulse 3s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes radiation-pulse {
            0%, 100% {opacity: 0.3;}
            50% {opacity: 0.6;}
        }
        
        /* BUNKER VAULT DOOR */
        .bunker-entrance {
            background: linear-gradient(145deg, #4a4a4a, #2a2a2a);
            width: 550px;
            padding: 0;
            border: 20px solid #1a1a1a;
            border-radius: 50%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), inset 0 0 100px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }
        
        .vault-wheel {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 30px solid #ff6600;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: wheel-turn 20s linear infinite;
            pointer-events: none;
        }
        
        @keyframes wheel-turn {
            from {transform: translate(-50%, -50%) rotate(0deg);}
            to {transform: translate(-50%, -50%) rotate(360deg);}
        }
        
        .wheel-spoke {
            position: absolute;
            width: 10px;
            height: 100px;
            background: #ff6600;
            top: 50%;
            left: 50%;
        }
        
        .spoke-1 {transform: translate(-50%, -50%) rotate(0deg);}
        .spoke-2 {transform: translate(-50%, -50%) rotate(60deg);}
        .spoke-3 {transform: translate(-50%, -50%) rotate(120deg);}
        
        .bunker-panel {
            background: rgba(42, 26, 10, 0.95);
            padding: 50px;
            margin: 50px;
            border: 5px solid #ff6600;
            border-radius: 10px;
            position: relative;
            z-index: 10;
        }
        
        .hazard-icon {
            text-align: center;
            font-size: 100px;
            margin-bottom: 20px;
            animation: hazard-rotate 5s linear infinite;
            filter: drop-shadow(0 0 30px #ff6600);
        }
        
        @keyframes hazard-rotate {
            from {transform: rotate(0deg);}
            to {transform: rotate(360deg);}
        }
        
        .title {
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            color: #ff6600;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #ff6600, 3px 3px 0 #000;
            letter-spacing: 5px;
            font-family: 'Impact', sans-serif;
        }
        
        .subtitle {
            text-align: center;
            color: #ff9944;
            margin-bottom: 25px;
            font-size: 14px;
        }
        
        .warning-tape {
            background: repeating-linear-gradient(
                45deg,
                #ffcc00,
                #ffcc00 20px,
                #000 20px,
                #000 40px
            );
            height: 30px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            font-size: 12px;
            letter-spacing: 3px;
        }
        
        .geiger-counter {
            background: rgba(255, 102, 0, 0.2);
            border: 3px solid #ff6600;
            padding: 15px;
            margin-bottom: 25px;
        }
        
        .geiger-display {
            color: #ff6600;
            font-size: 36px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #ff6600;
            animation: geiger-blink 0.5s infinite;
        }
        
        @keyframes geiger-blink {
            0%, 100% {opacity: 1;}
            50% {opacity: 0.5;}
        }
        
        .geiger-label {
            text-align: center;
            color: #ff9944;
            font-size: 12px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ff6600;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 2px;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 3px solid #ff6600;
            background: rgba(0, 0, 0, 0.7);
            color: #ff6600;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }
        
        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.8);
        }
        
        .form-group input::placeholder {
            color: rgba(255, 102, 0, 0.5);
        }
        
        .hazmat-icon {
            text-align: center;
            font-size: 60px;
            margin: 20px 0;
        }
        
        .enter-btn {
            width: 100%;
            padding: 20px;
            background: #ff6600;
            color: #000;
            border: 5px solid #000;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 10px 30px rgba(255, 102, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .enter-btn::before {
            content: '☢️';
            position: absolute;
            font-size: 30px;
            animation: radiation-move 3s linear infinite;
        }
        
        @keyframes radiation-move {
            0% {
                left: -50px;
                top: 50%;
                transform: translate(-50%, -50%) rotate(0deg);
            }
            100% {
                left: 110%;
                top: 50%;
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }
        
        .enter-btn:hover {
            background: #ff9944;
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 102, 0, 0.8);
        }
        
        .shelter-link {
            text-align: center;
            margin-top: 20px;
            color: #ff9944;
            font-size: 14px;
        }
        
        .shelter-link a {
            color: #ff6600;
            text-decoration: none;
            font-weight: bold;
            border-bottom: 1px solid #ff6600;
        }
    </style>
</head>
<body>
    <div class="radiation-glow"></div>
    <div class="fallout-particles" id="fallout"></div>
    
    <div class="bunker-entrance">
        <div class="vault-wheel">
            <div class="wheel-spoke spoke-1"></div>
            <div class="wheel-spoke spoke-2"></div>
            <div class="wheel-spoke spoke-3"></div>
        </div>
        
        <div class="bunker-panel">
            <div class="hazard-icon">☢️</div>
            
            <h1 class="title">BUNKER 47</h1>
            <p class="subtitle">Emergency Shelter Access</p>
            
            <div class="warning-tape">
                ⚠️ AUTHORIZED PERSONNEL ONLY ⚠️
            </div>
            
            <div class="geiger-counter">
                <div class="geiger-display">8.7 mSv</div>
                <div class="geiger-label">RADIATION LEVEL: CRITICAL</div>
            </div>
            
            <form>
                <div class="form-group">
                    <label>🆔 Survivor ID</label>
                    <input type="text" placeholder="Enter bunker access code" required>
                </div>
                
                <div class="form-group">
                    <label>🔒 Vault Code</label>
                    <input type="password" placeholder="Emergency password" required>
                </div>
                
                <div class="hazmat-icon">🧪 ⚗️ 🧬</div>
                
                <button type="submit" class="enter-btn">🚪 OPEN VAULT DOOR 🚪</button>
                
                <p class="shelter-link">
                    Need shelter? <a href="#">Request emergency access...</a>
                </p>
            </form>
        </div>
    </div>
    
    <script>
        const falloutContainer = document.getElementById('fallout');
        for (let i = 0; i < 30; i++) {
            const fallout = document.createElement('div');
            fallout.className = 'fallout';
            fallout.style.left = Math.random() * 100 + '%';
            fallout.style.animationDuration = Math.random() * 3 + 2 + 's';
            fallout.style.animationDelay = Math.random() * 3 + 's';
            falloutContainer.appendChild(fallout);
        }
    </script>
</body>
</html>
