<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Zone - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Impact', 'Arial Black', sans-serif;
            background: linear-gradient(135deg, #141E30 0%, #243B55 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: rgba(0, 0, 0, 0.9);
            padding: 50px;
            border: 3px solid #ff4500;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(255, 69, 0, 0.5), inset 0 0 30px rgba(255, 69, 0, 0.1);
            width: 100%;
            max-width: 450px;
            animation: explosive-entry 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform: skew(-2deg);
        }
        
        @keyframes explosive-entry {
            0% {
                opacity: 0;
                transform: scale(0.3) rotate(-10deg) skew(-2deg);
            }
            50% {
                transform: scale(1.1) rotate(5deg) skew(-2deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0) skew(-2deg);
            }
        }
        
        .battle-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .power-badge {
            display: inline-block;
            background: rgba(255, 69, 0, 0.3);
            color: #ff4500;
            padding: 10px 25px;
            border: 3px solid #ff4500;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 14px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #ff4500;
            transform: skew(-5deg);
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.5);
        }
        
        .title {
            font-size: 40px;
            font-weight: bold;
            color: #ff4500;
            text-shadow: 4px 4px 0 #000, 0 0 30px #ff4500;
            text-transform: uppercase;
            letter-spacing: 5px;
            transform: skew(-5deg);
        }
        
        .subtitle {
            color: #fff;
            font-size: 14px;
            text-shadow: 2px 2px 0 #000;
            font-family: 'Arial', sans-serif;
            margin-top: 10px;
        }
        
        .power-meter {
            background: rgba(255, 69, 0, 0.1);
            padding: 20px;
            margin: 20px 0;
            border-left: 5px solid #ff4500;
            transform: skew(-2deg);
        }
        
        .meter-line {
            color: #ff4500;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            margin: 5px 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ff4500;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 14px;
            font-family: 'Arial', sans-serif;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255, 69, 0, 0.5);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 16px;
            font-family: 'Arial', sans-serif;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #ff4500;
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.5);
        }
        
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .remember-forgot label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ccc;
            cursor: pointer;
            font-size: 14px;
            font-family: 'Arial', sans-serif;
        }
        
        .remember-forgot a {
            color: #ff4500;
            text-decoration: none;
            font-size: 14px;
            font-family: 'Arial', sans-serif;
        }
        
        .remember-forgot a:hover {
            text-shadow: 0 0 10px #ff4500;
        }
        
        .login-btn {
            width: 100%;
            padding: 20px;
            background: #ff4500;
            color: #000;
            border: none;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            transform: skew(-5deg);
            box-shadow: 0 0 30px rgba(255, 69, 0, 0.7), 5px 5px 0 #000;
        }
        
        .login-btn:hover {
            transform: skew(-5deg) translateY(-3px);
            box-shadow: 0 0 50px rgba(255, 69, 0, 1), 7px 7px 0 #000;
        }
        
        .divider {
            text-align: center;
            margin: 25px 0;
            color: rgba(255, 69, 0, 0.5);
            font-size: 14px;
            font-family: 'Arial', sans-serif;
        }
        
        .signup-link {
            text-align: center;
            color: #ccc;
            font-size: 14px;
            font-family: 'Arial', sans-serif;
        }
        
        .signup-link a {
            color: #ff4500;
            text-decoration: none;
            font-weight: bold;
        }
        
        .signup-link a:hover {
            text-shadow: 0 0 10px #ff4500;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="battle-header">
            <div class="power-badge">⚡ POWER: 9000+</div>
            <h1 class="title">BATTLE ZONE</h1>
            <p class="subtitle">WARRIOR ACCESS POINT</p>
        </div>
        
        <div class="power-meter">
            <div class="meter-line">► ARENA STATUS: ACTIVE</div>
            <div class="meter-line">► FIGHTERS ONLINE: 5,432</div>
            <div class="meter-line">► RANK: AWAITING LOGIN</div>
        </div>
        
        <form>
            <div class="form-group">
                <label for="email">[ Warrior ID ]</label>
                <input type="text" id="email" placeholder="Enter fighter name" required>
            </div>
            
            <div class="form-group">
                <label for="password">[ Battle Code ]</label>
                <input type="password" id="password" placeholder="Enter access code" required>
            </div>
            
            <div class="remember-forgot">
                <label>
                    <input type="checkbox">
                    Stay ready
                </label>
                <a href="#">Lost code?</a>
            </div>
            
            <button type="submit" class="login-btn">💥 FIGHT!</button>
            
            <p class="divider">━━━━━━━━━━━━━━━</p>
            
            <p class="signup-link">
                New warrior? <a href="#">Register Now</a>
            </p>
        </form>
    </div>
</body>
</html>
