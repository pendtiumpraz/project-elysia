<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura High - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #87CEEB 0%, #FFB6C1 50%, #FFE4B5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        
        .cherry-blossoms {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .petal {
            position: absolute;
            background: #FFB7C5;
            border-radius: 50% 0 50% 0;
            animation: fall linear infinite;
            opacity: 0.7;
        }
        
        @keyframes fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
            }
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 450px;
            animation: bounceIn 1s ease;
            position: relative;
            z-index: 10;
        }
        
        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1);
            }
        }
        
        .logo {
            text-align: center;
            font-size: 70px;
            margin-bottom: 15px;
            animation: swing 2s ease-in-out infinite;
        }
        
        @keyframes swing {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        
        .title {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #FF69B4;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 35px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #FFB6C1;
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #FF69B4;
            box-shadow: 0 0 0 3px rgba(255, 105, 180, 0.1);
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .remember-forgot label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            cursor: pointer;
        }
        
        .remember-forgot a {
            color: #FF69B4;
            text-decoration: none;
            font-weight: 600;
        }
        
        .remember-forgot a:hover {
            text-decoration: underline;
        }
        
        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #FF69B4, #FF1493);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
        }
        
        .login-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 105, 180, 0.5);
        }
        
        .school-info {
            background: rgba(255, 182, 193, 0.2);
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
            text-align: center;
        }
        
        .school-info p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .signup-link {
            text-align: center;
            color: #666;
        }
        
        .signup-link a {
            color: #FF69B4;
            text-decoration: none;
            font-weight: 600;
        }
        
        .signup-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="cherry-blossoms" id="petals"></div>
    
    <div class="login-container">
        <div class="logo">🎒</div>
        <h1 class="title">🌸 Sakura High School 🌸</h1>
        <p class="subtitle">Student Portal Login</p>
        
        <form>
            <div class="form-group">
                <label for="email">Student ID / Email</label>
                <input type="text" id="email" placeholder="Enter your student ID" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <div class="remember-forgot">
                <label>
                    <input type="checkbox">
                    Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>
            
            <button type="submit" class="login-btn">Login to Portal 📚</button>
            
            <div class="school-info">
                <p>🌸 Welcome back, student! 🌸<br>
                Check your schedule, assignments, and club activities!</p>
            </div>
            
            <p class="signup-link">
                New student? <a href="#">Apply for admission</a>
            </p>
        </form>
    </div>
    
    <script>
        const petalsContainer = document.getElementById('petals');
        for (let i = 0; i < 15; i++) {
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.width = Math.random() * 10 + 5 + 'px';
            petal.style.height = petal.style.width;
            petal.style.left = Math.random() * 100 + '%';
            petal.style.animationDuration = Math.random() * 5 + 5 + 's';
            petal.style.animationDelay = Math.random() * 5 + 's';
            petalsContainer.appendChild(petal);
        }
    </script>
</body>
</html>
