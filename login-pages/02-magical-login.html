<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Kingdom - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #FFC0CB 0%, #FF69B4 50%, #FFB6C1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.4);
            width: 100%;
            max-width: 450px;
            animation: magicalAppear 1s ease;
            border: 3px solid rgba(255, 255, 255, 0.5);
            position: relative;
            z-index: 10;
        }
        
        @keyframes magicalAppear {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(-10deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }
        
        .logo {
            text-align: center;
            font-size: 60px;
            margin-bottom: 15px;
            animation: wandFloat 3s ease-in-out infinite;
        }
        
        @keyframes wandFloat {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        
        .title {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(45deg, #FF69B4, #FFB6C1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #FF69B4;
            margin-bottom: 30px;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #FF69B4;
            font-weight: bold;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 3px solid #FFB6C1;
            border-radius: 20px;
            font-size: 16px;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.8);
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #FF69B4;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.3);
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .remember-forgot label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #FF69B4;
            cursor: pointer;
            font-weight: 600;
        }
        
        .remember-forgot a {
            color: #FF69B4;
            text-decoration: none;
            font-weight: 600;
        }
        
        .remember-forgot a:hover {
            text-decoration: underline;
        }
        
        .login-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(45deg, #FF69B4, #FFB6C1);
            color: #fff;
            border: 3px solid #fff;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.4);
        }
        
        .login-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 105, 180, 0.6);
        }
        
        .magic-divider {
            text-align: center;
            margin: 30px 0;
            color: #FF69B4;
            font-weight: bold;
            font-size: 18px;
        }
        
        .signup-link {
            text-align: center;
            color: #FF69B4;
            font-weight: 600;
        }
        
        .signup-link a {
            color: #FF1493;
            text-decoration: none;
            font-weight: bold;
        }
        
        .signup-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="login-container">
        <div class="logo">🪄</div>
        <h1 class="title">✨ Magical Kingdom ✨</h1>
        <p class="subtitle">Transform into your magical form!</p>
        
        <form>
            <div class="form-group">
                <label for="email">✨ Magic Username</label>
                <input type="text" id="email" placeholder="Enter your magical name" required>
            </div>
            
            <div class="form-group">
                <label for="password">🔮 Secret Spell</label>
                <input type="password" id="password" placeholder="Enter your secret spell" required>
            </div>
            
            <div class="remember-forgot">
                <label>
                    <input type="checkbox">
                    Remember spell
                </label>
                <a href="#">Forgot spell?</a>
            </div>
            
            <button type="submit" class="login-btn">✨ Transform Now! ✨</button>
            
            <p class="magic-divider">★ ✦ ★ ✦ ★</p>
            
            <p class="signup-link">
                New to magic? <a href="#">Join the Kingdom!</a>
            </p>
        </form>
    </div>
    
    <script>
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 30; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 2 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsContainer.appendChild(star);
        }
    </script>
</body>
</html>
