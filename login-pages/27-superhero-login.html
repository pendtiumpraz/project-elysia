<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superhero HQ - Login</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            font-family: 'Impact', sans-serif;
            background: linear-gradient(135deg, #0066cc 0%, #003d99 50%, #001a4d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* CITY SKYLINE */
        .city-skyline {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 250px;
            background: linear-gradient(180deg, transparent 0%, #000 50%);
        }
        
        .building {
            position: absolute;
            bottom: 0;
            background: #000;
            opacity: 0.8;
        }
        
        .building-1 {left: 5%; width: 100px; height: 200px;}
        .building-2 {left: 20%; width: 80px; height: 150px;}
        .building-3 {left: 35%; width: 120px; height: 180px;}
        .building-4 {right: 30%; width: 90px; height: 160px;}
        .building-5 {right: 10%; width: 110px; height: 190px;}
        
        /* LIGHTNING BOLTS */
        .lightning-container {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .lightning {
            position: absolute;
            font-size: 80px;
            animation: lightning-flash 5s ease-in-out infinite;
            filter: drop-shadow(0 0 20px #ffff00);
        }
        
        @keyframes lightning-flash {
            0%, 90%, 100% {opacity: 0;}
            91%, 93%, 95%, 97% {opacity: 1;}
            92%, 94%, 96%, 98% {opacity: 0;}
        }
        
        /* CAPE FLOWING */
        .cape-bg {
            position: fixed;
            width: 300px;
            height: 100%;
            right: -100px;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 0, 0.3));
            animation: cape-flow 4s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes cape-flow {
            0%, 100% {transform: translateX(0);}
            50% {transform: translateX(-50px);}
        }
        
        /* PHONE BOOTH TRANSFORMATION */
        .hero-booth {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 50%, #990000 100%);
            width: 450px;
            padding: 50px;
            border: 8px solid #0066cc;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 30px 80px rgba(0, 102, 204, 0.8), inset 0 0 50px rgba(0, 102, 204, 0.2);
            position: relative;
            animation: booth-appear 1s ease-out;
        }
        
        @keyframes booth-appear {
            0% {
                transform: scale(0) rotate(180deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        
        .hero-emblem {
            text-align: center;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #ffff00, #ffd700);
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            border: 8px solid #0066cc;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.8);
            animation: emblem-glow 2s ease-in-out infinite;
        }
        
        @keyframes emblem-glow {
            0%, 100% {box-shadow: 0 0 50px rgba(255, 215, 0, 0.8);}
            50% {box-shadow: 0 0 80px rgba(255, 215, 0, 1);}
        }
        
        .title {
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            color: #ffff00;
            margin-bottom: 10px;
            text-shadow: 4px 4px 0 #000, 0 0 30px #ffff00;
            letter-spacing: 5px;
        }
        
        .subtitle {
            text-align: center;
            color: #fff;
            margin-bottom: 30px;
            font-size: 18px;
            text-shadow: 2px 2px 4px #000;
        }
        
        .power-level {
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid #ffff00;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .power-bar {
            height: 20px;
            background: linear-gradient(90deg, #00ff00, #ffff00, #ff0000);
            border-radius: 10px;
            margin-top: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.5);
            animation: power-pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes power-pulse {
            0%, 100% {transform: scaleX(0.95);}
            50% {transform: scaleX(1);}
        }
        
        .power-text {
            color: #ffff00;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px #ffff00;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ffff00;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #ffff00;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 3px solid #0066cc;
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s;
            font-family: 'Impact', sans-serif;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #ffff00;
            box-shadow: 0 0 30px rgba(255, 255, 0, 0.8);
        }
        
        .mask-icon {
            text-align: center;
            font-size: 70px;
            margin: 20px 0;
            animation: mask-reveal 2s ease-in-out infinite;
        }
        
        @keyframes mask-reveal {
            0%, 100% {transform: scale(1) rotate(0deg);}
            50% {transform: scale(1.1) rotate(-5deg);}
        }
        
        .activate-btn {
            width: 100%;
            padding: 22px;
            background: linear-gradient(135deg, #ffff00, #ffd700);
            color: #000;
            border: 5px solid #0066cc;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 5px;
            box-shadow: 0 10px 30px rgba(255, 255, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .activate-btn::before {
            content: '⚡';
            position: absolute;
            font-size: 40px;
            animation: power-surge 2s linear infinite;
        }
        
        @keyframes power-surge {
            0% {
                left: -60px;
                top: 50%;
                transform: translate(-50%, -50%);
            }
            100% {
                left: 110%;
                top: 50%;
                transform: translate(-50%, -50%);
            }
        }
        
        .activate-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 255, 0, 0.8);
        }
        
        .hq-link {
            text-align: center;
            margin-top: 20px;
            color: #fff;
            font-size: 14px;
            text-shadow: 1px 1px 2px #000;
        }
        
        .hq-link a {
            color: #ffff00;
            text-decoration: none;
            font-weight: bold;
            border-bottom: 2px solid #ffff00;
        }
    </style>
</head>
<body>
    <div class="city-skyline">
        <div class="building building-1"></div>
        <div class="building building-2"></div>
        <div class="building building-3"></div>
        <div class="building building-4"></div>
        <div class="building building-5"></div>
    </div>
    <div class="cape-bg"></div>
    <div class="lightning-container">
        <div class="lightning" style="top: 10%; left: 20%; animation-delay: 0s;">⚡</div>
        <div class="lightning" style="top: 15%; right: 25%; animation-delay: 2s;">⚡</div>
    </div>
    
    <div class="hero-booth">
        <div class="hero-emblem">🦸</div>
        
        <h1 class="title">HERO HQ</h1>
        <p class="subtitle">Justice League Access Terminal</p>
        
        <div class="power-level">
            <div class="power-text">⚡ POWER LEVEL: 9000+ ⚡</div>
            <div class="power-bar"></div>
        </div>
        
        <form>
            <div class="form-group">
                <label>🦸 Hero Name</label>
                <input type="text" placeholder="Your superhero alias" required>
            </div>
            
            <div class="form-group">
                <label>🔒 Secret Code</label>
                <input type="password" placeholder="Hero headquarters password" required>
            </div>
            
            <div class="mask-icon">🎭</div>
            
            <button type="submit" class="activate-btn">🚀 ACTIVATE POWERS 🚀</button>
            
            <p class="hq-link">
                New hero? <a href="#">Register for duty!</a>
            </p>
        </form>
    </div>
</body>
</html>
