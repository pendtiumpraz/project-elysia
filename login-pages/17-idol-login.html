<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idol Stage - Login</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #FF6FD8 0%, #3813C2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* STAGE CURTAIN EFFECT */
        .curtain-left, .curtain-right {
            position: fixed;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(to bottom, #8B0000, #c00);
            z-index: 1000;
            animation: curtain-open 2s ease-out forwards;
        }
        
        .curtain-left {
            left: 0;
            transform-origin: left;
        }
        
        .curtain-right {
            right: 0;
            transform-origin: right;
        }
        
        @keyframes curtain-open {
            0% {transform: scaleX(1);}
            100% {transform: scaleX(0);}
        }
        
        .spotlight {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3), transparent);
            border-radius: 50%;
            pointer-events: none;
            animation: spotlight-move 10s ease-in-out infinite;
        }
        
        @keyframes spotlight-move {
            0%, 100% {left: 20%; top: 10%;}
            25% {left: 70%; top: 20%;}
            50% {left: 50%; top: 60%;}
            75% {left: 10%; top: 40%;}
        }
        
        .sparkles {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .sparkle {
            position: absolute;
            background: radial-gradient(circle, #fff, transparent);
            border-radius: 50%;
            animation: sparkle-burst ease-out infinite;
        }
        
        @keyframes sparkle-burst {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: scale(2) rotate(180deg);
                opacity: 0;
            }
        }
        
        /* IDOL LOGIN PANEL */
        .idol-login {
            background: linear-gradient(135deg, rgba(255, 111, 216, 0.9), rgba(147, 51, 234, 0.9));
            padding: 50px;
            border-radius: 30px;
            width: 500px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            position: relative;
            border: 5px solid rgba(255, 255, 255, 0.3);
            animation: stage-rise 1s ease-out;
        }
        
        @keyframes stage-rise {
            0% {
                transform: translateY(100px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .stage-lights {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        
        .light {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            animation: light-blink 1s infinite;
        }
        
        .light:nth-child(1) {background: #ff0000; animation-delay: 0s;}
        .light:nth-child(2) {background: #00ff00; animation-delay: 0.2s;}
        .light:nth-child(3) {background: #0000ff; animation-delay: 0.4s;}
        .light:nth-child(4) {background: #ffff00; animation-delay: 0.6s;}
        .light:nth-child(5) {background: #ff00ff; animation-delay: 0.8s;}
        
        @keyframes light-blink {
            0%, 100% {opacity: 1; box-shadow: 0 0 20px currentColor;}
            50% {opacity: 0.3;}
        }
        
        .mic-icon {
            text-align: center;
            font-size: 100px;
            margin-bottom: 20px;
            animation: mic-bounce 2s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
        }
        
        @keyframes mic-bounce {
            0%, 100% {transform: translateY(0) rotate(-10deg);}
            50% {transform: translateY(-20px) rotate(10deg);}
        }
        
        .title {
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(45deg, #fff, #FF6FD8, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: rainbow-text 3s linear infinite;
        }
        
        @keyframes rainbow-text {
            0% {background-position: 0% 50%;}
            100% {background-position: 100% 50%;}
        }
        
        .subtitle {
            text-align: center;
            color: #fff;
            margin-bottom: 30px;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        
        .fan-counter {
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 25px;
            color: #fff;
            font-size: 14px;
            backdrop-filter: blur(5px);
        }
        
        .fan-count {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #FF6FD8;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #fff;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.9);
            color: #9333EA;
            font-size: 16px;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #fff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            background: #fff;
        }
        
        .form-group input::placeholder {
            color: rgba(147, 51, 234, 0.5);
        }
        
        .debut-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #fff, #FF6FD8);
            color: #9333EA;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 15px 40px rgba(255, 111, 216, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .debut-btn::before {
            content: '✨';
            position: absolute;
            font-size: 30px;
            animation: sparkle-move 2s linear infinite;
        }
        
        @keyframes sparkle-move {
            0% {left: -50px; top: 50%;}
            100% {left: 110%; top: 50%;}
        }
        
        .debut-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 50px rgba(255, 111, 216, 0.8);
        }
        
        .idol-link {
            text-align: center;
            margin-top: 20px;
            color: #fff;
            font-size: 14px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        
        .idol-link a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            border-bottom: 2px solid #fff;
        }
    </style>
</head>
<body>
    <div class="curtain-left"></div>
    <div class="curtain-right"></div>
    <div class="spotlight"></div>
    <div class="sparkles" id="sparkles"></div>
    
    <div class="idol-login">
        <div class="stage-lights">
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
        </div>
        
        <div class="mic-icon">🎤</div>
        <h1 class="title">IDOL STAGE</h1>
        <p class="subtitle">⭐ Your Moment to Shine ⭐</p>
        
        <div class="fan-counter">
            <div>💖 Fan Club Members 💖</div>
            <div class="fan-count">1,234,567</div>
        </div>
        
        <form>
            <div class="form-group">
                <label>🌟 Stage Name</label>
                <input type="text" placeholder="Your idol name" required>
            </div>
            
            <div class="form-group">
                <label>🎵 Secret Code</label>
                <input type="password" placeholder="Fan club password" required>
            </div>
            
            <button type="submit" class="debut-btn">✨ DEBUT NOW! ✨</button>
            
            <p class="idol-link">
                New fan? <a href="#">Join the Fan Club!</a>
            </p>
        </form>
    </div>
    
    <script>
        const sparklesContainer = document.getElementById('sparkles');
        for (let i = 0; i < 30; i++) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.width = Math.random() * 10 + 5 + 'px';
            sparkle.style.height = sparkle.style.width;
            sparkle.style.left = Math.random() * 100 + '%';
            sparkle.style.top = Math.random() * 100 + '%';
            sparkle.style.animationDuration = Math.random() * 2 + 1 + 's';
            sparkle.style.animationDelay = Math.random() * 3 + 's';
            sparklesContainer.appendChild(sparkle);
        }
    </script>
</body>
</html>
