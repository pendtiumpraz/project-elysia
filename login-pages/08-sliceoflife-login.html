<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Life Café - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FFF8DC 0%, #FFE4E1 50%, #F0E68C 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            animation: slideIn 1.2s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .cafe-header {
            text-align: center;
            margin-bottom: 35px;
        }
        
        .logo {
            font-size: 70px;
            margin-bottom: 15px;
            animation: gentle-bounce 3s ease-in-out infinite;
        }
        
        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .title {
            font-size: 32px;
            font-weight: bold;
            color: #8b4513;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #6d5d4b;
            font-size: 16px;
        }
        
        .welcome-message {
            background: rgba(255, 127, 80, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .welcome-message p {
            color: #6d5d4b;
            line-height: 1.6;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #5d4e37;
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #f0e68c;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #ff7f50;
            box-shadow: 0 0 0 3px rgba(255, 127, 80, 0.1);
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .remember-forgot label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #6d5d4b;
            cursor: pointer;
        }
        
        .remember-forgot a {
            color: #ff7f50;
            text-decoration: none;
            font-weight: 600;
        }
        
        .remember-forgot a:hover {
            text-decoration: underline;
        }
        
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, #ff7f50, #ff6347);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(255, 127, 80, 0.3);
        }
        
        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(255, 127, 80, 0.4);
        }
        
        .divider {
            text-align: center;
            margin: 30px 0;
            color: #8b7355;
            font-size: 14px;
        }
        
        .signup-link {
            text-align: center;
            color: #6d5d4b;
        }
        
        .signup-link a {
            color: #ff7f50;
            text-decoration: none;
            font-weight: 600;
        }
        
        .signup-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="cafe-header">
            <div class="logo">☕</div>
            <h1 class="title">Daily Life Café</h1>
            <p class="subtitle">Welcome back, friend!</p>
        </div>
        
        <div class="welcome-message">
            <p>🌸 Take a moment to relax and enjoy your day 🌸<br>
            Your favorite corner is waiting!</p>
        </div>
        
        <form>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="text" id="email" placeholder="your@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <div class="remember-forgot">
                <label>
                    <input type="checkbox">
                    Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>
            
            <button type="submit" class="login-btn">Sign In ☕</button>
            
            <p class="divider">• • •</p>
            
            <p class="signup-link">
                First time here? <a href="#">Create an account</a>
            </p>
        </form>
    </div>
</body>
</html>
