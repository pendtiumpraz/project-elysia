<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval Kingdom - Login</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(180deg, #2c1810 0%, #4a2c1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* CASTLE SILHOUETTE */
        .castle-bg {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 300px;
            background: linear-gradient(to top, #000 0%, transparent 100%);
        }
        
        /* TORCH FLAMES */
        .torches {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .torch {
            position: absolute;
            font-size: 60px;
            animation: torch-flicker 1.5s ease-in-out infinite;
        }
        
        .torch-left {left: 10%; top: 30%;}
        .torch-right {right: 10%; top: 30%;}
        
        @keyframes torch-flicker {
            0%, 100% {
                filter: drop-shadow(0 0 20px #ff6600);
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 40px #ff6600);
                transform: scale(1.1);
            }
        }
        
        /* BANNER FLAGS */
        .banners {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 20px;
        }
        
        .banner {
            font-size: 80px;
            animation: banner-wave 3s ease-in-out infinite;
        }
        
        @keyframes banner-wave {
            0%, 100% {transform: rotate(-5deg);}
            50% {transform: rotate(5deg);}
        }
        
        /* DRAWBRIDGE LOGIN */
        .kingdom-container {
            width: 550px;
            position: relative;
        }
        
        .drawbridge {
            background: linear-gradient(180deg, #654321 0%, #4a3117 100%);
            border: 8px solid #3a2410;
            padding: 50px;
            position: relative;
            background-image: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 20px,
                rgba(0, 0, 0, 0.2) 20px,
                rgba(0, 0, 0, 0.2) 22px
            );
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            animation: bridge-lower 2s ease-out;
        }
        
        @keyframes bridge-lower {
            from {
                transform: perspective(800px) rotateX(-90deg);
                transform-origin: top;
            }
            to {
                transform: perspective(800px) rotateX(0deg);
            }
        }
        
        .castle-top {
            position: absolute;
            top: -60px;
            left: -8px;
            right: -8px;
            height: 60px;
            background: #4a3117;
            border: 8px solid #3a2410;
            border-bottom: none;
            display: flex;
            justify-content: space-around;
        }
        
        .battlement {
            width: 60px;
            height: 100%;
            background: #654321;
            border-left: 3px solid #3a2410;
            border-right: 3px solid #3a2410;
        }
        
        .moat {
            position: absolute;
            bottom: -30px;
            left: -20px;
            right: -20px;
            height: 30px;
            background: linear-gradient(135deg, #003366, #004080);
            border-radius: 50%;
            animation: water-ripple 3s ease-in-out infinite;
        }
        
        @keyframes water-ripple {
            0%, 100% {box-shadow: 0 0 20px rgba(0, 51, 102, 0.5);}
            50% {box-shadow: 0 0 40px rgba(0, 51, 102, 0.8);}
        }
        
        .crown-icon {
            text-align: center;
            font-size: 100px;
            margin-bottom: 20px;
            animation: crown-shine 3s ease-in-out infinite;
            filter: drop-shadow(0 0 30px #FFD700);
        }
        
        @keyframes crown-shine {
            0%, 100% {transform: scale(1) rotate(-5deg);}
            50% {transform: scale(1.1) rotate(5deg);}
        }
        
        .title {
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 #8B4513, 0 0 20px #FFD700;
            letter-spacing: 5px;
        }
        
        .subtitle {
            text-align: center;
            color: #DEB887;
            margin-bottom: 30px;
            font-size: 18px;
            font-style: italic;
        }
        
        .herald-announcement {
            background: rgba(255, 215, 0, 0.1);
            border: 3px double #FFD700;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
            color: #FFD700;
            font-size: 14px;
        }
        
        .shield-emblem {
            text-align: center;
            font-size: 60px;
            margin: 20px 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #FFD700;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 2px;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 3px solid #8B4513;
            background: rgba(255, 215, 0, 0.05);
            color: #FFD700;
            font-size: 16px;
            transition: all 0.3s;
            font-family: 'Georgia', serif;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        
        .form-group input::placeholder {
            color: rgba(255, 215, 0, 0.5);
        }
        
        .knight-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #4a3117;
            border: 4px solid #8B4513;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        .knight-btn::before {
            content: '⚔️';
            position: absolute;
            font-size: 30px;
            animation: sword-strike 2.5s ease-in-out infinite;
        }
        
        @keyframes sword-strike {
            0% {
                left: -50px;
                top: 50%;
                transform: translate(-50%, -50%) rotate(-45deg);
            }
            50% {
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%) rotate(0deg);
            }
            100% {
                left: 110%;
                top: 50%;
                transform: translate(-50%, -50%) rotate(45deg);
            }
        }
        
        .knight-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.6);
        }
        
        .kingdom-link {
            text-align: center;
            margin-top: 20px;
            color: #DEB887;
            font-size: 14px;
        }
        
        .kingdom-link a {
            color: #FFD700;
            text-decoration: none;
            font-weight: bold;
            border-bottom: 1px solid #FFD700;
        }
    </style>
</head>
<body>
    <div class="castle-bg"></div>
    <div class="torches">
        <div class="torch torch-left">🔥</div>
        <div class="torch torch-right">🔥</div>
    </div>
    <div class="banners">
        <div class="banner">🚩</div>
        <div class="banner">🚩</div>
        <div class="banner">🚩</div>
    </div>
    
    <div class="kingdom-container">
        <div class="drawbridge">
            <div class="castle-top">
                <div class="battlement"></div>
                <div class="battlement"></div>
                <div class="battlement"></div>
                <div class="battlement"></div>
                <div class="battlement"></div>
            </div>
            
            <div class="crown-icon">👑</div>
            <h1 class="title">MEDIEVAL KINGDOM</h1>
            <p class="subtitle">Enter the Royal Castle</p>
            
            <div class="herald-announcement">
                📯 HEAR YE, HEAR YE! 📯<br>
                Royal entrance requires proper identification
            </div>
            
            <div class="shield-emblem">🛡️</div>
            
            <form>
                <div class="form-group">
                    <label>⚔️ Knight's Name</label>
                    <input type="text" placeholder="Enter thy noble name" required>
                </div>
                
                <div class="form-group">
                    <label>🗝️ Castle Key</label>
                    <input type="password" placeholder="Royal password" required>
                </div>
                
                <button type="submit" class="knight-btn">🏰 ENTER CASTLE 🏰</button>
                
                <p class="kingdom-link">
                    Seek knighthood? <a href="#">Pledge thy allegiance</a>
                </p>
            </form>
            
            <div class="moat"></div>
        </div>
    </div>
</body>
</html>
