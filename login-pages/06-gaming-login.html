<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Nexus - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', 'Helvetica', sans-serif;
            background: #0f0f1e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: linear-gradient(145deg, rgba(0, 255, 136, 0.1), rgba(0, 0, 0, 0.9));
            padding: 50px;
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.3), inset 0 0 50px rgba(0, 255, 136, 0.1);
            width: 100%;
            max-width: 450px;
            animation: glitchIn 1s ease;
        }
        
        @keyframes glitchIn {
            0%, 20%, 40%, 60%, 80%, 100% {
                transform: translateX(0);
                opacity: 1;
            }
            10%, 30%, 50%, 70%, 90% {
                transform: translateX(-5px);
                opacity: 0.8;
            }
        }
        
        .level-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            font-size: 60px;
            margin-bottom: 10px;
        }
        
        .level-badge {
            display: inline-block;
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            padding: 8px 20px;
            border: 2px solid #00ff88;
            border-radius: 50px;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 14px;
            letter-spacing: 2px;
        }
        
        .title {
            font-size: 32px;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 20px #00ff88;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .player-stats {
            background: rgba(0, 255, 136, 0.05);
            padding: 15px;
            margin: 20px 0;
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 5px;
        }
        
        .stat-line {
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin: 5px 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #00ff88;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 1px solid rgba(0, 255, 136, 0.5);
            border-radius: 5px;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.5);
            color: #00ff88;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }
        
        .form-group input::placeholder {
            color: rgba(0, 255, 136, 0.5);
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .remember-forgot label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #00ff88;
            cursor: pointer;
            font-size: 14px;
        }
        
        .remember-forgot a {
            color: #00ff88;
            text-decoration: none;
            font-size: 14px;
        }
        
        .remember-forgot a:hover {
            text-shadow: 0 0 10px #00ff88;
        }
        
        .login-btn {
            width: 100%;
            padding: 18px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.8);
        }
        
        .divider {
            text-align: center;
            margin: 25px 0;
            color: rgba(0, 255, 136, 0.5);
            font-size: 12px;
        }
        
        .signup-link {
            text-align: center;
            color: rgba(0, 255, 136, 0.7);
            font-size: 14px;
        }
        
        .signup-link a {
            color: #00ff88;
            text-decoration: none;
            font-weight: bold;
        }
        
        .signup-link a:hover {
            text-shadow: 0 0 10px #00ff88;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="level-header">
            <div class="logo">🎮</div>
            <div class="level-badge">⭐ LVL 99</div>
            <h1 class="title">Game Nexus</h1>
        </div>
        
        <div class="player-stats">
            <div class="stat-line">> STATUS: OFFLINE</div>
            <div class="stat-line">> PLAYERS ONLINE: 10,247</div>
            <div class="stat-line">> SERVER: ONLINE</div>
        </div>
        
        <form>
            <div class="form-group">
                <label for="email">[ Username ]</label>
                <input type="text" id="email" placeholder="Enter player name" required>
            </div>
            
            <div class="form-group">
                <label for="password">[ Password ]</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            
            <div class="remember-forgot">
                <label>
                    <input type="checkbox">
                    Auto-login
                </label>
                <a href="#">Reset?</a>
            </div>
            
            <button type="submit" class="login-btn">🎯 Start Game</button>
            
            <p class="divider">━━━━━━━━━━━━━━━</p>
            
            <p class="signup-link">
                New player? <a href="#">Create Account</a>
            </p>
        </form>
    </div>
</body>
</html>
