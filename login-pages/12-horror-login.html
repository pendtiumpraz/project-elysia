<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horror Night - Login</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            font-family: 'Creepster', 'Gothic', cursive;
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .blood-drip {
            position: fixed;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .drip {
            position: absolute;
            width: 2px;
            background: linear-gradient(180deg, #8B0000, transparent);
            animation: drip-fall linear infinite;
        }
        
        @keyframes drip-fall {
            from {height: 0; top: 0;}
            to {height: 100px; top: 100vh;}
        }
        
        .fog-effect {
            position: fixed;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(139, 0, 0, 0.3) 50%, #000 100%);
            animation: fog-move 20s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes fog-move {
            0%, 100% {transform: translate(0, 0);}
            50% {transform: translate(-50px, -50px);}
        }
        
        .login-container {
            background: rgba(20, 0, 0, 0.95);
            padding: 50px;
            border: 3px solid #8B0000;
            border-radius: 0;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 0 50px rgba(139, 0, 0, 0.8), inset 0 0 50px rgba(139, 0, 0, 0.2);
            position: relative;
            z-index: 10;
            clip-path: polygon(0 0, 100% 0, 100% 95%, 95% 100%, 0 100%);
        }
        
        .skull-logo {
            text-align: center;
            font-size: 100px;
            margin-bottom: 20px;
            animation: skull-shake 3s ease-in-out infinite;
            filter: drop-shadow(0 0 30px #8B0000);
        }
        
        @keyframes skull-shake {
            0%, 100% {transform: rotate(0deg);}
            10% {transform: rotate(-5deg);}
            20% {transform: rotate(5deg);}
            30% {transform: rotate(-5deg);}
            40% {transform: rotate(0deg);}
        }
        
        .title {
            text-align: center;
            font-size: 48px;
            color: #8B0000;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #8B0000, 0 0 40px #8B0000;
            font-family: 'Impact', sans-serif;
            letter-spacing: 5px;
            animation: flicker 2s ease-in-out infinite;
        }
        
        @keyframes flicker {
            0%, 100% {opacity: 1;}
            50% {opacity: 0.7;}
        }
        
        .subtitle {
            text-align: center;
            color: #ff0000;
            margin-bottom: 40px;
            font-size: 18px;
            font-family: Arial, sans-serif;
            text-shadow: 0 0 10px #8B0000;
        }
        
        .warning-box {
            background: rgba(139, 0, 0, 0.2);
            border: 2px dashed #8B0000;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
            color: #ff6b6b;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #8B0000;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 14px;
            font-family: Arial, sans-serif;
            text-shadow: 0 0 5px #8B0000;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #8B0000;
            background: rgba(0, 0, 0, 0.7);
            color: #ff6b6b;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.5);
            background: rgba(0, 0, 0, 0.9);
        }
        
        .form-group input::placeholder {
            color: rgba(255, 107, 107, 0.5);
        }
        
        .login-btn {
            width: 100%;
            padding: 18px;
            background: #8B0000;
            color: #fff;
            border: 2px solid #ff0000;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            font-family: Arial, sans-serif;
            letter-spacing: 3px;
            position: relative;
            overflow: hidden;
        }
        
        .login-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 0, 0, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .login-btn:hover::before {
            width: 400px;
            height: 400px;
        }
        
        .login-btn:hover {
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.8);
            border-color: #8B0000;
        }
        
        .blood-text {
            text-align: center;
            margin-top: 20px;
            color: #8B0000;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        
        .blood-text a {
            color: #ff0000;
            text-decoration: none;
            font-weight: bold;
            text-shadow: 0 0 5px #8B0000;
        }
        
        .blood-text a:hover {
            text-shadow: 0 0 15px #ff0000;
        }
    </style>
</head>
<body>
    <div class="fog-effect"></div>
    <div class="blood-drip" id="blood"></div>
    
    <div class="login-container">
        <div class="skull-logo">💀</div>
        <h1 class="title">HORROR NIGHT</h1>
        <p class="subtitle">Enter... if you dare</p>
        
        <div class="warning-box">
            ⚠️ WARNING: This area is cursed ⚠️
        </div>
        
        <form>
            <div class="form-group">
                <label>👻 Victim ID</label>
                <input type="text" placeholder="Your email... if you survive" required>
            </div>
            
            <div class="form-group">
                <label>🔒 Dark Password</label>
                <input type="password" placeholder="Enter the cursed words" required>
            </div>
            
            <button type="submit" class="login-btn">🩸 ENTER DARKNESS</button>
            
            <p class="blood-text">
                Fresh soul? <a href="#">Join the nightmare...</a>
            </p>
        </form>
    </div>
    
    <script>
        const bloodContainer = document.getElementById('blood');
        for (let i = 0; i < 15; i++) {
            const drip = document.createElement('div');
            drip.className = 'drip';
            drip.style.left = Math.random() * 100 + '%';
            drip.style.animationDuration = Math.random() * 3 + 2 + 's';
            drip.style.animationDelay = Math.random() * 5 + 's';
            bloodContainer.appendChild(drip);
        }
    </script>
</body>
</html>
