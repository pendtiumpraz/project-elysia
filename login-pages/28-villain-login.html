<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villain Lair - Login</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            font-family: 'Impact', sans-serif;
            background: linear-gradient(135deg, #1a0033 0%, #2d0052 50%, #4d0080 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* EVIL EYES WATCHING */
        .evil-eyes {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .eyes {
            position: absolute;
            font-size: 60px;
            animation: eyes-blink 4s ease-in-out infinite;
            filter: drop-shadow(0 0 20px #ff0000);
        }
        
        @keyframes eyes-blink {
            0%, 100% {opacity: 1;}
            48%, 52% {opacity: 0;}
        }
        
        /* PURPLE SMOKE */
        .smoke-effect {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(138, 43, 226, 0.3) 0%, transparent 70%);
            animation: smoke-move 10s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes smoke-move {
            0%, 100% {transform: scale(1) rotate(0deg);}
            50% {transform: scale(1.2) rotate(180deg);}
        }
        
        /* LAIR ENTRANCE - LASER GRID */
        .villain-lair {
            background: linear-gradient(135deg, #1a0033, #000);
            width: 500px;
            padding: 50px;
            border: 5px solid #8B00FF;
            border-radius: 0;
            box-shadow: 0 0 100px rgba(139, 0, 255, 0.8), inset 0 0 50px rgba(139, 0, 255, 0.2);
            position: relative;
            clip-path: polygon(10% 0%, 90% 0%, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0% 90%, 0% 10%);
        }
        
        .laser-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 48px, rgba(255, 0, 0, 0.3) 48px, rgba(255, 0, 0, 0.3) 50px),
                repeating-linear-gradient(90deg, transparent, transparent 48px, rgba(255, 0, 0, 0.3) 48px, rgba(255, 0, 0, 0.3) 50px);
            pointer-events: none;
            animation: laser-scan 5s linear infinite;
        }
        
        @keyframes laser-scan {
            0% {opacity: 0.3;}
            50% {opacity: 0.7;}
            100% {opacity: 0.3;}
        }
        
        .doom-button {
            text-align: center;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #ff0000, #cc0000);
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            border: 10px solid #8B00FF;
            box-shadow: 0 0 60px rgba(255, 0, 0, 0.8), inset 0 0 30px rgba(0, 0, 0, 0.5);
            animation: doom-pulse 1.5s ease-in-out infinite;
            cursor: pointer;
        }
        
        @keyframes doom-pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 60px rgba(255, 0, 0, 0.8);
            }
            50% {
                transform: scale(1.1);
                box-shadow: 0 0 100px rgba(255, 0, 0, 1);
            }
        }
        
        .title {
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            color: #8B00FF;
            margin-bottom: 10px;
            text-shadow: 0 0 30px #8B00FF, 4px 4px 0 #000;
            letter-spacing: 5px;
        }
        
        .subtitle {
            text-align: center;
            color: #ff00ff;
            margin-bottom: 30px;
            font-size: 16px;
            text-shadow: 0 0 10px #ff00ff;
            font-style: italic;
        }
        
        .evil-laugh {
            text-align: center;
            font-size: 24px;
            color: #8B00FF;
            margin-bottom: 25px;
            animation: laugh-shake 0.5s ease-in-out infinite;
        }
        
        @keyframes laugh-shake {
            0%, 100% {transform: translateX(0);}
            25% {transform: translateX(-2px);}
            75% {transform: translateX(2px);}
        }
        
        .minion-counter {
            background: rgba(139, 0, 255, 0.2);
            border: 2px solid #8B00FF;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
            color: #ff00ff;
            font-size: 18px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #8B00FF;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #8B00FF;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 3px solid #8B00FF;
            background: rgba(0, 0, 0, 0.7);
            color: #ff00ff;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #ff0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
        }
        
        .form-group input::placeholder {
            color: rgba(255, 0, 255, 0.5);
        }
        
        .evil-icon {
            text-align: center;
            font-size: 80px;
            margin: 20px 0;
            animation: evil-spin 3s linear infinite;
        }
        
        @keyframes evil-spin {
            from {transform: rotate(0deg);}
            to {transform: rotate(360deg);}
        }
        
        .dominate-btn {
            width: 100%;
            padding: 22px;
            background: linear-gradient(135deg, #8B00FF, #ff00ff);
            color: #fff;
            border: 5px solid #000;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 5px;
            box-shadow: 0 10px 30px rgba(139, 0, 255, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .dominate-btn::before {
            content: '💀';
            position: absolute;
            font-size: 40px;
            animation: skull-float 3s ease-in-out infinite;
        }
        
        @keyframes skull-float {
            0%, 100% {
                left: -60px;
                top: 50%;
                transform: translate(-50%, -50%) rotate(0deg);
            }
            50% {
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%) rotate(360deg);
            }
            100% {
                left: 110%;
                top: 50%;
                transform: translate(-50%, -50%) rotate(720deg);
            }
        }
        
        .dominate-btn:hover {
            background: linear-gradient(135deg, #ff00ff, #ff0000);
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 0, 255, 0.8);
        }
        
        .lair-link {
            text-align: center;
            margin-top: 20px;
            color: #8B00FF;
            font-size: 14px;
        }
        
        .lair-link a {
            color: #ff00ff;
            text-decoration: none;
            font-weight: bold;
            border-bottom: 2px solid #ff00ff;
        }
        
        .dungeon-bars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(90deg, transparent, transparent 38px, rgba(139, 0, 255, 0.3) 38px, rgba(139, 0, 255, 0.3) 42px);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="smoke-effect"></div>
    <div class="evil-eyes">
        <div class="eyes" style="top: 10%; left: 15%; animation-delay: 0s;">👁️</div>
        <div class="eyes" style="top: 20%; right: 20%; animation-delay: 1s;">👁️</div>
        <div class="eyes" style="bottom: 30%; left: 25%; animation-delay: 2s;">👁️</div>
    </div>
    
    <div class="villain-lair">
        <div class="laser-grid"></div>
        <div class="dungeon-bars"></div>
        
        <div class="doom-button">💣</div>
        
        <h1 class="title">VILLAIN LAIR</h1>
        <p class="subtitle">Evil Genius Access Only</p>
        
        <div class="evil-laugh">
            MUAHAHAHA! 😈
        </div>
        
        <div class="minion-counter">
            👥 MINION ARMY: 10,000+<br>
            🌍 WORLD DOMINATION: 37%
        </div>
        
        <form>
            <div class="form-group">
                <label>😈 Villain Name</label>
                <input type="text" placeholder="Your evil alias" required>
            </div>
            
            <div class="form-group">
                <label>🔒 Lair Code</label>
                <input type="password" placeholder="Secret evil password" required>
            </div>
            
            <div class="evil-icon">☠️</div>
            
            <button type="submit" class="dominate-btn">⚡ UNLEASH EVIL ⚡</button>
            
            <p class="lair-link">
                Join the dark side? <a href="#">Recruit minions here...</a>
            </p>
        </form>
    </div>
</body>
</html>
