<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wild West - Login</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            font-family: 'Impact', sans-serif;
            background: linear-gradient(180deg, #d4965d 0%, #c88552 50%, #8B4513 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* DESERT SUNSET */
        .desert-sun {
            position: fixed;
            top: 80px;
            right: 150px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #ff6b35 0%, #ff8c42 100%);
            border-radius: 50%;
            box-shadow: 0 0 150px rgba(255, 107, 53, 0.8);
            animation: sun-pulse 5s ease-in-out infinite;
        }
        
        @keyframes sun-pulse {
            0%, 100% {transform: scale(1);}
            50% {transform: scale(1.1);}
        }
        
        /* TUMBLEWEED */
        .tumbleweed-container {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .tumbleweed {
            position: absolute;
            font-size: 50px;
            bottom: 20%;
            animation: tumble linear infinite;
        }
        
        @keyframes tumble {
            0% {
                left: -100px;
                transform: rotate(0deg);
            }
            100% {
                left: 110%;
                transform: rotate(720deg);
            }
        }
        
        /* WANTED POSTER DESIGN */
        .saloon-entrance {
            background: linear-gradient(to bottom, #f4e4c1, #d4b896);
            width: 500px;
            border: 15px solid #8B4513;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            position: relative;
        }
        
        .wooden-sign {
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            background: #8B4513;
            padding: 15px 40px;
            border: 5px solid #654321;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .sign-text {
            color: #FFD700;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 5px;
            text-shadow: 3px 3px 0 #000;
        }
        
        .sign-chain {
            position: absolute;
            top: -60px;
            width: 5px;
            height: 60px;
            background: repeating-linear-gradient(
                0deg,
                #8B4513,
                #8B4513 8px,
                #654321 8px,
                #654321 16px
            );
        }
        
        .chain-left {left: 30px;}
        .chain-right {right: 30px;}
        
        .wanted-header {
            background: #000;
            color: #fff;
            text-align: center;
            padding: 25px;
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 10px;
            border-bottom: 5px solid #8B4513;
        }
        
        .content {
            padding: 40px;
        }
        
        .sheriff-badge {
            text-align: center;
            font-size: 120px;
            margin-bottom: 20px;
            animation: badge-shine 3s ease-in-out infinite;
            filter: drop-shadow(0 0 30px #FFD700);
        }
        
        @keyframes badge-shine {
            0%, 100% {transform: rotate(-10deg) scale(1);}
            50% {transform: rotate(10deg) scale(1.1);}
        }
        
        .bounty-amount {
            text-align: center;
            font-size: 36px;
            color: #8B0000;
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 2px 2px 0 #000;
        }
        
        .rope-lasso {
            width: 100%;
            height: 30px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="30"><path d="M0,15 Q50,5 100,15 T200,15" stroke="%238B4513" stroke-width="5" fill="none"/></svg>');
            background-repeat: repeat-x;
            margin: 20px 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #8B4513;
            font-weight: bold;
            font-size: 18px;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 4px solid #8B4513;
            background: #fffef7;
            color: #654321;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Georgia', serif;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        
        .cowboy-icons {
            text-align: center;
            font-size: 60px;
            margin: 25px 0;
        }
        
        .draw-btn {
            width: 100%;
            padding: 22px;
            background: #8B4513;
            color: #FFD700;
            border: 5px solid #654321;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 5px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .draw-btn::before {
            content: '🔫';
            position: absolute;
            font-size: 40px;
            animation: gun-draw 2s ease-in-out infinite;
        }
        
        @keyframes gun-draw {
            0% {
                left: 20%;
                bottom: -50px;
                transform: rotate(45deg);
            }
            50% {
                left: 20%;
                bottom: 50%;
                transform: rotate(0deg);
            }
            100% {
                left: 20%;
                bottom: -50px;
                transform: rotate(45deg);
            }
        }
        
        .draw-btn:hover {
            background: #654321;
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
        }
        
        .saloon-link {
            text-align: center;
            margin-top: 25px;
            color: #8B4513;
            font-size: 16px;
            font-family: 'Georgia', serif;
        }
        
        .saloon-link a {
            color: #8B0000;
            text-decoration: none;
            font-weight: bold;
            border-bottom: 2px solid #8B0000;
        }
        
        .horseshoe {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 40px;
            transform: rotate(45deg);
        }
    </style>
</head>
<body>
    <div class="desert-sun"></div>
    <div class="tumbleweed-container">
        <div class="tumbleweed" style="animation-duration: 12s;">🌾</div>
        <div class="tumbleweed" style="animation-duration: 15s; animation-delay: 5s;">🌾</div>
    </div>
    
    <div class="saloon-entrance">
        <div class="wooden-sign">
            <div class="sign-text">SALOON</div>
        </div>
        <div class="sign-chain chain-left"></div>
        <div class="sign-chain chain-right"></div>
        <div class="horseshoe">🐴</div>
        
        <div class="wanted-header">WANTED</div>
        
        <div class="content">
            <div class="sheriff-badge">⭐</div>
            
            <div class="bounty-amount">
                💰 REWARD: $5000 💰
            </div>
            
            <div class="rope-lasso"></div>
            
            <form>
                <div class="form-group">
                    <label>🤠 Cowboy Name</label>
                    <input type="text" placeholder="Enter your alias, partner" required>
                </div>
                
                <div class="form-group">
                    <label>🔒 Sheriff Code</label>
                    <input type="password" placeholder="Secret saloon password" required>
                </div>
                
                <div class="cowboy-icons">🐴 🌵 🔫</div>
                
                <button type="submit" class="draw-btn">🔫 ENTER SALOON 🔫</button>
                
                <p class="saloon-link">
                    New in town? <a href="#">Join the posse!</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
