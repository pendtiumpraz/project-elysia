<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Personal Portfolio</title><style>*{margin:0;padding:0;}body{font-family:Arial;background:#fff;}.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;}.avatar{width:200px;height:200px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-size:96px;margin:0 auto 30px;animation:zoomIn 1s;}h1{font-size:64px;margin-bottom:10px;color:#333;animation:fadeIn 1s 0.2s backwards;}h2{font-size:24px;color:#667eea;margin-bottom:30px;animation:fadeIn 1s 0.4s backwards;}p{font-size:18px;color:#666;max-width:600px;margin:0 auto 40px;animation:fadeIn 1s 0.6s backwards;}.social{display:flex;gap:20px;justify-content:center;font-size:32px;animation:fadeIn 1s 0.8s backwards;}@keyframes zoomIn{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}@keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}</style></head><body><div class="hero"><div><div class="avatar">👨‍💻</div><h1>John Doe</h1><h2>Full Stack Developer</h2><p>Creating beautiful and functional web experiences with modern technologies</p><div class="social"><span>💼</span><span>🐦</span><span>📧</span></div></div></div></body></html>
