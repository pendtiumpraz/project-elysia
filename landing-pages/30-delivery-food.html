<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Food Delivery</title><style>*{margin:0;padding:0;}body{font-family:Arial;background:#fff;}.hero{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;align-items:center;padding:0 100px;}.text h1{font-size:64px;color:#333;margin-bottom:20px;animation:slideRight 1s;}.text p{font-size:20px;color:#666;margin-bottom:40px;animation:slideRight 1s 0.2s backwards;}.order{padding:18px 50px;background:#ff5722;color:#fff;border:none;font-size:16px;font-weight:bold;border-radius:8px;cursor:pointer;animation:slideRight 1s 0.4s backwards;}.food{width:100%;height:500px;background:linear-gradient(135deg,#ff5722,#ff9800);border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:128px;animation:slideLeft 1s;}@keyframes slideRight{from{opacity:0;transform:translateX(-50px);}to{opacity:1;transform:translateX(0);}}@keyframes slideLeft{from{opacity:0;transform:translateX(50px);}to{opacity:1;transform:translateX(0);}}</style></head><body><div class="hero"><div class="text"><h1>Hungry? Order Now!</h1><p>Get your favorite food delivered to your doorstep</p><button class="order">Order Food</button></div><div class="food">🍕</div></div></body></html>
