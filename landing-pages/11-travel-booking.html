<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Travel Booking</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:Arial;}.hero{min-height:100vh;background:linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)),url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="%2300bcd4" width="100" height="100"/></svg>');background-size:cover;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;}h1{font-size:72px;margin-bottom:20px;animation:fadeIn 1s;}p{font-size:24px;margin-bottom:50px;animation:fadeIn 1s 0.2s backwards;}.search{background:#fff;padding:30px;border-radius:15px;display:flex;gap:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);animation:fadeUp 1s 0.4s backwards;}input,select{padding:15px;border:2px solid #ddd;border-radius:8px;font-size:16px;}button{padding:15px 40px;background:#00bcd4;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;}@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}@keyframes fadeUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}</style></head><body><div class="hero"><div><h1>Explore The World</h1><p>Find your perfect destination</p><div class="search"><input placeholder="Destination"><input type="date"><select><option>2 Adults</option></select><button>Search</button></div></div></div></body></html>
