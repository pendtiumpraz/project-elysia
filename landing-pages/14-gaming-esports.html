<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Gaming Platform</title><style>*{margin:0;padding:0;}body{font-family:Arial;background:#0f0f23;color:#fff;}.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;}.bg{position:absolute;width:100%;height:100%;background:repeating-linear-gradient(0deg,rgba(255,0,255,0.1) 0px,transparent 1px,transparent 2px,rgba(255,0,255,0.1) 3px);animation:scan 8s linear infinite;}@keyframes scan{0%{transform:translateY(0);}100%{transform:translateY(100px);}}h1{font-size:96px;margin-bottom:20px;background:linear-gradient(135deg,#ff00ff,#00ffff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;position:relative;z-index:2;animation:glitch 2s infinite;}p{font-size:24px;color:#aaa;margin-bottom:50px;position:relative;z-index:2;}.play{padding:20px 60px;background:linear-gradient(135deg,#ff00ff,#00ffff);border:none;color:#000;font-size:18px;font-weight:bold;border-radius:0;cursor:pointer;position:relative;z-index:2;}@keyframes glitch{0%,100%{text-shadow:0 0 10px #ff00ff;}50%{text-shadow:0 0 20px #00ffff;}}</style></head><body><div class="hero"><div class="bg"></div><div><h1>LEVEL UP</h1><p>Join the ultimate gaming experience</p><button class="play">Play Now</button></div></div></body></html>
