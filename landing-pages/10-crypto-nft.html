<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Crypto NFT</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:Arial;background:#0a0e27;color:#fff;overflow-x:hidden;}.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;background:radial-gradient(circle at 50% 50%,rgba(138,43,226,0.2),transparent);}.glow{position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(138,43,226,0.5),transparent);border-radius:50%;animation:pulse 4s infinite;filter:blur(100px);}@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}.content{z-index:2;}h1{font-size:72px;margin-bottom:20px;background:linear-gradient(135deg,#8a2be2,#00ffff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:fadeIn 1s;}p{font-size:20px;color:#aaa;margin-bottom:40px;max-width:600px;animation:fadeIn 1s 0.2s backwards;}.btn-group{display:flex;gap:20px;justify-content:center;animation:fadeIn 1s 0.4s backwards;}.btn-primary{padding:18px 40px;background:linear-gradient(135deg,#8a2be2,#00ffff);border:none;border-radius:50px;color:#fff;font-weight:bold;cursor:pointer;transition:transform 0.3s;}.btn-primary:hover{transform:scale(1.05);}.btn-secondary{padding:18px 40px;background:transparent;border:2px solid #8a2be2;border-radius:50px;color:#fff;font-weight:bold;cursor:pointer;transition:all 0.3s;}.btn-secondary:hover{background:#8a2be2;}.stats{display:flex;gap:80px;margin-top:80px;animation:fadeIn 1s 0.6s backwards;}.stat h3{font-size:48px;color:#00ffff;}.stat p{color:#aaa;}@keyframes fadeIn{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}</style></head><body><div class="hero"><div class="glow"></div><div class="content"><h1>Discover NFT Universe</h1><p>Create, collect, and sell extraordinary NFTs on the world's first & largest NFT marketplace</p><div class="btn-group"><button class="btn-primary">Explore</button><button class="btn-secondary">Create</button></div><div class="stats"><div class="stat"><h3>2.5M+</h3><p>Artworks</p></div><div class="stat"><h3>500K+</h3><p>Artists</p></div><div class="stat"><h3>$2B+</h3><p>Volume</p></div></div></div></div></body></html>
