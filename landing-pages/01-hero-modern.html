<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Modern Hero Landing</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:Arial,sans-serif;}.hero{min-height:100vh;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;position:relative;overflow:hidden;}.content{z-index:2;animation:fadeUp 1s;}h1{font-size:72px;margin-bottom:20px;animation:fadeUp 1s 0.2s backwards;}p{font-size:24px;margin-bottom:40px;animation:fadeUp 1s 0.4s backwards;}.cta{padding:20px 50px;background:#fff;color:#667eea;border:none;border-radius:50px;font-size:18px;font-weight:bold;cursor:pointer;animation:fadeUp 1s 0.6s backwards;transition:all 0.3s;}.cta:hover{transform:translateY(-5px);box-shadow:0 20px 40px rgba(0,0,0,0.3);}@keyframes fadeUp{from{opacity:0;transform:translateY(50px);}to{opacity:1;transform:translateY(0);}}.bg-shape{position:absolute;border-radius:50%;opacity:0.1;}.bg-shape:nth-child(1){width:500px;height:500px;background:#fff;top:-200px;left:-200px;animation:float 6s infinite;}.bg-shape:nth-child(2){width:300px;height:300px;background:#fff;bottom:-100px;right:-100px;animation:float 8s infinite;}@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-30px);}}</style></head><body><div class="hero"><div class="bg-shape"></div><div class="bg-shape"></div><div class="content"><h1>Welcome to the Future</h1><p>Build amazing experiences with modern design</p><button class="cta">Get Started</button></div></div></body></html>
