<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Podcast Platform</title><style>*{margin:0;padding:0;}body{font-family:Arial;background:#000;color:#fff;}.hero{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;align-items:center;padding:0 100px;gap:50px;}.text h1{font-size:64px;margin-bottom:20px;background:linear-gradient(135deg,#ff00ff,#00ffff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:slideRight 1s;}.text p{font-size:20px;color:#aaa;margin-bottom:40px;animation:slideRight 1s 0.2s backwards;}.listen{padding:18px 50px;background:linear-gradient(135deg,#ff00ff,#00ffff);border:none;color:#000;font-weight:bold;font-size:16px;cursor:pointer;border-radius:50px;animation:slideRight 1s 0.4s backwards;}.podcast{width:100%;height:500px;background:linear-gradient(135deg,#ff00ff,#00ffff);border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:128px;animation:slideLeft 1s;}@keyframes slideRight{from{opacity:0;transform:translateX(-50px);}to{opacity:1;transform:translateX(0);}}@keyframes slideLeft{from{opacity:0;transform:translateX(50px);}to{opacity:1;transform:translateX(0);}}</style></head><body><div class="hero"><div class="text"><h1>Listen To Amazing Podcasts</h1><p>Discover stories, ideas, and insights from the world's best creators</p><button class="listen">Start Listening</button></div><div class="podcast">🎙️</div></div></body></html>
