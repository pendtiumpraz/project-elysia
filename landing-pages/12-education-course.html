<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Online Learning</title><style>*{margin:0;padding:0;}body{font-family:Arial;background:#f5f5f5;}.hero{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;align-items:center;padding:0 100px;gap:50px;}.text h1{font-size:64px;color:#333;margin-bottom:20px;animation:slideRight 1s;}.text p{font-size:20px;color:#666;margin-bottom:40px;animation:slideRight 1s 0.2s backwards;}.enroll{padding:18px 50px;background:#4caf50;color:#fff;border:none;font-size:16px;font-weight:bold;cursor:pointer;border-radius:8px;animation:slideRight 1s 0.4s backwards;}.courses{width:100%;height:500px;background:linear-gradient(135deg,#4caf50,#8bc34a);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:128px;animation:slideLeft 1s;}@keyframes slideRight{from{opacity:0;transform:translateX(-50px);}to{opacity:1;transform:translateX(0);}}@keyframes slideLeft{from{opacity:0;transform:translateX(50px);}to{opacity:1;transform:translateX(0);}}</style></head><body><div class="hero"><div class="text"><h1>Learn Anytime, Anywhere</h1><p>Access 10,000+ courses from world-class instructors</p><button class="enroll">Start Learning</button></div><div class="courses">📚</div></div></body></html>
