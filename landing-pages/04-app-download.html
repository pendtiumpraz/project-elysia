<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>App Download</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;}.container{max-width:1200px;display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;padding:50px;}.text h1{font-size:64px;margin-bottom:20px;animation:slideRight 1s;}.text p{font-size:20px;margin-bottom:40px;opacity:0.9;animation:slideRight 1s 0.2s backwards;}.download-btns{display:flex;gap:15px;animation:slideRight 1s 0.4s backwards;}.btn{padding:15px 30px;background:#000;color:#fff;border-radius:12px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:transform 0.3s;}.btn:hover{transform:translateY(-5px);}.phone{position:relative;animation:slideLeft 1s;}.phone-frame{width:300px;height:600px;background:#000;border-radius:40px;border:15px solid #333;display:flex;align-items:center;justify-content:center;box-shadow:0 30px 80px rgba(0,0,0,0.5);}.screen{width:100%;height:100%;background:linear-gradient(180deg,#00ffff,#ff00ff);border-radius:25px;display:flex;align-items:center;justify-content:center;font-size:72px;}@keyframes slideRight{from{opacity:0;transform:translateX(-50px);}to{opacity:1;transform:translateX(0);}}@keyframes slideLeft{from{opacity:0;transform:translateX(50px);}to{opacity:1;transform:translateX(0);}}</style></head><body><div class="container"><div class="text"><h1>Download Our App</h1><p>Experience the best mobile application with amazing features and stunning design.</p><div class="download-btns"><div class="btn">🍎 App Store</div><div class="btn">🤖 Google Play</div></div></div><div class="phone"><div class="phone-frame"><div class="screen">📱</div></div></div></div></body></html>
