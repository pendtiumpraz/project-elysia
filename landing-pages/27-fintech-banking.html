<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Fintech Banking</title><style>*{margin:0;padding:0;}body{font-family:Arial;background:#fff;}.hero{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;align-items:center;padding:0 100px;}.text h1{font-size:64px;color:#333;margin-bottom:20px;animation:slideRight 1s;}.text p{font-size:20px;color:#666;margin-bottom:40px;animation:slideRight 1s 0.2s backwards;}.open{padding:18px 50px;background:#00c853;color:#fff;border:none;font-size:16px;font-weight:bold;border-radius:8px;cursor:pointer;animation:slideRight 1s 0.4s backwards;}.card{width:100%;height:400px;background:linear-gradient(135deg,#00c853,#64dd17);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:128px;box-shadow:0 20px 60px rgba(0,200,83,0.3);animation:slideLeft 1s;}@keyframes slideRight{from{opacity:0;transform:translateX(-50px);}to{opacity:1;transform:translateX(0);}}@keyframes slideLeft{from{opacity:0;transform:translateX(50px);}to{opacity:1;transform:translateX(0);}}</style></head><body><div class="hero"><div class="text"><h1>Banking Made Simple</h1><p>Open your account in minutes and manage your finances smartly</p><button class="open">Open Account</button></div><div class="card">💳</div></div></body></html>
