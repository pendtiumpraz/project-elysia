<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Product Showcase</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:Arial;background:#000;color:#fff;}.container{max-width:1200px;margin:0 auto;padding:100px 20px;}.hero{display:grid;grid-template-columns:1fr 1fr;gap:100px;align-items:center;}.text h1{font-size:64px;margin-bottom:20px;background:linear-gradient(135deg,#00ffff,#ff00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:slideRight 1s;}.text p{font-size:20px;color:#aaa;margin-bottom:30px;line-height:1.6;animation:slideRight 1s 0.2s backwards;}.btn{display:inline-block;padding:18px 40px;background:linear-gradient(135deg,#00ffff,#ff00ff);border-radius:50px;color:#000;font-weight:bold;text-decoration:none;animation:slideRight 1s 0.4s backwards;transition:transform 0.3s;}.btn:hover{transform:scale(1.05);}.product{position:relative;animation:slideLeft 1s;}.product-img{width:100%;height:500px;background:linear-gradient(135deg,#00ffff,#ff00ff);border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:128px;box-shadow:0 30px 80px rgba(0,255,255,0.3);}@keyframes slideRight{from{opacity:0;transform:translateX(-50px);}to{opacity:1;transform:translateX(0);}}@keyframes slideLeft{from{opacity:0;transform:translateX(50px);}to{opacity:1;transform:translateX(0);}}</style></head><body><div class="container"><div class="hero"><div class="text"><h1>Revolutionary Product</h1><p>Experience the next generation of innovation. Built for creators, designed for excellence.</p><a href="#" class="btn">Try It Free</a></div><div class="product"><div class="product-img">🚀</div></div></div></div></body></html>
